<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Progress</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;font-size:13px}
body{margin:0;background:#f0f0f0;color:#333}
.top{background:#2b2b2b;color:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.top a{color:#ffcc00;margin-left:10px}
.wrap{max-width:1000px;margin:15px auto;padding:0 10px}
.card{background:#fff;border:1px solid #ccc;padding:12px;margin-bottom:12px;border-radius:4px;overflow-x:auto}
h3{margin:0 0 8px;color:#31708f}
h2{margin:6px 0 10px;font-size:16px;color:#31708f}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.k{background:#e8f0f8;padding:10px;text-align:center;border-radius:4px;border:1px solid #d0e1f9}
.k .l{font-size:12px;color:#444}
.k b{display:block;font-size:18px;margin-top:4px}
.k .s{display:block;font-size:11px;color:#555;margin-top:3px;border-top:1px dashed #bcdff5;padding-top:3px}
.best{border:2px solid #f0ad4e}
.badge{display:inline-block;background:#f0ad4e;color:#fff;font-weight:bold;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px}
.head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.head .nm{font-size:15px;font-weight:bold;color:#31708f}
.head .dt{font-size:12px;color:#666;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:#e8f0f8;border:1px solid #d0e1f9;border-radius:4px;padding:5px 10px;text-align:center}
.chip span{display:block;font-size:11px;color:#555}
.chip b{font-size:14px}
table{width:100%;border-collapse:collapse}
th{background:#c6d9f1;border:1px solid #8ea9db;padding:6px}
td{border:1px solid #ccc;padding:6px;text-align:center;white-space:nowrap}
.c{color:#2e7d32;font-weight:bold}.w{color:#d9534f;font-weight:bold}.u{color:#888;font-weight:bold}
button,.btn{padding:6px 12px;border:1px solid #bbb;background:#fff;cursor:pointer;border-radius:3px;text-decoration:none;color:#333;display:inline-block}
.btn.p{background:#33a6ea;color:#fff;border:0}
.btn.g{background:#2e7d32;color:#fff;border:0}
details summary{cursor:pointer;font-weight:bold;color:#31708f}
.up{color:#2e7d32;font-weight:bold}.dn{color:#d9534f;font-weight:bold}
.empty{text-align:center;padding:20px;color:#666}
</style><link rel="stylesheet" href="app.css?v=5"></head><body>
<div class="top"><b>📈 My Progress</b></div>
<div class="wrap">
  <div class="card" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <b>कौन सी Progress देखनी है?</b>
    <select id="pf" onchange="setF(this.value)" style="min-width:180px">
      <option value="full">Fresh Test (Full Test)</option>
      <option value="sectional">Sectional Test (Subject-wise)</option>
    </select>
    <div id="subjectFilterContainer" style="display:flex;align-items:center;gap:6px;flex:1"></div>
  </div>
  <div id="root"></div>
</div><script src="nav.js?v=5"></script>

<div id="reModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9999;justify-content:center;align-items:center">
  <div style="background:#fff;padding:20px;border-radius:6px;width:300px;text-align:center;box-shadow:0 4px 8px rgba(0,0,0,.2)">
    <h4 style="margin:0 0 10px;font-size:15px">Re-attempt Test</h4>
    <div id="reInfo" style="margin:0 0 10px;padding:8px;background:#e8f0f8;border-radius:4px;text-align:left;font-size:12px;line-height:1.6"></div>
    <p style="margin:0 0 20px;color:#555">क्या आप यह टेस्ट दोबारा देना चाहते हैं? आपके पिछले attempts यहाँ सुरक्षित रहेंगे।</p>
    <div style="display:flex;justify-content:space-around">
      <button onclick="closeRe()" style="background:#ccc;border:0;font-weight:bold">Cancel</button>
      <button onclick="goRe()" style="background:#2e7d32;color:#fff;border:0;font-weight:bold">Yes, Re-attempt</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let A=[];
try{A=JSON.parse(localStorage.getItem('examAttempts'))||[]}catch(e){}
A=A.filter(a=>a&&Array.isArray(a.sections));
let BMX=[];try{BMX=JSON.parse(localStorage.getItem('examBookmarks'))||[]}catch(e){}
const sum=a=>a.reduce((x,y)=>x+y,0);
const fmt=s=>{s=Math.round(s||0);return Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s'};
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const r2=n=>Math.round(n*100)/100;

function secStats(s){
  let c=0,w=0,u=0,cT=0,wT=0,tot=0;
  (s.q||[]).forEach(x=>{
    const t=x.t||0; tot+=t;
    if(x.a<0)u++;
    else if(x.a===x.c){c++;cT+=t}
    else{w++;wT+=t}
  });
  const att=c+w;
  return {c,w,u,cT,wT,tot,att,acc:att?c/att*100:0,net:r2(c-w*0.25)};
}
function stats(a){
  const parts=a.sections.map(secStats);
  const o={c:0,w:0,u:0,cT:0,wT:0,tot:0,att:0};
  parts.forEach(p=>['c','w','u','cT','wT','tot','att'].forEach(k=>o[k]+=p[k]));
  o.acc=o.att?o.c/o.att*100:0;
  o.net=r2(o.c-o.w*0.25);
  o.parts=parts;
  return o;
}
function score(a){return (typeof a.score==='number')?a.score:stats(a).net}
function when(a){
  const idn=Number(a.id);
  const d=(idn>1e11)?new Date(idn):null;
  if(a.date&&a.time) return esc(a.date)+' • '+esc(a.time);
  if(d&&!isNaN(d)){
    return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+' • '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  }
  return esc(a.date||'—');
}

const tname=a=>a.testName||'Test';
function typeOf(a){
  if(a.type)return a.type;
  if(tname(a)==='Bookmark Practice'||String(a.dataKey||'').includes('examData_bm_'))return 'bookmark';
  if(/[?&]section=/.test(a.launch||'')||String(a.dataKey||'').includes('#'))return 'sectional';
  return 'full';
}

let PF=new URLSearchParams(location.search).get('f')||sessionStorage.getItem('progFilter')||'full';
if(PF==='all'||PF==='reattempt')PF='full';
function setF(v){PF=v;try{sessionStorage.setItem('progFilter',v)}catch(e){}SF='all';try{sessionStorage.setItem('progSubj','all')}catch(e){}selectedTests.clear();render()}

let SF='all'; 
try{SF=sessionStorage.getItem('progSubj')||'all'}catch(e){}
function setSF(v){SF=v;try{sessionStorage.setItem('progSubj',v)}catch(e){}selectedTests.clear();render()}

let selectedTests=new Set();
let sortField='name'; // 'name' or 'score' or 'date'
let sortOrder='asc';  // 'asc' or 'desc'

function setSort(field){
  if(sortField===field){
    sortOrder=sortOrder==='asc'?'desc':'asc';
  } else {
    sortField=field;
    sortOrder='asc';
  }
  render();
}

const stripN=n=>String(n||'').replace(/\s*[-–:]?\s*[\(\[]?\s*(part|set|भाग)?\s*\d+\s*[\)\]]?\s*$/i,$1=>'').trim();
const subjOf=a=>stripN((a.sections&&a.sections[0]&&a.sections[0].name)||tname(a))||tname(a);

// Remove bookmark attempts
(function(){const old=A.filter(a=>typeOf(a)==='bookmark');if(!old.length)return;
  old.forEach(a=>{try{if(a.dataKey)localStorage.removeItem(a.dataKey)}catch(e){}});
  A=A.filter(a=>typeOf(a)!=='bookmark');
  try{localStorage.setItem('examAttempts',JSON.stringify(A))}catch(e){}})();

function visible(){
  return A.map((a,n)=>n).filter(n=>{
    if(typeOf(A[n])!==PF)return false;
    return PF!=='sectional'||SF==='all'||subjOf(A[n])===SF;
  });
}

function delta(d){
  d=r2(d);
  if(d>0)return `<span class="up">▲ +${d}</span>`;
  if(d<0)return `<span class="dn">▼ ${d}</span>`;
  return '<span class="u">＝ 0</span>';
}

function firstAttemptCmpHTML(S,scores){
  const testMap={};
  A.forEach((a,n)=>{
    const name=tname(a);
    const t=typeOf(a);
    if(PF==='full'&&t!=='full')return;
    if(PF==='sectional'){
      if(t!=='sectional')return;
      if(SF!=='all'&&subjOf(a)!==SF)return;
    }
    if(!testMap[name]){
      testMap[name]={index:n};
    }
  });

  const testNames=Object.keys(testMap).sort();
  if(!testNames.length){
    return '<div class="card"><div class="empty" style="padding:10px">कोई टेस्ट उपलब्ध नहीं है।</div></div>';
  }

  if(selectedTests.size===0){
    testNames.forEach(name=>selectedTests.add(name));
  }

  let filteredTestNames = testNames.filter(name=>selectedTests.has(name));

  // Sorting logic (Ascending / Descending)
  filteredTestNames.sort((a,b)=>{
    let valA, valB;
    if(sortField==='name'){
      valA=a.toLowerCase(); valB=b.toLowerCase();
    } else if(sortField==='score'){
      valA=scores[testMap[a].index]; valB=scores[testMap[b].index];
    } else if(sortField==='date'){
      valA=Number(A[testMap[a].index].id)||0; valB=Number(A[testMap[b].index].id)||0;
    }
    if(valA<valB) return sortOrder==='asc'?-1:1;
    if(valA>valB) return sortOrder==='asc'?1:-1;
    return 0;
  });

  const allSelectedScores=filteredTestNames.map(name=>scores[testMap[name].index]);
  const avgSelectedScore=allSelectedScores.length?sum(allSelectedScores)/allSelectedScores.length:0;

  let o=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
      <h2 style="margin:0">1st Attempt-wise Comparison</h2>
    </div>
    
    <!-- Collapsible Dropdown for Select Tests -->
    <details style="border:1px solid #d0e1f9;background:#e8f0f8;border-radius:4px;padding:8px 12px;margin-bottom:10px">
      <summary style="font-weight:bold;color:#31708f;font-size:13px">📌 Select Tests to Compare (${selectedTests.size}/${testNames.length} selected)</summary>
      <div style="margin-top:8px;max-height:150px;overflow-y:auto;background:#fff;padding:6px;border-radius:4px;border:1px solid #ccc;display:flex;flex-direction:column;gap:4px">
        <div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:4px;margin-bottom:4px">
          <label style="font-size:12px;cursor:pointer;font-weight:bold"><input type="checkbox" ${testNames.every(n=>selectedTests.has(n))?'checked':''} onclick="toggleAllTests(this)"> Select All</label>
          <span style="font-size:11px;color:#666">Click to toggle</span>
        </div>
        ${testNames.map(name=>`<label style="font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px">
          <input type="checkbox" ${selectedTests.has(name)?'checked':''} onclick="toggleTest('${esc(name).replace(/[']/g, "\\'")}',this)"> ${esc(name)}
        </label>`).join('')}
      </div>
    </details>

    <!-- Sorting Controls -->
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;font-size:12px">
      <b>Sort By:</b>
      <button class="btn${sortField==='name'?' p':''}" style="padding:4px 8px;font-size:11px" onclick="setSort('name')">Test Name ${sortField==='name'?(sortOrder==='asc'?'▲':'▼'):''}</button>
      <button class="btn${sortField==='score'?' p':''}" style="padding:4px 8px;font-size:11px" onclick="setSort('score')">Score ${sortField==='score'?(sortOrder==='asc'?'▲':'▼'):''}</button>
      <button class="btn${sortField==='date'?' p':''}" style="padding:4px 8px;font-size:11px" onclick="setSort('date')">Date ${sortField==='date'?(sortOrder==='asc'?'▲':'▼'):''}</button>
    </div>`;

  if(!filteredTestNames.length){
    return o+'<div class="empty" style="padding:10px">तुलना के लिए कृपया कम से कम एक टेस्ट चुनें।</div></div>';
  }

  o+=`<div style="overflow-x:auto"><table style="min-width:950px"><tr>
      <th style="text-align:left;padding-left:8px">Test Name</th>
      <th>Submitted</th><th>Score</th><th>Change</th><th>Accuracy</th><th>Correct</th><th>Wrong</th><th>Attempted</th><th>Unattempted</th><th>Total Time</th><th>Full Analysis</th></tr>`;

  filteredTestNames.forEach(name=>{
    const n=testMap[name].index;
    const st=S[n];
    const sc=scores[n];
    const ch=delta(sc-avgSelectedScore);
    o+=`<tr>
      <td style="text-align:left;padding-left:8px;font-size:12px;white-space:nowrap"><b>${esc(name)}</b></td>
      <td>${when(A[n])}</td>
      <td><b>${sc}</b></td>
      <td>${ch}</td>
      <td>${st.acc.toFixed(1)}%</td>
      <td class="c">${st.c}</td>
      <td class="w">${st.w}</td>
      <td class="u">${st.att}</td>
      <td class="u">${st.u}</td>
      <td>${fmt(st.tot)}</td>
      <td><a class="btn p" style="padding:5px 12px!important;font-size:12px" href="result.html#${encodeURIComponent(A[n].id)}">Full Analysis</a></td>
    </tr>`;
  });

  return o+'</table></div></div>';
}

function toggleTest(name,el){
  if(el.checked) selectedTests.add(name);
  else selectedTests.delete(name);
  render();
}

function toggleAllTests(el){
  const testMap={};
  A.forEach(a=>{
    const name=tname(a);
    const t=typeOf(a);
    if(PF==='full'&&t==='full') testMap[name]=true;
    if(PF==='sectional'&&t==='sectional'&&(SF==='all'||subjOf(a)===SF)) testMap[name]=true;
  });
  selectedTests.clear();
  if(el.checked){
    Object.keys(testMap).forEach(n=>selectedTests.add(n));
  }
  render();
}

function render(){
  const root=$('root');
  $('pf').value=PF;

  const subCont=$('subjectFilterContainer');
  if(PF==='sectional'){
    const subs=[...new Set(A.filter(a=>typeOf(a)==='sectional').map(subjOf))].sort();
    subCont.innerHTML=`<span>Subject:</span><select id="sfSelect" onchange="setSF(this.value)"><option value="all">All Subjects</option>${subs.map(x=>`<option value="${esc(x)}"${x===SF?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
    subCont.style.display='flex';
  } else {
    subCont.innerHTML='';
    subCont.style.display='none';
  }

  if(!A.length){
    root.innerHTML='<div class="card empty">अभी तक कोई टेस्ट attempt नहीं किया गया है।<br><br><a class="btn p" href="home.html">Start a Test</a></div>';
    return;
  }
  const S=A.map(stats);
  const scores=A.map(score);
  const V=visible();
  if(!V.length){root.innerHTML='<div class="card empty">इस श्रेणी में अभी कोई attempt नहीं है।</div>';return}
  const bestIdx=V.reduce((b,n)=>scores[n]>scores[b]?n:b,V[0]);
  const best=A[bestIdx];
  const latest=A[V[V.length-1]];
  const avg=sum(V.map(n=>scores[n]))/V.length;

  let o=`<div class="card"><div class="cards">
    <div class="k"><div class="l">Total Tests Attempted</div><b>${V.length}</b></div>
    <div class="k"><div class="l">Best Score 🏆</div><b class="c">${scores[bestIdx]}</b><span class="s">${esc(tname(best))}</span></div>
    <div class="k"><div class="l">Average Score</div><b>${r2(avg)}</b></div>
    <div class="k"><div class="l">Latest Score</div><b>${score(latest)}</b><span class="s">${when(latest)}</span></div>
  </div></div>`;

  o+=firstAttemptCmpHTML(S,scores);

  o+='<h2>All Attempts (Latest first)</h2>';

  for(const n of [...V].reverse()){
    const a=A[n], st=S[n], isBest=(n===bestIdx);
    const name=tname(a);
    const allTries=A.map((x,idx)=>({x,idx})).filter(item=>tname(item.x)===name);

    o+=`<div class="card${isBest?' best':''}">
      <div class="head">
        <div>
          <div class="nm">Attempt #${n+1} – ${esc(name)}${isBest?'<span class="badge">🏆 Best</span>':''}</div>
          <div class="dt">Submitted: ${when(a)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <a class="btn p" href="result.html#${encodeURIComponent(a.id)}">Full Analysis</a>
          <button class="btn g" onclick="openRe(${n})">🔄 Re-attempt</button>
          <select onchange="if(this.value)window.location.href='result.html#'+encodeURIComponent(A[Number(this.value)].id)" style="padding:6px;border-radius:3px;border:1px solid #bbb">
            <option value="">Attempts (${allTries.length})</option>
            ${allTries.map((item,idx)=>`<option value="${item.idx}"${item.idx===n?' selected':''}>Attempt ${idx+1} (${score(item.x)})</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="chips">
        <div class="chip"><span>Score</span><b>${score(a)}</b></div>
        <div class="chip"><span>Accuracy</span><b>${st.acc.toFixed(1)}%</b></div>
        <div class="chip"><span>Correct</span><b class="c">${st.c}</b></div>
        <div class="chip"><span>Wrong</span><b class="w">${st.w}</b></div>
        <div class="chip"><span>Attempted</span><b class="u">${st.att}</b></div>
        <div class="chip"><span>Unattempted</span><b class="u">${st.u}</b></div>
        <div class="chip"><span>Total Time</span><b>${fmt(st.tot)}</b></div>
      </div>
      <details open><summary>Section-wise Time &amp; Analysis</summary>
      <table><tr><th>Section</th><th>Score</th><th>Change</th><th>Accuracy</th><th>Correct</th><th>Wrong</th><th>Attempted</th><th>Unattempted</th><th>Correct Q. Time</th><th>Wrong Q. Time</th><th>Total Time</th></tr>`;
    
    a.sections.forEach((s,i)=>{
      const p=st.parts[i];
      o+=`<tr>
        <td style="text-align:left;white-space:nowrap;padding-left:8px"><b>${esc(s.name||('Section '+(i+1)))}</b></td>
        <td>${p.net}</td>
        <td><span class="u">—</span></td>
        <td>${p.acc.toFixed(1)}%</td>
        <td class="c">${p.c}</td>
        <td class="w">${p.w}</td>
        <td class="u">${p.att}</td>
        <td class="u">${p.u}</td>
        <td>${fmt(p.cT)}</td>
        <td>${fmt(p.wT)}</td>
        <td><b>${fmt(p.tot)}</b></td>
      </tr>`;
    });
    o+='</table></details></div>';
  }
  root.innerHTML=o;
}

let reN=-1;
function openRe(n){
  reN=n;
  const name=tname(A[n]);
  const hist=A.filter(a=>tname(a)===name);
  $('reInfo').innerHTML='<b>'+esc(name)+'</b><br>'+hist.map((a,k)=>`Attempt ${k+1}: <b>${score(a)}</b> <span style="color:#666">(${when(a)})</span>`).join('<br>');
  $('reModal').style.display='flex';
}
function closeRe(){$('reModal').style.display='none'}
function goRe(){window.location.href='exam.html'+((A[reN]&&A[reN].launch||''))}

render();
</script>
</body></html>

<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Revision</title>
<link rel="stylesheet" href="app.css?v=5">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
.qt{white-space:pre-wrap;line-height:1.65;font-size:16px;font-weight:500;margin:8px 0 10px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border:1.5px solid var(--ln);border-radius:14px;background:#fff;color:var(--tx);font-size:15px;line-height:1.45;cursor:pointer}
.opt.sel{border-color:var(--bl);background:var(--bl2)}.opt.ok{background:var(--gr2);border-color:var(--gr);color:#0d652d;font-weight:500}.opt.bad{background:var(--rd2);border-color:var(--rd);color:#a50e0e}.opt.lock{cursor:default}
.sol{background:var(--am2);border-radius:14px;padding:12px;margin-top:12px;white-space:pre-wrap;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--mt);margin-bottom:4px}.meta span{background:#f1f3f4;border-radius:10px;padding:2px 8px}
.nav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.nav .btn{flex:1;text-align:center}.btn.gray{background:#e8eaed!important;color:var(--tx)!important}.btn.off{opacity:.45;pointer-events:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.lbl{font-size:12px;color:var(--mt);margin:6px 0 2px}
.pb{height:8px;background:#e0e3e7;border-radius:4px;overflow:hidden;margin:6px 0}.pb i{display:block;height:100%;background:var(--gr)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.stats div{background:var(--bl2);border-radius:12px;padding:8px 2px;font-size:11px;color:var(--mt)}.stats b{display:block;font-size:18px;color:var(--tx);font-weight:500}
.tc{cursor:pointer}.tc .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.full{background:var(--gr2);color:#0d652d;border-radius:14px;padding:10px;text-align:center;font-weight:500;margin-top:10px}
.note{font-size:11px;color:var(--mt);margin-top:8px}.big{text-align:center;padding:22px 12px}.big b{font-size:24px;display:block;margin:8px 0}
.qimg,.oimg{max-width:100%;height:auto;display:block;margin:6px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.stats4 div{background:var(--bl2);border-radius:12px;padding:8px 2px;font-size:10px;color:var(--mt);cursor:pointer}.stats4 b{display:block;font-size:15px;color:var(--tx);font-weight:500}
</style></head><body>
<div class="top"><b>📚 Revision</b></div>
<div class="wrap">
  <div class="bar" id="ctl"></div>
  <div id="main"><div class="card" style="text-align:center">Loading questions…</div></div>
</div>
<script src="nav.js?v=5"></script>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const STRUCT={teaching:['NTT','PRT','TGT','PGT'],nonTeaching:['10th','12th','Graduation Level']};
let ALL=[],OV={};
try{OV=JSON.parse(localStorage.getItem('examTopics'))||{}}catch(e){}
function hashStr(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return String(h)}
const qKey=q=>q.qid?String(q.qid):'h'+hashStr(q.qEn||'');
// ---- Topic auto-detection (optional "topic" field in JSON wins; user can also change any topic) ----
const R={
disc:[[/gender|patriarch|boys dominating|inherit property|inclusiv|respecting differences|diverse cultural|linguistic diversity/,'Gender & Inclusion'],[/article|preamble|amendment|constitution|commission|rte act|ncf|national integration|1952|post-1950s|mother tongue|obligated/,'Constitution, Policy & Commissions'],[/television|advertis|more people are engaged|socialization/,'Society & Media'],[/piaget|preschool|motor skill|play types|pretend play|vocabulary growth|personality|conditioning|bullying|anxious|denial|mindfulness|observe|self-understanding|punctuality|confident|area of development|\bstage\b|viewpoints/,'Child Development & Psychology'],[/mathematic|rational number|prime number|fraction|measuring length|units must be consistent/,'Mathematics Pedagogy'],[/science|scientific|environmental|evs|eco-club|kitchen garden|plants bending/,'Science & EVS Pedagogy'],[/english|language|vocabulary|grammar|subject-verb|pronunciation|literature|sentence|translation method|rule.governed/,'English / Language Pedagogy'],[/social stud|social science|economic|textbooks|political leadership|community play/,'Social Science Pedagogy'],[/curriculum|unit plan|lesson plan|micro teaching|pedagog|experiential|peer tutoring|teaching aid|low cost|alternative schooling|activity-based|open-ended/,'Curriculum & Lesson Planning'],[/assess|evaluat|formative|higher-order/,'Assessment & Evaluation'],[/leader|principal|school board|enrol|budget|school wants|facilitator|initiative/,'School Leadership & Management']],
rea:[[/series|come in place|श्रृंखला/,'Series'],[/related to|odd one|does not belong|संबंधित|अलग/,'Analogy & Classification'],[/coded|code|कूट/,'Coding-Decoding'],[/father|mother|brother|sister|\bson\b|daughter|uncle|aunt|पिता|माता|भाई|बहन/,'Blood Relations'],[/north|south|east|west|direction|दिशा/,'Direction'],[/rank|\brow\b|tallest|taller|heavier|पंक्ति/,'Ranking & Order'],[/venn|conclusion|statement|कथन|निष्कर्ष/,'Statements & Syllogism'],[/mirror|water image|folded|cube|dice|figure|दर्पण|पासा/,'Figure & Non-verbal'],[/calendar|clock|day of the week|घड़ी/,'Calendar & Clock'],[/symbol|interchang|operation|चिह्न/,'Mathematical Operations']],
math:[[/percent|%|प्रतिशत/,'Percentage'],[/profit|loss|discount|लाभ|हानि|छूट/,'Profit, Loss & Discount'],[/simple interest|compound|interest|ब्याज/,'Interest'],[/ratio|proportion|अनुपात/,'Ratio & Proportion'],[/average|mean|औसत/,'Average'],[/work|pipe|tank|काम|नल/,'Time & Work'],[/speed|train|km\/h|distance|चाल|ट्रेन/,'Time, Speed & Distance'],[/triangle|circle|area|perimeter|volume|radius|क्षेत्रफल|त्रिभुज|वृत्त/,'Geometry & Mensuration'],[/sin|cos|tan|trigonometr/,'Trigonometry'],[/divisible|hcf|lcm|prime|remainder|लघुत्तम|महत्तम|भाज्य/,'Number System'],[/simplif|value of|सरल/,'Simplification'],[/x\s*[+-]|equation|समीकरण/,'Algebra']],
eng:[[/passage|comprehension/,'Comprehension'],[/error|incorrect|grammatically/,'Error Spotting'],[/fill in the blank|blank/,'Fill in the Blanks'],[/synonym|similar in meaning/,'Synonyms'],[/antonym|opposite/,'Antonyms'],[/idiom|phrase/,'Idioms & Phrases'],[/one word|substitut/,'One Word Substitution'],[/spelt|spelling/,'Spelling'],[/passive|active voice|narration|direct|indirect/,'Voice & Narration'],[/rearrange|jumbled|sentence/,'Sentence Arrangement']],
hin:[[/संधि/,'संधि'],[/समास/,'समास'],[/पर्यायवाची|समानार्थी/,'पर्यायवाची'],[/विलोम|विपरीतार्थक/,'विलोम'],[/मुहावरा|मुहावरे|लोकोक्ति/,'मुहावरे व लोकोक्तियाँ'],[/शुद्ध|अशुद्ध|वर्तनी/,'शब्द शुद्धि'],[/एक शब्द|के लिए.*शब्द/,'एक शब्द'],[/अलंकार/,'अलंकार'],[/कारक|विभक्ति/,'कारक'],[/गद्यांश|अनुच्छेद/,'गद्यांश']],
gk:[[/emperor|dynasty|battle|mughal|revolt|ancient|medieval|freedom|वंश|युद्ध|मुगल|आंदोलन/,'History'],[/river|mountain|plateau|climate|soil|national park|नदी|पर्वत|पठार/,'Geography'],[/constitution|article|president|parliament|amendment|संविधान|अनुच्छेद|राष्ट्रपति|संसद/,'Polity'],[/gdp|bank|tax|budget|inflation|rbi|economy|बैंक|बजट|अर्थ/,'Economy'],[/physics|chemistry|biology|vitamin|acid|cell|gas|element|विटामिन|अम्ल|कोशिका|तत्व/,'Science'],[/award|prize|trophy|olympic|cup|खेल|पुरस्कार|ओलंपिक/,'Awards & Sports'],[/author|book|wrote|written by|लेखक|पुस्तक|रचना/,'Books & Authors'],[/dance|festival|temple|folk|नृत्य|मंदिर|त्योहार/,'Art & Culture']]};
function kind(n){n=n.toLowerCase();return/discipline/.test(n)?'disc':/reasoning|intelligence/.test(n)?'rea':/arith|numer|quant|math/.test(n)?'math':/english/.test(n)?'eng':/hindi/.test(n)?'hin':/awareness|knowledge|gk|current/.test(n)?'gk':''}
function autoTopic(sn,q){const r=R[kind(sn)]||[],t=((q.qEn||'')+' '+(q.qHi||'')).toLowerCase();for(const[x,n]of r)if(x.test(t))return n;return 'अन्य / Other'}
const topicOf=o=>OV[o.key]||o.q.topic||o.auto;

const stripN=n=>String(n||'').replace(/\s*[-–:]?\s*[\(\[]?\s*(part|set|भाग)?\s*\d+\s*[\)\]]?\s*$/i,'').trim();
function normSubj(name,nameHi,CFG){
  const al={};Object.keys((CFG&&CFG.subjectAliases)||{}).forEach(k=>al[stripN(k).toLowerCase()]=CFG.subjectAliases[k]);
  let n=stripN(name)||String(name||'').trim();const a=al[n.toLowerCase()];if(a)n=a;
  return {name:n,nameHi:stripN(nameHi)||nameHi,key:n.toLowerCase()};
}
async function load(){
  let C;try{C=await(await fetch('tests.json')).json()}catch(e){$('main').innerHTML='<div class="card empty">tests.json नहीं मिली। Server/hosting से खोलें।</div>';return}
  const files={};
  Object.keys(STRUCT).forEach(c=>STRUCT[c].forEach(l=>{const n=((C[c]||{})[l])||{};
    Object.keys(n).forEach(p=>Object.keys(n[p]||{}).forEach(y=>(n[p][y]||[]).forEach(t=>{if(!files[t.file])files[t.file]={c,l,p,y,t:t.title}})))}));
  const seen=new Set();
  for(const f of Object.keys(files)){
    let d;try{d=await(await fetch(f)).json()}catch(e){continue}
    (d.sections||[]).forEach(s=>(s.questions||[]).forEach(q=>{
      const key=qKey(q);if(seen.has(key))return;seen.add(key);
      const ns=normSubj(s.name,s.nameHi,C);
      ALL.push({key,q,sn:ns.name,snHi:ns.nameHi||ns.name,sk:ns.key,auto:autoTopic(ns.name,q),m:files[f]});
    }));
  }
  const sk=[...new Set(ALL.map(o=>o.sk))];F.subj=sk[0]||'';draw();
}

// ================= Learning ⇄ Revision (4 lists) =================
// L = Learning, R = Revision Pending, X = 🔴 Weak Questions, G = 🟢 Strong Questions
const LS='examLearning2';
let REC={},SS=null;
try{REC=JSON.parse(localStorage.getItem(LS))||{}}catch(e){}
const saveR=()=>{try{localStorage.setItem(LS,JSON.stringify(REC))}catch(e){}};
let F={l:'',lang:'en',subj:'',top:'',view:'home',list:''};
let UI={listDays:'0',listRn:'20',listKw:'',show:50};
const hi=()=>F.lang==='hi';
const DAY=864e5,NM={L:'📘 Learning',R:'📝 Revision Pending',X:'🔴 Weak Questions',G:'🟢 Strong Questions'};
const TN={L:'Learning',R:'Revision Pending',X:'Weak Questions',G:'Strong Questions'},TI={L:'📘',R:'📝',X:'🔴',G:'🟢'};
const listOf=o=>(REC[o.key]&&REC[o.key].l)||'L';
const refT=o=>{const r=REC[o.key];return r?(r.lastRevisionAt||r.learnedAt||0):0};
const ageD=o=>{const t=refT(o);return t?(Date.now()-t)/DAY:0};
const never=o=>{const r=REC[o.key];return !!r&&!r.lastRevisionAt};
const itemsOf=(sk,t)=>ALL.filter(o=>(!F.l||o.m.l===F.l)&&o.sk===sk&&topicOf(o)===t);
const cur=()=>itemsOf(F.subj,F.top);
function cnt(list){const c={L:0,R:0,X:0,G:0,t:list.length};list.forEach(o=>c[listOf(o)]++);return c}
const p2=n=>String(n).padStart(2,'0');
function fmtT(ts){const d=new Date(ts);let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;return `${p2(d.getDate())}-${p2(d.getMonth()+1)}-${d.getFullYear()} ${p2(h)}:${p2(d.getMinutes())} ${ap}`}
function ago(ts){const m=(Date.now()-ts)/6e4;if(m<60)return 'अभी अभी';if(m<1440)return Math.floor(m/60)+' घंटे पहले';return Math.floor(m/1440)+' दिन पहले'}
function lastRev(list){let t=0;list.forEach(o=>{const r=REC[o.key];if(r&&r.lastRevisionAt&&r.lastRevisionAt>t)t=r.lastRevisionAt});return t}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const mk=o=>REC[o.key]=REC[o.key]||{a:0,c:0,w:0,l:'L'};
function learnAns(o,ok){const r=mk(o);r.a++;
  if(ok){r.c++;r.l='R';r.learnedAt=Date.now();delete r.lastRevisionAt}   // Learning में 1 बार सही → Revision Pending
  else{r.w++;if(r.l==='G')r.l='X'}
  saveR()}
function revAns(o,ok){const r=mk(o);r.a++;if(ok){r.c++;r.l='G'}else{r.w++;r.l='X'}r.lastRevisionAt=Date.now()}

function setF(k,v){F[k]=v;if(k==='subj')F.top='';F.view='home';SS=null;draw()}
function openT(t){F.top=t;F.view='dash';SS=null;draw()}
function toTopics(){F.top='';F.view='home';SS=null;draw()}
function back(){F.view=F.top?'dash':'home';SS=null;draw()}
function backToList(){F.view='list';SS=null;draw()}
function ctl(){
  const lv=[...new Set(ALL.map(o=>o.m.l))];
  $('ctl').innerHTML=`<select onchange="setF('l',this.value)" style="flex:1"><option value="">All Levels</option>${lv.map(l=>`<option${l===F.l?' selected':''}>${esc(l)}</option>`).join('')}</select>
  <select onchange="F.lang=this.value;draw()" style="flex:1"><option value="en"${F.lang==='en'?' selected':''}>English</option><option value="hi"${F.lang==='hi'?' selected':''}>हिंदी</option></select>`;
}
const isFull=c=>c.t>0&&c.G===c.t;
// सत्र (Learning/Test) के दौरान click=false, ताकि गलती से बाहर न निकलें
function tiles(c,click){
  return `<div class="stats4">${['L','R','X','G'].map(k=>`<div ${click?`onclick="openList('${k}')"`:'style="cursor:default"'}><b>${TI[k]} ${c[k]}</b>${TN[k]}</div>`).join('')}</div>`;
}
function drawHome(){
  const lv=ALL.filter(o=>!F.l||o.m.l===F.l),sm={};
  lv.forEach(o=>{(sm[o.sk]=sm[o.sk]||{n:hi()?o.snHi:o.sn,l:[]}).l.push(o)});
  if(!sm[F.subj])F.subj=Object.keys(sm)[0]||'';
  let h=`<div class="lbl">विषय (Subject)</div><div class="chipbar">${Object.keys(sm).map(k=>{const c=cnt(sm[k].l);return `<button class="fc${k===F.subj?' on':''}" onclick="setF('subj',this.dataset.v)" data-v="${esc(k)}">${esc(sm[k].n)} <small>🟢${c.G}/${c.t}</small></button>`}).join('')}</div><div class="lbl">टॉपिक (Topic) चुनें</div>`;
  const tm={};(sm[F.subj]?sm[F.subj].l:[]).forEach(o=>{(tm[topicOf(o)]=tm[topicOf(o)]||[]).push(o)});
  h+=Object.keys(tm).sort().map(t=>{const c=cnt(tm[t]),p=c.t?Math.round(c.G/c.t*100):0;return `<div class="card tc" onclick="openT(this.dataset.t)" data-t="${esc(t)}"><div class="r"><b>${esc(t)}</b><span>${isFull(c)?'🎓':''} ${p}%</span></div><div class="pb"><i style="width:${p}%"></i></div><div class="note" style="margin:0">📘 ${c.L} • 📝 ${c.R} • 🔴 Weak ${c.X} • 🟢 Strong ${c.G} • कुल ${c.t}</div></div>`}).join('')||'<div class="card" style="text-align:center">कोई question नहीं मिला।</div>';
  $('main').innerHTML=h;
}
// ---------- Topic dashboard ----------
function drawDash(){
  const L=cur(),c=cnt(L),lr=lastRev(L);
  $('main').innerHTML=`<a class="fc" onclick="toTopics()" style="display:inline-block;margin-bottom:8px">← Topics</a>
  <div class="card">
    <h2 style="margin:0 0 8px">${esc(F.top)}</h2>
    ${tiles(c,true)}
    <div class="note">👆 किसी भी सूची पर टैप करें: प्रश्न देखें, Learning या Test शुरू करें। कुल प्रश्न: <b>${c.t}</b></div>
    <div class="note">⏱ आख़िरी Revision: ${lr?`<b>${ago(lr)}</b> (${fmtT(lr)})`:'अभी तक नहीं हुआ'}</div>
    ${isFull(c)?'<div class="full">🎓 Fully Mastered</div>':''}
    <div class="nav"><button class="btn ${c.L?'':'off'}" onclick="openList('L')">▶ Learning</button><button class="btn g" onclick="openList('R')">🎯 Revision Test</button></div>
    <div class="note">यह सिर्फ़ Learning Progress है, Main Test Result नहीं।</div>
    <div style="text-align:center;margin-top:12px"><a onclick="resetT()" style="color:var(--rd);cursor:pointer;font-size:12px">इस Topic की Progress रीसेट करें</a></div>
  </div>`;
}
function resetT(){if(!confirm('इस Topic की सारी Learning Progress मिटानी है?'))return;cur().forEach(o=>delete REC[o.key]);saveR();draw()}
// ---------- List viewer ----------
function filterRows(k){
  let r=cur().filter(o=>listOf(o)===k);
  if(k==='L'){const kw=(UI.listKw||'').trim().toLowerCase();if(kw)r=r.filter(o=>((o.q.qEn||'')+' '+(o.q.qHi||'')+' '+(o.q.optEn||[]).join(' ')+' '+(o.q.optHi||[]).join(' ')).toLowerCase().includes(kw))}
  else{const d=Math.max(0,parseFloat(UI.listDays)||0);r=r.filter(o=>ageD(o)>=d).sort((a,b)=>refT(a)-refT(b))}
  return r;
}
function rowsHTML(k,rows){
  const h=hi();
  const part=rows.slice(0,UI.show).map(o=>{const dv=Math.floor(ageD(o));const b=k==='L'?'':(never(o)?`⭐ ${dv} दिन (Revise नहीं हुआ)`:`${dv} दिन`);
    return `<div class="row"><div style="flex:1">${esc(String(h?(o.q.qHi||o.q.qEn):o.q.qEn).slice(0,110))}</div><span style="white-space:nowrap;font-size:12px;color:var(--mt)">${b}</span></div>`}).join('');
  return (part||'<div class="note" style="text-align:center;padding:10px">इस सूची में कोई प्रश्न नहीं।</div>')+(rows.length>UI.show?`<div style="text-align:center;margin-top:8px"><button class="btn gray" onclick="UI.show+=50;updateFilteredList('${k}')">और दिखाएँ (${rows.length-UI.show})</button></div>`:'');
}
function infoHTML(k,rows){
  const d=Math.max(0,parseFloat(UI.listDays)||0),n=Math.min(parseInt(UI.listRn)||rows.length,rows.length);
  return k==='L'?`चुने गए प्रश्न: <b>${rows.length}</b> • इस बार: <b>${n}</b>`:`${d>0?d+' दिन या उससे पुराने':'सभी'}: <b>${rows.length}</b> प्रश्न • इस बार: <b>${n}</b>`;
}
function openList(k){F.list=k;F.view='list';UI.listDays='0';UI.listRn='20';UI.listKw='';UI.show=50;draw()}
function drawList(){
  const k=F.list,all=cur().filter(o=>listOf(o)===k),rows=filterRows(k),off=rows.length?'':'off';
  const first=k==='L'?`<input type="search" id="inKw" placeholder="कोई शब्द खोजें..." value="${esc(UI.listKw)}" oninput="updateFilteredList('${k}',true)" style="flex:1">`
    :`<input type="number" id="inDays" min="0" placeholder="कितने दिन पुराने (0 = सब)" value="${UI.listDays==='0'?'':esc(UI.listDays)}" oninput="updateFilteredList('${k}',true)" style="flex:1">`;
  const btns=k==='R'?`<button class="btn g ${off}" id="tBtn" onclick="startListTest('R')">🎯 Revision Test</button>`
    :k==='L'?`<button class="btn ${off}" id="lBtn" onclick="startListLearn('L')">▶ Learning</button>`
    :`<button class="btn ${off}" id="lBtn" onclick="startListLearn('${k}')">▶ Learning</button><button class="btn g ${off}" id="tBtn" onclick="startListTest('${k}')">🎯 Test</button>`;
  $('main').innerHTML=`<a class="fc" onclick="back()" style="display:inline-block;margin-bottom:8px">← वापस</a>
  <div class="card"><h2 style="margin:0 0 6px">${NM[k]} (${all.length})</h2>
    <div class="card" style="background:#f8f9fa;margin-bottom:12px;padding:10px!important;border:1px solid #e0e3e7;box-shadow:none">
      <div class="bar" style="margin-top:4px">${first}<input type="number" id="inRn" min="1" placeholder="कितने प्रश्न" value="${esc(UI.listRn)}" oninput="updateFilteredList('${k}',true)" style="width:100px"></div>
      <div class="note" id="listInfoNote">${infoHTML(k,rows)}</div><div class="nav">${btns}</div></div>
    <div class="lbl">प्रश्नों की सूची (सबसे पुराने पहले):</div><div id="listRowsContainer">${rowsHTML(k,rows)}</div></div>`;
}
function updateFilteredList(k,reset){   // टाइप करते समय focus बना रहता है
  const g=id=>document.getElementById(id);
  if(g('inDays'))UI.listDays=g('inDays').value||'0';
  if(g('inRn'))UI.listRn=g('inRn').value;
  if(g('inKw'))UI.listKw=g('inKw').value;
  if(reset)UI.show=50;
  const rows=filterRows(k);
  if(g('listInfoNote'))g('listInfoNote').innerHTML=infoHTML(k,rows);
  if(g('listRowsContainer'))g('listRowsContainer').innerHTML=rowsHTML(k,rows);
  ['lBtn','tBtn'].forEach(id=>{if(g(id))g(id).classList.toggle('off',!rows.length)});
}
function pickN(rows){const n=parseInt(UI.listRn);return n>0?rows.slice(0,n):rows}
function startListTest(k){const p=pickN(filterRows(k));if(!p.length)return;SS={mode:'test',items:shuffle(p),i:0,sel:{},from:k};F.view='test';draw()}
function startListLearn(k){const p=pickN(filterRows(k));if(!p.length)return;SS={mode:'learn',queue:shuffle(p),total:p.length,ans:undefined,from:k};F.view='learn';draw()}
// ---------- Learning ----------
function qHTML(o,sel,lock){
  const q=o.q,h=hi(),opts=(h?q.optHi:q.optEn)||q.optEn||[],im=h?(q.imgHi||q.img):(q.imgEn||q.img),l=listOf(o);
  return `<div class="meta"><span>${esc(h?o.snHi:o.sn)}</span><span>${esc(topicOf(o))}</span>${l==='X'?'<span>🔴 Weak</span>':l==='G'?'<span>🟢 Strong</span>':''}</div><div class="qt">${esc(h?(q.qHi||q.qEn):q.qEn)}</div>${im?`<img class="qimg" src="${esc(im)}" alt="">`:''}`+
  opts.map((t,k)=>{let c='opt';if(lock){c+=' lock';if(k===q.ans)c+=' ok';else if(k===sel)c+=' bad'}else if(k===sel)c+=' sel';
    const oi=q.optImg&&q.optImg[k];return `<button class="${c}" onclick="tap(${k})">${String.fromCharCode(65+k)}. ${esc(t)}${oi?`<img class="oimg" src="${esc(oi)}" alt="">`:''}${lock&&k===q.ans?' ✔':''}</button>`}).join('');
}
function tap(k){
  if(!SS)return;
  if(SS.mode==='learn'){if(SS.ans!==undefined)return;const o=SS.queue[0];SS.ans=k;SS.ok=k===o.q.ans;learnAns(o,SS.ok);draw()}
  else if(SS.mode==='test'){SS.sel[SS.i]=k;draw()}
}
function nextL(){const o=SS.queue.shift();if(listOf(o)!=='R')SS.queue.push(o);SS.ans=undefined;draw()}   // गलत प्रश्न इसी सत्र में फिर आता है
function drawLearn(){
  const c=cnt(cur());
  if(!SS.queue.length){$('main').innerHTML=`<div class="card big">🎉<b>Learning सत्र पूरा!</b>${tiles(c,false)}<div class="nav"><button class="btn" onclick="back()">Topic पर जाएँ</button></div></div>`;return}
  const o=SS.queue[0],q=o.q,h=hi(),sol=(h?q.solHi:q.solEn)||q.solEn||q.solHi||'',a=SS.ans;
  $('main').innerHTML=`<div class="card" style="padding:10px!important">${tiles(c,false)}</div>
  <div class="card"><div class="meta"><span>बाकी: ${SS.queue.length}</span></div>${qHTML(o,a,a!==undefined)}
  ${a!==undefined?`<div class="sol"><b>${SS.ok?'✅ Correct':'❌ Wrong'}</b>${SS.ok?'':'\nसही उत्तर: '+String.fromCharCode(65+q.ans)}${sol?'\n\n'+esc(sol):'\n\nSolution उपलब्ध नहीं है।'}\n\n${SS.ok?'→ 📝 Revision Pending में गया।':'→ यह इसी सत्र में फिर आएगा।'}</div>`:''}
  <div class="nav"><button class="btn gray" onclick="if(SS.ans!==undefined||confirm('सत्र रोकें?'))back()">✕ रोकें</button>${a!==undefined?`<button class="btn" onclick="nextL()">Next →</button>`:''}</div>
  <div class="nav"><button class="btn gray" onclick="edTopic('${esc(o.key)}')">✎ Topic बदलें</button></div></div>`;
}
// ---------- Revision Test ----------
function tgo(d){SS.i=Math.max(0,Math.min(SS.items.length-1,SS.i+d));draw()}
function submitT(){
  const un=SS.items.filter((o,i)=>SS.sel[i]===undefined).length;
  if(un&&!confirm(un+' प्रश्न बिना उत्तर के हैं (गलत गिने जाएँगे)। Submit करें?'))return;
  const wrong=[];let g=0;
  SS.items.forEach((o,i)=>{const ok=SS.sel[i]===o.q.ans;revAns(o,ok);if(ok)g++;else wrong.push({o,i})});
  saveR();SS={mode:'result',n:SS.items.length,g,wrong,sel:SS.sel};F.view='result';draw();
}
function drawTest(){
  const o=SS.items[SS.i],n=SS.items.length;
  $('main').innerHTML=`<div class="pb"><i style="width:${(SS.i+1)/n*100}%;background:var(--bl)"></i></div>
  <div class="card"><div class="meta"><span>Revision Test • Q ${SS.i+1}/${n}</span></div>${qHTML(o,SS.sel[SS.i],false)}
  <div class="nav"><button class="btn gray ${SS.i?'':'off'}" onclick="tgo(-1)">← Previous</button>${SS.i<n-1?`<button class="btn" onclick="tgo(1)">Next →</button>`:`<button class="btn g" onclick="submitT()">Submit</button>`}</div>
  <div class="nav"><button class="btn gray" onclick="if(confirm('Test छोड़ें? Progress सेव नहीं होगी।'))back()">✕ छोड़ें</button></div></div>`;
}
function drawResult(){
  const w=SS.wrong,h=hi(),c=cnt(cur());
  $('main').innerHTML=`<div class="card big">${w.length?'📝':'🎉'}<b>${SS.n} में से ${SS.g} सही</b>🟢 ${SS.g} Strong • 🔴 ${w.length} Weak<div style="margin-top:12px">${tiles(c,false)}</div>
  <div class="nav"><button class="btn" onclick="back()">Topic पर जाएँ</button></div><div class="note">यह Revision/Learning Progress है, Main Test Result नहीं।</div></div>`+
  w.map(x=>{const q=x.o.q,sol=(h?q.solHi:q.solEn)||q.solEn||'',opts=(h?q.optHi:q.optEn)||q.optEn||[],sv=SS.sel[x.i];
    return `<div class="card"><div class="meta"><span>🔴 Weak Questions में गया</span></div><div class="qt">${esc(h?(q.qHi||q.qEn):q.qEn)}</div><div class="note">आपका उत्तर: ${sv===undefined?'—':esc(opts[sv])}</div><div class="opt ok lock">सही: ${String.fromCharCode(65+q.ans)}. ${esc(opts[q.ans])}</div>${sol?`<div class="sol">${esc(sol)}</div>`:''}</div>`}).join('');
}
function draw(){
  if(!ALL.length){$('main').innerHTML='<div class="card" style="text-align:center">अभी कोई test/question upload नहीं है।</div>';return}
  ctl();
  ({home:drawHome,dash:drawDash,list:drawList,learn:drawLearn,test:drawTest,result:drawResult})[F.view]();
  if(typeof renderMathInElement==='function')try{renderMathInElement($('main'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}catch(e){}
}
function edTopic(k){
  const o=ALL.find(x=>x.key===k),v=prompt('इस प्रश्न का topic लिखें / बदलें:',topicOf(o));
  if(v===null||!v.trim())return;OV[k]=v.trim();
  try{localStorage.setItem('examTopics',JSON.stringify(OV))}catch(e){}
  F.top=v.trim();if(SS&&SS.mode==='learn')SS.queue=SS.queue.filter(x=>x.key!==k);draw();
}
load().catch(e=>{try{console.error(e)}catch(x){}$('main').innerHTML='<div class="card empty" style="text-align:center">प्रश्न लोड नहीं हो पाए। पेज दोबारा खोलें।</div>'});
</script></body></html>

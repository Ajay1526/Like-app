<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Revision</title>
<link rel="stylesheet" href="app.css?v=5">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
/* ===== MERGED ATTRACTIVE THEME ===== */
:root{--bl:#7c3aed;--bl2:#ede9fe;--gr:#10b981;--gr2:#ecfdf5;--rd:#ef4444;--rd2:#fef2f2;--am2:#fefce8;--ln:#e2e8f0;--tx:#1e293b;--mt:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(180deg,#ddd6fe 0%,#e0f2fe 45%,#fef9c3 100%)!important;color:var(--tx);min-height:100vh}
.top{background:linear-gradient(135deg,#7c3aed,#db2777,#f59e0b)!important;color:#fff!important;padding:14px 16px!important;font-size:19px!important;font-weight:900!important;box-shadow:0 10px 25px rgba(124,58,237,.35);position:sticky;top:0;z-index:100;border-radius:0 0 18px 18px}
.wrap{max-width:780px;margin:auto;padding:10px}
.card{background:#fff;border-radius:16px!important;box-shadow:0 6px 18px rgba(0,0,0,.06)!important;border:1px solid var(--ln);padding:14px}
.qt{white-space:pre-wrap;line-height:1.65;font-size:16px;font-weight:600;margin:8px 0 10px}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:8px 0;border:1.5px solid var(--ln);border-radius:14px;background:#fff;color:var(--tx);font-size:15px;line-height:1.45;cursor:pointer}
.opt:hover{border-color:#a78bfa;background:#f5f3ff}.opt.sel{border-color:var(--bl);background:var(--bl2)}.opt.ok{background:var(--gr2);border-color:var(--gr);color:#0d652d;font-weight:600}.opt.bad{background:var(--rd2);border-color:var(--rd);color:#a50e0e}.opt.lock{cursor:default}
.sol{background:#fefce8;border:1px solid #fde68a;border-radius:14px;padding:12px;margin-top:12px;white-space:pre-wrap;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--mt);margin-bottom:4px}.meta span{background:#f1f3f4;border-radius:10px;padding:2px 8px}
.nav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.nav .btn{flex:1;text-align:center}
.btn{background:linear-gradient(135deg,#7c3aed,#6d28d9)!important;color:#fff!important;border:none!important;border-radius:25px!important;padding:9px 16px!important;font-weight:800!important;box-shadow:0 4px 12px rgba(124,58,237,.25);cursor:pointer}
.btn:active{transform:scale(.94)}.btn.g{background:linear-gradient(135deg,#10b981,#059669)!important}.btn.r{background:linear-gradient(135deg,#ef4444,#dc2626)!important}.btn.gray{background:#eef2ff!important;color:#334155!important;box-shadow:none!important;border:1px solid #e2e8f0!important}.btn.sm{padding:6px 14px!important;font-size:12px!important}.btn.off{opacity:.45;pointer-events:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}select,input[type=search],input[type=number],input[type=text]{border:1.5px solid #ddd6fe!important;border-radius:12px!important;padding:9px 10px!important;background:#f8fafc!important;font-weight:600!important;font-size:13px!important;outline:none}
select:focus,input:focus{border-color:#7c3aed!important;background:#fff!important}
.lbl{font-size:12px;color:var(--mt);margin:6px 0 2px;font-weight:700}
.pb{height:8px;background:#e0e3e7;border-radius:14px;overflow:hidden;margin:6px 0}.pb i{display:block;height:100%;background:var(--gr)}
.stats5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}.stats5 div{background:linear-gradient(180deg,#f5f3ff,#fff)!important;border:1px solid #ede9fe;border-radius:14px!important;padding:10px 2px;font-size:11px;color:var(--mt);cursor:pointer}.stats5 b{display:block;font-size:17px;color:var(--tx);font-weight:800}
.tc{cursor:pointer}.tc .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.full{background:var(--gr2);color:#0d652d;border-radius:14px;padding:10px;text-align:center;font-weight:600;margin-top:10px}
.note{font-size:11px;color:var(--mt);margin-top:8px}.big{text-align:center;padding:22px 12px}.big b{font-size:24px;display:block;margin:8px 0}
.qimg,.oimg{max-width:100%;height:auto;display:block;margin:6px 0;border-radius:10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.fc{border:1.5px solid #ddd6fe;background:#fff;border-radius:20px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;color:#334155}.fc.on{background:#7c3aed!important;color:#fff!important;border-color:#7c3aed}.fc small{opacity:.8}
/* ===== दूसरे Code से लिया Logic: Notes + Blur + Move Popup ===== */
.nbox{margin-top:12px}.nlbl{font-size:12px;color:#5f6368;margin-bottom:4px;font-weight:600}.nbox textarea{width:100%;box-sizing:border-box;min-height:72px;border:1.5px solid #e2e8f0;border-radius:12px;padding:10px;font-size:14px;font-family:inherit;background:#fff;color:#202124}
.blur{display:inline-block;background:#e5e7eb;color:transparent;text-shadow:0 0 7px rgba(0,0,0,.55);padding:8px 14px;border-radius:12px;cursor:pointer;font-weight:700}.blur.rev{background:#ecfdf5;color:#047857;text-shadow:none;border:1px solid #a7f3d0}.evrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.mvov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}.mvbox{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:420px;box-shadow:0 20px 40px rgba(0,0,0,.25)}.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 18px;border-radius:25px;font-size:13px;z-index:300;max-width:90%;font-weight:600}
.hintx{font-size:12px;color:#7c3aed;text-align:center;margin:10px 0;font-weight:600;background:#fff;padding:8px;border-radius:20px}
mark{background:#fef08a;font-weight:bold;padding:0 2px;border-radius:3px}
</style></head><body>
<div class="top"><b>📚 Revision</b></div>
<div class="wrap">
  <div class="bar" id="ctl"></div>
  <div id="main"><div class="card" style="text-align:center">Loading questions…</div></div>
</div>
<script src="nav.js?v=5"></script>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const STRUCT={teaching:['NTT','PRT','TGT','PGT'],nonTeaching:['10th','12th','Graduation Level']};
let ALL=[],OV={};
try{OV=JSON.parse(localStorage.getItem('examTopics'))||{}}catch(e){}
function hashStr(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return String(h)}
const qKey=q=>q.qid?String(q.qid):'h'+hashStr(q.qEn||'');
// ---- Topic auto-detection - DATA नहीं जोड़ा, सिर्फ Logic रखा (disc हटाया) ----
const R={
rea:[[/series|come in place|श्रृंखला/,'Series'],[/related to|odd one|does not belong|संबंधित|अलग/,'Analogy & Classification'],[/coded|code|कूट/,'Coding-Decoding'],[/father|mother|brother|sister|\bson\b|daughter|uncle|aunt|पिता|माता|भाई|बहन/,'Blood Relations'],[/north|south|east|west|direction|दिशा/,'Direction'],[/rank|\brow\b|tallest|taller|heavier|पंक्ति/,'Ranking & Order'],[/venn|conclusion|statement|कथन|निष्कर्ष/,'Statements & Syllogism'],[/mirror|water image|folded|cube|dice|figure|दर्पण|पासा/,'Figure & Non-verbal'],[/calendar|clock|day of the week|घड़ी/,'Calendar & Clock'],[/symbol|interchang|operation|चिह्न/,'Mathematical Operations']],
math:[[/percent|%|प्रतिशत/,'Percentage'],[/profit|loss|discount|लाभ|हानि|छूट/,'Profit, Loss & Discount'],[/simple interest|compound|interest|ब्याज/,'Interest'],[/ratio|proportion|अनुपात/,'Ratio & Proportion'],[/average|mean|औसत/,'Average'],[/work|pipe|tank|काम|नल/,'Time & Work'],[/speed|train|km\/h|distance|चाल|ट्रेन/,'Time, Speed & Distance'],[/triangle|circle|area|perimeter|volume|radius|क्षेत्रफल|त्रिभुज|वृत्त/,'Geometry & Mensuration'],[/sin|cos|tan|trigonometr/,'Trigonometry'],[/divisible|hcf|lcm|prime|remainder|लघुत्तम|महत्तम|भाज्य/,'Number System'],[/simplif|value of|सरल/,'Simplification'],[/x\s*[+-]|equation|समीकरण/,'Algebra']],
eng:[[/passage|comprehension/,'Comprehension'],[/error|incorrect|grammatically/,'Error Spotting'],[/fill in the blank|blank/,'Fill in the Blanks'],[/synonym|similar in meaning/,'Synonyms'],[/antonym|opposite/,'Antonyms'],[/idiom|phrase/,'Idioms & Phrases'],[/one word|substitut/,'One Word Substitution'],[/spelt|spelling/,'Spelling'],[/passive|active voice|narration|direct|indirect/,'Voice & Narration'],[/rearrange|jumbled|sentence/,'Sentence Arrangement']],
hin:[[/संधि/,'संधि'],[/समास/,'समास'],[/पर्यायवाची|समानार्थी/,'पर्यायवाची'],[/विलोम|विपरीतार्थक/,'विलोम'],[/मुहावरा|मुहावरे|लोकोक्ति/,'मुहावरे व लोकोक्तियाँ'],[/शुद्ध|अशुद्ध|वर्तनी/,'शब्द शुद्धि'],[/एक शब्द|के लिए.*शब्द/,'एक शब्द'],[/अलंकार/,'अलंकार'],[/कारक|विभक्ति/,'कारक'],[/गद्यांश|अनुच्छेद/,'गद्यांश']],
gk:[[/emperor|dynasty|battle|mughal|revolt|ancient|medieval|freedom|वंश|युद्ध|मुगल|आंदोलन/,'History'],[/river|mountain|plateau|climate|soil|national park|नदी|पर्वत|पठार/,'Geography'],[/constitution|article|president|parliament|amendment|संविधान|अनुच्छेद|राष्ट्रपति|संसद/,'Polity'],[/gdp|bank|tax|budget|inflation|rbi|economy|बैंक|बजट|अर्थ/,'Economy'],[/physics|chemistry|biology|vitamin|acid|cell|gas|element|विटामिन|अम्ल|कोशिका|तत्व/,'Science'],[/award|prize|trophy|olympic|cup|खेल|पुरस्कार|ओलंपिक/,'Awards & Sports'],[/author|book|wrote|written by|लेखक|पुस्तक|रचना/,'Books & Authors'],[/dance|festival|temple|folk|नृत्य|मंदिर|त्योहार/,'Art & Culture']]};
function kind(n){n=n.toLowerCase();return/reasoning|intelligence/.test(n)?'rea':/arith|numer|quant|math/.test(n)?'math':/english/.test(n)?'eng':/hindi/.test(n)?'hin':/awareness|knowledge|gk|current/.test(n)?'gk':''}
function autoTopic(sn,q){const r=R[kind(sn)]||[],t=((q.qEn||'')+' '+(q.qHi||'')).toLowerCase();for(const[x,n]of r)if(x.test(t))return n;return 'अन्य / Other'}
const topicOf=o=>OV[o.key]||o.q.topic||o.auto;
const stripN=n=>String(n||'').replace(/\s*[-–:]?\s*[\(\[]?\s*(part|set|भाग)?\s*\d+\s*[\)\]]?\s*$/i,'').trim();
function normSubj(name,nameHi,CFG){const al={};Object.keys((CFG&&CFG.subjectAliases)||{}).forEach(k=>al[stripN(k).toLowerCase()]=CFG.subjectAliases[k]);let n=stripN(name)||String(name||'').trim();const a=al[n.toLowerCase()];if(a)n=a;return {name:n,nameHi:stripN(nameHi)||nameHi,key:n.toLowerCase()};}
async function load(){
  let C;try{C=await(await fetch('tests.json')).json()}catch(e){$('main').innerHTML='<div class="card empty">tests.json नहीं मिली। Server/hosting से खोलें।</div>';return}
  const files={};
  Object.keys(STRUCT).forEach(c=>STRUCT[c].forEach(l=>{const n=((C[c]||{})[l])||{};
    Object.keys(n).forEach(p=>Object.keys(n[p]||{}).forEach(y=>(n[p][y]||[]).forEach(t=>{if(!files[t.file])files[t.file]={c,l,p,y,t:t.title}})))}));
  const seen=new Set();
  for(const f of Object.keys(files)){
    let d;try{d=await(await fetch(f)).json()}catch(e){continue}
    (d.sections||[]).forEach(s=>(s.questions||[]).forEach(q=>{
      const key=qKey(q);if(seen.has(key))return;seen.add(key);
      const ns=normSubj(s.name,s.nameHi,C);
      ALL.push({key,q,sn:ns.name,snHi:ns.nameHi||ns.name,sk:ns.key,auto:autoTopic(ns.name,q),m:files[f]});
    }));
  }
  // ===== दूसरे Code से लिया Logic: notes.json को भी Question की तरह जोड़ना =====
  try{
    const nr=await fetch('notes.json');
    if(nr.ok){
      const nd=await nr.json(),arr=Array.isArray(nd)?nd:(nd.notes||[]);
      arr.forEach(n=>{
        if(!n||!(n.q||n.title))return;
        const id=String(n.id||_nh((n.title||'')+(n.q||''))).replace(/[^A-Za-z0-9_-]/g,'');
        const key='n'+id;if(seen.has(key))return;seen.add(key);
        const subj=String(n.subject||'Notes').trim();
        ALL.push({key,kind:'note',note:{title:n.title||'',desc:n.desc||'',q:n.q||n.title||'',a:n.a||'',more:n.more||'',date:n.date||''},
          q:{topic:n.topic||''},sn:subj,snHi:n.subjectHi||subj,sk:subj.toLowerCase(),auto:n.topic||'अन्य / Other',m:{c:'notes',l:'Notes',p:'Notes',y:n.date||''}});
      });
    }
  }catch(e){}
  const sk=[...new Set(ALL.map(o=>o.sk))];F.subj=sk[0]||'';draw();
}

// ================= दूसरे Code से लिया Logic: Self Notes =================
function _nh(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return String(h)}
function noteGet(k){try{return (JSON.parse(localStorage.getItem('examNotes'))||{})[k]||''}catch(e){return ''}}
function noteSet(k,v){try{const m=JSON.parse(localStorage.getItem('examNotes'))||{};if(String(v).trim())m[k]=v;else delete m[k];localStorage.setItem('examNotes',JSON.stringify(m))}catch(e){}}
function noteBox(k){return '<div class="nbox"><div class="nlbl">📝 My Notes</div><textarea rows="3" placeholder="इस प्रश्न के लिए अपने नोट्स लिखें…" oninput="noteSet(\''+k+'\',this.value)">'+String(noteGet(k)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</textarea></div>'}
function toast(t){const o=document.getElementById('toastB');if(o)o.remove();const d=document.createElement('div');d.id='toastB';d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>{const x=document.getElementById('toastB');if(x)x.remove()},2500)}
function hl(text,kw){const t=esc(text);if(!kw)return t;const k=esc(kw).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{return t.replace(new RegExp('('+k+')','gi'),'<mark>$1</mark>')}catch(e){return t}}

// ================= पहला Code: Learning ⇄ Revision (4 lists) - SAME =================
const LS='examLearning2';
let REC={},SS=null,REV={};
try{REC=JSON.parse(localStorage.getItem(LS))||{}}catch(e){}
try{localStorage.removeItem('examLearning');localStorage.removeItem('examLearningMeta')}catch(e){}
const saveR=()=>{try{localStorage.setItem(LS,JSON.stringify(REC))}catch(e){}};
let F={l:'',lang:'en',subj:'',top:'',view:'home',list:''};
let UI={src:{L:1,X:0,G:0},kw:'',ln:'20',rsrc:{R:1,X:1,G:1},days:'0',rn:'20'};
const hi=()=>F.lang==='hi';
const DAY=864e5,NM={L:'📘 Learning',R:'📝 Revision बाकी',X:'🔴 लाल',G:'🟢 हरी'};
const listOf=o=>(REC[o.key]&&REC[o.key].l)||'L';
const refT=o=>{const r=REC[o.key];return r?(r.lastRevisionAt||r.learnedAt||0):0};
const ageD=o=>{const t=refT(o);return t?(Date.now()-t)/DAY:0};
const never=o=>{const r=REC[o.key];return !!r&&!r.lastRevisionAt};
const itemsOf=(sk,t)=>ALL.filter(o=>(!F.l||o.m.l===F.l)&&o.sk===sk&&topicOf(o)===t);
const cur=()=>itemsOf(F.subj,F.top);
function cnt(list){const c={L:0,R:0,X:0,G:0,t:list.length};list.forEach(o=>c[listOf(o)]++);return c}
const p2=n=>String(n).padStart(2,'0');
function fmtT(ts){const d=new Date(ts);let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;return `${p2(d.getDate())}-${p2(d.getMonth()+1)}-${d.getFullYear()} ${p2(h)}:${p2(d.getMinutes())} ${ap}`}
function ago(ts){const m=(Date.now()-ts)/6e4;if(m<60)return 'अभी अभी';if(m<1440)return Math.floor(m/60)+' घंटे पहले';return Math.floor(m/1440)+' दिन पहले'}
function lastRev(list){let t=0;list.forEach(o=>{const r=REC[o.key];if(r&&r.lastRevisionAt&&r.lastRevisionAt>t)t=r.lastRevisionAt});return t}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const mk=o=>REC[o.key]=REC[o.key]||{a:0,c:0,w:0,l:'L'};
function learnAns(o,ok){const r=mk(o);r.a++;if(ok){r.c++;r.l='R';r.learnedAt=Date.now();delete r.lastRevisionAt}else{r.w++;if(r.l==='G')r.l='X'}saveR()}
function revAns(o,ok){const r=mk(o);r.a++;if(ok){r.c++;r.l='G'}else{r.w++;r.l='X'}r.lastRevisionAt=Date.now()}
function setF(k,v){F[k]=v;if(k==='subj')F.top='';F.view='home';SS=null;draw()}
function openT(t){F.top=t;F.view='dash';SS=null;draw()}
function toTopics(){F.top='';F.view='home';SS=null;draw()}
function back(){F.view=F.top?'dash':'home';SS=null;draw()}
function ctl(){
  const lv=[...new Set(ALL.map(o=>o.m.l))];
  $('ctl').innerHTML=`<select onchange="setF('l',this.value)" style="flex:1"><option value="">All Levels</option>${lv.map(l=>`<option${l===F.l?' selected':''}>${esc(l)}</option>`).join('')}</select>
  <select onchange="F.lang=this.value;draw()" style="flex:1"><option value="en"${F.lang==='en'?' selected':''}>English</option><option value="hi"${F.lang==='hi'?' selected':''}>हिंदी</option></select>`;
}
const isFull=c=>c.t>0&&c.G===c.t;
function tiles(c,click){return `<div class="stats5">${['L','R','X','G'].map(k=>`<div ${click?`onclick="openList('${k}')" style="cursor:pointer"`:''}><b>${c[k]}</b>${NM[k]}</div>`).join('')}<div><b>${c.t}</b>Total</div></div>`}
function drawHome(){
  const lv=ALL.filter(o=>!F.l||o.m.l===F.l),sm={};
  lv.forEach(o=>{(sm[o.sk]=sm[o.sk]||{n:hi()?o.snHi:o.sn,l:[]}).l.push(o)});
  if(!sm[F.subj])F.subj=Object.keys(sm)[0]||'';
  let h=`<div class="lbl">विषय (Subject)</div><div class="chipbar">${Object.keys(sm).map(k=>{const c=cnt(sm[k].l);return `<button class="fc${k===F.subj?' on':''}" onclick="setF('subj',this.dataset.v)" data-v="${esc(k)}">${esc(sm[k].n)} <small>🟢${c.G}/${c.t}</small></button>`}).join('')}</div><div class="lbl">टॉपिक (Topic) चुनें</div>`;
  const tm={};(sm[F.subj]?sm[F.subj].l:[]).forEach(o=>{(tm[topicOf(o)]=tm[topicOf(o)]||[]).push(o)});
  h+=Object.keys(tm).sort().map(t=>{const c=cnt(tm[t]),p=c.t?Math.round(c.G/c.t*100):0;return `<div class="card tc" onclick="openT(this.dataset.t)" data-t="${esc(t)}"><div class="r"><b>${esc(t)}</b><span>${isFull(c)?'🎓':''} ${p}%</span></div><div class="pb"><i style="width:${p}%"></i></div><div class="note" style="margin:0">📘 ${c.L} • 📝 ${c.R} • 🔴 ${c.X} • 🟢 ${c.G} • कुल ${c.t}</div></div>`}).join('')||'<div class="card" style="text-align:center">कोई question नहीं मिला।</div>';
  $('main').innerHTML=h;
}
function learnPool(){
  const kw=UI.kw.trim().toLowerCase();
  const p=cur().filter(o=>UI.src[listOf(o)]&&(!kw||((o.q.qEn||'')+' '+(o.q.qHi||'')+' '+(o.q.optEn||[]).join(' ')+' '+(o.q.optHi||[]).join(' ')).toLowerCase().includes(kw)));
  return ['X','L','G'].flatMap(k=>shuffle(p.filter(o=>listOf(o)===k)));
}
function revPool(){
  const d=Math.max(0,parseFloat(UI.days)||0);
  return cur().filter(o=>UI.rsrc[listOf(o)]&&ageD(o)>=d).sort((a,b)=>refT(a)-refT(b));
}
function updInfo(){
  const lp=learnPool(),rp=revPool(),n=parseInt(UI.ln)||lp.length,m=parseInt(UI.rn)||rp.length;
  if($('lInfo'))$('lInfo').innerHTML=`चुने गए प्रश्न: <b>${lp.length}</b> • इस बार: <b>${Math.min(n,lp.length)}</b>`;
  const rc={R:0,X:0,G:0,nv:0};rp.forEach(o=>{rc[listOf(o)]++;if(never(o))rc.nv++});
  if($('rInfo'))$('rInfo').innerHTML=`${(parseFloat(UI.days)||0)>0?(parseFloat(UI.days))+' दिन या उससे पुराने':'सभी'}: 📝 <b>${rc.R}</b> • 🔴 <b>${rc.X}</b> • 🟢 <b>${rc.G}</b> • कुल <b>${rp.length}</b> ${rc.nv?`(⭐ कभी Revise नहीं: ${rc.nv})`:''}<br>Test में आएँगे: <b>${Math.min(m,rp.length)}</b>`;
  if($('lBtn'))$('lBtn').classList.toggle('off',!lp.length);
  if($('rBtn'))$('rBtn').classList.toggle('off',!rp.length);
}
function togS(k){UI.src[k]=UI.src[k]?0:1;draw()}
function togR(k){UI.rsrc[k]=UI.rsrc[k]?0:1;draw()}
const oc=(v,k)=>`oninput="UI.${k}=this.value;updInfo()"`;
function drawDash(){
  const L=cur(),c=cnt(L),lr=lastRev(L);
  const sc=k=>`<button class="fc${UI.src[k]?' on':''}" onclick="togS('${k}')">${NM[k]} (${c[k]})</button>`;
  const rcb=k=>`<button class="fc${UI.rsrc[k]?' on':''}" onclick="togR('${k}')">${NM[k]} (${c[k]})</button>`;
  $('main').innerHTML=`<a class="fc" onclick="toTopics()" style="display:inline-block;margin-bottom:8px">← Topics</a>
  <div class="card"><h2 style="margin:0 0 8px">${esc(F.top)}</h2>${tiles(c,true)}
    <div class="note">⏱ आख़िरी Revision: ${lr?`<b>${ago(lr)}</b> (${fmtT(lr)})`:'अभी तक नहीं हुआ'}</div>
    ${isFull(c)?'<div class="full">🎓 Fully Mastered</div>':''}
    <div class="note">यह सिर्फ़ Learning Progress है, Main Test Result नहीं। किसी गिनती पर टैप करने से उसकी सूची खुलती है।</div></div>
  <div class="card"><h3 style="margin:0 0 6px">📘 Learning</h3><div class="note" style="margin:0 0 6px">किस सूची के प्रश्न पढ़ने हैं, चुनें:</div>
    <div class="chipbar">${sc('L')}${sc('X')}${sc('G')}</div>
    <div class="bar"><input type="search" placeholder="🔍 कोई शब्द खोजें (दूसरे Code वाला Search Logic)" value="${esc(UI.kw)}" ${oc('', 'kw')} style="flex:1"><input type="number" min="1" placeholder="कितने" value="${esc(UI.ln)}" ${oc('', 'ln')} style="width:90px"></div>
    <div class="note" id="lInfo"></div><div class="nav"><button class="btn" id="lBtn" onclick="startLearn()">▶ Learning शुरू करें</button></div></div>
  <div class="card"><h3 style="margin:0 0 6px">🎯 Revision Test</h3><div class="note" style="margin:0 0 6px">किस सूची के प्रश्न जाँचने हैं, चुनें:</div>
    <div class="chipbar">${rcb('R')}${rcb('X')}${rcb('G')}</div>
    <div class="bar"><input type="number" min="0" placeholder="कितने दिन पुराने (0 = सब)" value="${UI.days==='0'?'':esc(UI.days)}" oninput="UI.days=this.value||'0';updInfo()" style="flex:1"><input type="number" min="1" placeholder="कितने प्रश्न" value="${esc(UI.rn)}" ${oc('', 'rn')} style="width:100px"></div>
    <div class="note" id="rInfo"></div><div class="nav"><button class="btn g" id="rBtn" onclick="startTest()">▶ Revision Test शुरू करें</button></div></div>
  <div class="note" style="text-align:center"><a onclick="resetT()" style="color:var(--rd);cursor:pointer">इस Topic की Progress रीसेट करें (दूसरे Code वाला Reset Logic)</a></div>`;
  updInfo();
}
function resetT(){if(!confirm('इस Topic की सारी Learning Progress मिटानी है?'))return;cur().forEach(o=>delete REC[o.key]);saveR();draw()}
function openList(k){F.list=k;F.view='list';draw()}
function drawList(){
  const k=F.list,rows=cur().filter(o=>listOf(o)===k).sort((a,b)=>refT(a)-refT(b)),h=hi();
  const dd=o=>{if(k==='L')return '';const d=Math.floor(ageD(o));return never(o)?`⭐ ${d} दिन (Revise नहीं हुआ)`:`${d} दिन`};
  $('main').innerHTML=`<a class="fc" onclick="back()" style="display:inline-block;margin-bottom:8px">← वापस</a><div class="card"><h2 style="margin:0 0 6px">${NM[k]} (${rows.length})</h2>${rows.map(o=>`<div class="row"><div style="flex:1">${esc(String(h?(o.q.qHi||o.q.qEn):o.q.qEn).slice(0,110))}</div><span style="white-space:nowrap;font-size:12px;color:var(--mt)">${dd(o)}</span></div>`).join('')||'<div class="note">इस सूची में कोई प्रश्न नहीं।</div>'}</div>`;
}
// ===== दूसरे Code से लिया Logic: Note Card + Blur Answer =====
function noteBody(o,kw){
  const n=o.note,shown=REV[o.key],k=esc(o.key);
  const detail=[n.title,n.desc,n.more].filter(Boolean).join('\n\n');
  return `<div class="qt">🔹 ${hl(n.q,kw)}</div>
  <div class="evrow"><span class="blur${shown?' rev':''}" onclick="revealN('${k}')">${hi()?'उत्तर':'Answer'}: ${hl(n.a,kw)}</span>${detail?`<button class="btn gray sm" onclick="toggleMore('${k}')">📖 विवरण देखें</button>`:''}</div>
  ${detail?`<div class="sol" id="more-${k}" style="display:none">${esc(detail)}</div>`:''}
  ${shown?`<div class="evrow"><span class="note" style="margin:0">${hi()?'क्या आपने सही सोचा था?':'Did you think it right?'}</span><button class="btn g sm" onclick="markNoteLearn('${k}','ok')">हाँ ✅</button><button class="btn r sm" onclick="markNoteLearn('${k}','no')">नहीं ❌</button></div>`: `<div class="note">उत्तर देखने के लिए धुँधले उत्तर पर टैप करें।</div>`}`;
}
function revealN(key){REV[key]=true;draw()}
function markNoteLearn(key,ans){ const o=ALL.find(x=>x.key===key); if(!o) return; learnAns(o, ans==='ok'); REV[key]=false; draw(); }
function toggleMore(key){const b=document.getElementById('more-'+key);if(b)b.style.display=b.style.display==='block'?'none':'block'}

// ===== दूसरे Code से लिया Logic: Move Topic Popup =====
function openMovePopup(key){
  const tops=[...new Set(ALL.filter(o=>o.sk===F.subj).map(topicOf))].sort();
  const ov=document.createElement('div');ov.className='mvov';ov.id='customModal';
  ov.innerHTML=`<div class="mvbox"><b>इस प्रश्न को किस टॉपिक में भेजना है?</b>
    <select id="targetTopicSelect" style="width:100%;margin:10px 0">${tops.map(t=>`<option value="${esc(t)}">📌 ${esc(t)}</option>`).join('')}<option value="__new__">➕ नया टॉपिक बनाएं...</option></select>
    <div class="nav"><button class="btn gray" onclick="closeM('customModal')">रद्द करें</button><button class="btn" onclick="executeMoveOne('${esc(key)}')">भेजें</button></div></div>`;
  document.body.appendChild(ov);
}
function closeM(id){const m=document.getElementById(id);if(m)m.remove()}
function executeMoveOne(key){
  const v=document.getElementById('targetTopicSelect').value;
  if(v==='__new__'){ openNewTopicPopup(key); return; }
  OV[key]=v; try{localStorage.setItem('examTopics',JSON.stringify(OV))}catch(e){}
  closeM('customModal'); F.top=v; draw(); toast(`✅ प्रश्न "${v}" में भेज दिया गया!`);
}
function openNewTopicPopup(key){
  closeM('promptModal');
  const ov=document.createElement('div');ov.className='mvov';ov.id='promptModal';
  ov.innerHTML=`<div class="mvbox"><b>नए टॉपिक का नाम दर्ज करें:</b><input type="text" id="newTopicNameInput" placeholder="जैसे: संज्ञा, सर्वनाम..." style="width:100%;margin:10px 0"><div class="nav"><button class="btn gray" onclick="closeM('promptModal')">रद्द करें</button><button class="btn" onclick="saveNewTopicOne('${esc(key)}')">सहेजें</button></div></div>`;
  document.body.appendChild(ov); const i=document.getElementById('newTopicNameInput'); if(i) i.focus();
}
function saveNewTopicOne(key){ const v=(document.getElementById('newTopicNameInput').value||'').trim(); if(!v) return; OV[key]=v; try{localStorage.setItem('examTopics',JSON.stringify(OV))}catch(e){} closeM('customModal'); closeM('promptModal'); F.top=v; draw(); toast(`✅ प्रश्न "${v}" में भेज दिया गया!`); }

function startLearn(){
  let p=learnPool();const n=parseInt(UI.ln);if(n>0)p=p.slice(0,n);
  if(!p.length)return;SS={mode:'learn',queue:p,total:p.length,ans:undefined};F.view='learn';draw();
}
function qHTML(o,sel,lock){
  const q=o.q,h=hi(),opts=(h?q.optHi:q.optEn)||q.optEn||[],im=h?(q.imgHi||q.img):(q.imgEn||q.img),l=listOf(o);
  return `<div class="meta"><span>${esc(h?o.snHi:o.sn)}</span><span>${esc(topicOf(o))}</span>${l==='X'?'<span>🔴 लाल</span>':l==='G'?'<span>🟢 हरी</span>':''}</div><div class="qt">${esc(h?(q.qHi||q.qEn):q.qEn)}</div>${im?`<img class="qimg" src="${esc(im)}" alt="">`:''}`+
  opts.map((t,k)=>{let c='opt';if(lock){c+=' lock';if(k===q.ans)c+=' ok';else if(k===sel)c+=' bad'}else if(k===sel)c+=' sel';
    const oi=q.optImg&&q.optImg[k];return `<button class="${c}" onclick="tap(${k})">${String.fromCharCode(65+k)}. ${esc(t)}${oi?`<img class="oimg" src="${esc(oi)}" alt="">`:''}${lock&&k===q.ans?' ✔':''}</button>`}).join('');
}
function tap(k){
  if(!SS)return;
  if(SS.mode==='learn'){if(SS.ans!==undefined)return;const o=SS.queue[0];SS.ans=k;SS.ok=k===o.q.ans;learnAns(o,SS.ok);draw()}
  else if(SS.mode==='test'){SS.sel[SS.i]=k;draw()}
}
function nextL(){const o=SS.queue.shift();if(listOf(o)!=='R')SS.queue.push(o);SS.ans=undefined;draw()}
function drawLearn(){
  const c=cnt(cur());
  if(!SS.queue.length){$('main').innerHTML=`<div class="card big">🎉<b>Learning सत्र पूरा!</b>${tiles(c,false)}<div class="nav"><button class="btn" onclick="back()">Topic पर जाएँ</button></div></div>`;return}
  const o=SS.queue[0],q=o.q,h=hi(),sol=(h?q.solHi:q.solEn)||q.solEn||q.solHi||'',a=SS.ans;
  // Note वाला Question हो तो Note Logic दिखाओ
  if(o.kind==='note'){
    $('main').innerHTML=`<div class="card" style="padding:10px!important">${tiles(c,false)}</div><div class="card"><div class="meta"><span>बाकी: ${SS.queue.length}</span></div>${noteBody(o,UI.kw)}${noteBox(o.key)}<div class="nav"><button class="btn gray" onclick="back()">✕ रोकें</button><button class="btn" onclick="nextL()">Next →</button></div><div class="nav"><button class="btn gray" onclick="openMovePopup('${esc(o.key)}')">🔀 Topic बदलें / Move</button><button class="btn gray" onclick="edTopic('${esc(o.key)}')">✎ Topic बदलें</button></div></div>`;
    return;
  }
  $('main').innerHTML=`<div class="card" style="padding:10px!important">${tiles(c,false)}</div>
  <div class="card"><div class="meta"><span>बाकी: ${SS.queue.length}</span></div>${qHTML(o,a,a!==undefined)}
  ${a!==undefined?`<div class="sol"><b>${SS.ok?'✅ Correct':'❌ Wrong'}</b>${SS.ok?'':'\nसही उत्तर: '+String.fromCharCode(65+q.ans)}${sol?'\n\n'+esc(sol):'\n\nSolution उपलब्ध नहीं है।'}\n\n${SS.ok?'→ 📝 Revision बाकी में गया।':'→ यह इसी सत्र में फिर आएगा।'}</div>`:''}
  ${noteBox(o.key)}
  <div class="nav"><button class="btn gray" onclick="back()">✕ रोकें</button>${a!==undefined?`<button class="btn" onclick="nextL()">Next →</button>`:''}</div>
  <div class="nav"><button class="btn gray" onclick="openMovePopup('${esc(o.key)}')">🔀 Move / Topic बदलें</button><button class="btn gray" onclick="edTopic('${esc(o.key)}')">✎ Topic बदलें</button></div></div>`;
}
function startTest(){
  let p=revPool();const n=parseInt(UI.rn);if(n>0)p=p.slice(0,n);
  if(!p.length)return;SS={mode:'test',items:shuffle(p),i:0,sel:{}};F.view='test';draw();
}
function tgo(d){SS.i=Math.max(0,Math.min(SS.items.length-1,SS.i+d));draw()}
function submitT(){
  const un=SS.items.filter((o,i)=>SS.sel[i]===undefined).length;
  if(un&&!confirm(un+' प्रश्न बिना उत्तर के हैं (गलत गिने जाएँगे)। Submit करें?'))return;
  const wrong=[];let g=0;
  SS.items.forEach((o,i)=>{const ok=SS.sel[i]===o.q.ans;revAns(o,ok);if(ok)g++;else wrong.push({o,i})});
  saveR();SS={mode:'result',n:SS.items.length,g,wrong,sel:SS.sel};F.view='result';draw();
}
function drawTest(){
  const o=SS.items[SS.i],n=SS.items.length;
  $('main').innerHTML=`<div class="pb"><i style="width:${(SS.i+1)/n*100}%;background:var(--bl)"></i></div>
  <div class="card"><div class="meta"><span>Revision Test • Q ${SS.i+1}/${n}</span></div>${o.kind==='note'?noteBody(o,UI.kw):qHTML(o,SS.sel[SS.i],false)}
  ${noteBox(o.key)}
  <div class="nav"><button class="btn gray ${SS.i?'':'off'}" onclick="tgo(-1)">← Previous</button>${SS.i<n-1?`<button class="btn" onclick="tgo(1)">Next →</button>`:`<button class="btn g" onclick="submitT()">Submit</button>`}</div>
  <div class="nav"><button class="btn gray" onclick="if(confirm('Test छोड़ें? Progress सेव नहीं होगी।'))back()">✕ छोड़ें</button></div></div>`;
}
function drawResult(){
  const w=SS.wrong,h=hi(),c=cnt(cur());
  $('main').innerHTML=`<div class="card big">${w.length?'📝':'🎉'}<b>${SS.n} में से ${SS.g} सही</b>🟢 ${SS.g} सही • 🔴 ${w.length} गलत<div style="margin-top:12px">${tiles(c,false)}</div>
  <div class="nav"><button class="btn" onclick="back()">Topic पर जाएँ</button></div><div class="note">यह Revision/Learning Progress है, Main Test Result नहीं।</div></div>`+
  w.map(x=>{const q=x.o.q,sol=(h?q.solHi:q.solEn)||q.solEn||'',opts=(h?q.optHi:q.optEn)||q.optEn||[],sv=SS.sel[x.i];
    return `<div class="card"><div class="meta"><span>🔴 लाल सूची में गया</span></div><div class="qt">${esc(h?(q.qHi||q.qEn):q.qEn)}</div><div class="note">आपका उत्तर: ${sv===undefined?'—':esc(opts[sv])}</div><div class="opt ok lock">सही: ${String.fromCharCode(65+q.ans)}. ${esc(opts[q.ans])}</div>${sol?`<div class="sol">${esc(sol)}</div>`:''}</div>`}).join('');
}
function draw(){
  if(!ALL.length){$('main').innerHTML='<div class="card" style="text-align:center">अभी कोई test/question upload नहीं है।</div>';return}
  ctl();
  ({home:drawHome,dash:drawDash,list:drawList,learn:drawLearn,test:drawTest,result:drawResult})[F.view]();
  if(typeof renderMathInElement==='function')try{renderMathInElement($('main'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}catch(e){}
}
function edTopic(k){
  const o=ALL.find(x=>x.key===k),v=prompt('इस प्रश्न का topic लिखें / बदलें:',topicOf(o));
  if(v===null||!v.trim())return;OV[k]=v.trim();
  try{localStorage.setItem('examTopics',JSON.stringify(OV))}catch(e){}
  F.top=v.trim();if(SS&&SS.mode==='learn')SS.queue=SS.queue.filter(x=>x.key!==k);draw();
}
load().catch(e=>{try{console.error(e)}catch(x){}$('main').innerHTML='<div class="card empty" style="text-align:center">प्रश्न लोड नहीं हो पाए। पेज दोबारा खोलें।</div>'});
</script></body></html>

<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const STRUCT={teaching:['NTT','PRT','TGT','PGT'],nonTeaching:['10th','12th','Graduation Level']};
let ALL=[],OV={};
try{OV=JSON.parse(localStorage.getItem('examTopics'))||{}}catch(e){}
function hashStr(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return String(h)}
const qKey=q=>q.qid?String(q.qid):'h'+hashStr(q.qEn||'');

/* ===== ✅ यही एकमात्र बदलाव है - Dropdown से हटाने वाला Data ===== */
const HIDE_SUBJECTS=['current affairs','current','history','geography','gk','general knowledge','general awareness'];
const HIDE_TOPICS=['history','geography','current affairs','current','gk','general knowledge','general awareness','अन्य / other'];
function isHiddenSubject(name){ if(!name) return false; const n=String(name).toLowerCase().trim(); return HIDE_SUBJECTS.some(h=> n===h || n.includes(h)); }
function isHiddenTopic(topic){ if(!topic) return false; const n=String(topic).toLowerCase().trim(); return HIDE_TOPICS.some(h=> n===h || n.includes(h)); }
function isHiddenItem(o){ return isHiddenSubject(o.sn) || isHiddenSubject(o.snHi) || isHiddenTopic(topicOf(o)) || isHiddenTopic(o.auto); }
/* ===== बदलाव खत्म ===== */

const R={
disc:[[/gender|patriarch|boys dominating|inherit property|inclusiv|respecting differences|diverse cultural|linguistic diversity/,'Gender & Inclusion'],[/article|preamble|amendment|constitution|commission|rte act|ncf|national integration|1952|post-1950s|mother tongue|obligated/,'Constitution, Policy & Commissions'],[/television|advertis|more people are engaged|socialization/,'Society & Media'],[/piaget|preschool|motor skill|play types|pretend play|vocabulary growth|personality|conditioning|bullying|anxious|denial|mindfulness|observe|self-understanding|punctuality|confident|area of development|\bstage\b|viewpoints/,'Child Development & Psychology'],[/mathematic|rational number|prime number|fraction|measuring length|units must be consistent/,'Mathematics Pedagogy'],[/science|scientific|environmental|evs|eco-club|kitchen garden|plants bending/,'Science & EVS Pedagogy'],[/english|language|vocabulary|grammar|subject-verb|pronunciation|literature|sentence|translation method|rule.governed/,'English / Language Pedagogy'],[/social stud|social science|economic|textbooks|political leadership|community play/,'Social Science Pedagogy'],[/curriculum|unit plan|lesson plan|micro teaching|pedagog|experiential|peer tutoring|teaching aid|low cost|alternative schooling|activity-based|open-ended/,'Curriculum & Lesson Planning'],[/assess|evaluat|formative|higher-order/,'Assessment & Evaluation'],[/leader|principal|school board|enrol|budget|school wants|facilitator|initiative/,'School Leadership & Management']],
rea:[[/series|come in place|श्रृंखला/,'Series'],[/related to|odd one|does not belong|संबंधित|अलग/,'Analogy & Classification'],[/coded|code|कूट/,'Coding-Decoding'],[/father|mother|brother|sister|\bson\b|daughter|uncle|aunt|पिता|माता|भाई|बहन/,'Blood Relations'],[/north|south|east|west|direction|दिशा/,'Direction'],[/rank|\brow\b|tallest|taller|heavier|पंक्ति/,'Ranking & Order'],[/venn|conclusion|statement|कथन|निष्कर्ष/,'Statements & Syllogism'],[/mirror|water image|folded|cube|dice|figure|दर्पण|पासा/,'Figure & Non-verbal'],[/calendar|clock|day of the week|घड़ी/,'Calendar & Clock'],[/symbol|interchang|operation|चिह्न/,'Mathematical Operations']],
math:[[/percent|%|प्रतिशत/,'Percentage'],[/profit|loss|discount|लाभ|हानि|छूट/,'Profit, Loss & Discount'],[/simple interest|compound|interest|ब्याज/,'Interest'],[/ratio|proportion|अनुपात/,'Ratio & Proportion'],[/average|mean|औसत/,'Average'],[/work|pipe|tank|काम|नल/,'Time & Work'],[/speed|train|km\/h|distance|चाल|ट्रेन/,'Time, Speed & Distance'],[/triangle|circle|area|perimeter|volume|radius|क्षेत्रफल|त्रिभुज|वृत्त/,'Geometry & Mensuration'],[/sin|cos|tan|trigonometr/,'Trigonometry'],[/divisible|hcf|lcm|prime|remainder|लघुत्तम|महत्तम|भाज्य/,'Number System'],[/simplif|value of|सरल/,'Simplification'],[/x\s*[+-]|equation|समीकरण/,'Algebra']],
eng:[[/passage|comprehension/,'Comprehension'],[/error|incorrect|grammatically/,'Error Spotting'],[/fill in the blank|blank/,'Fill in the Blanks'],[/synonym|similar in meaning/,'Synonyms'],[/antonym|opposite/,'Antonyms'],[/idiom|phrase/,'Idioms & Phrases'],[/one word|substitut/,'One Word Substitution'],[/spelt|spelling/,'Spelling'],[/passive|active voice|narration|direct|indirect/,'Voice & Narration'],[/rearrange|jumbled|sentence/,'Sentence Arrangement']],
hin:[[/संधि/,'संधि'],[/समास/,'समास'],[/पर्यायवाची|समानार्थी/,'पर्यायवाची'],[/विलोम|विपरीतार्थक/,'विलोम'],[/मुहावरा|मुहावरे|लोकोक्ति/,'मुहावरे व लोकोक्तियाँ'],[/शुद्ध|अशुद्ध|वर्तनी/,'शब्द शुद्धि'],[/एक शब्द|के लिए.*शब्द/,'एक शब्द'],[/अलंकार/,'अलंकार'],[/कारक|विभक्ति/,'कारक'],[/गद्यांश|अनुच्छेद/,'गद्यांश']],
gk:[[/emperor|dynasty|battle|mughal|revolt|ancient|medieval|freedom|वंश|युद्ध|मुगल|आंदोलन/,'History'],[/river|mountain|plateau|climate|soil|national park|नदी|पर्वत|पठार/,'Geography'],[/constitution|article|president|parliament|amendment|संविधान|अनुच्छेद|राष्ट्रपति|संसद/,'Polity'],[/gdp|bank|tax|budget|inflation|rbi|economy|बैंक|बजट|अर्थ/,'Economy'],[/physics|chemistry|biology|vitamin|acid|cell|gas|element|विटामिन|अम्ल|कोशिका|तत्व/,'Science'],[/award|prize|trophy|olympic|cup|खेल|पुरस्कार|ओलंपिक/,'Awards & Sports'],[/author|book|wrote|written by|लेखक|पुस्तक|रचना/,'Books & Authors'],[/dance|festival|temple|folk|नृत्य|मंदिर|त्योहार/,'Art & Culture']]};
function kind(n){n=n.toLowerCase();return/discipline/.test(n)?'disc':/reasoning|intelligence/.test(n)?'rea':/arith|numer|quant|math/.test(n)?'math':/english/.test(n)?'eng':/hindi/.test(n)?'hin':/awareness|knowledge|gk|current/.test(n)?'gk':''}
function autoTopic(sn,q){const r=R[kind(sn)]||[],t=((q.qEn||'')+' '+(q.qHi||'')).toLowerCase();for(const[x,n]of r)if(x.test(t))return n;return 'अन्य / Other'}
const topicOf=o=>OV[o.key]||o.q.topic||o.auto;
const stripN=n=>String(n||'').replace(/\s*[-–:]?\s*[\(\[]?\s*(part|set|भाग)?\s*\d+\s*[\)\]]?\s*$/i,'').trim();
function normSubj(name,nameHi,CFG){const al={};Object.keys((CFG&&CFG.subjectAliases)||{}).forEach(k=>al[stripN(k).toLowerCase()]=CFG.subjectAliases[k]);let n=stripN(name)||String(name||'').trim();const a=al[n.toLowerCase()];if(a)n=a;return {name:n,nameHi:stripN(nameHi)||nameHi,key:n.toLowerCase()};}
async function load(){let C;try{C=await(await fetch('tests.json')).json()}catch(e){$('main').innerHTML='<div class="card empty">tests.json नहीं मिली। Server/hosting से खोलें।</div>';return}const files={};Object.keys(STRUCT).forEach(c=>STRUCT[c].forEach(l=>{const n=((C[c]||{})[l])||{};Object.keys(n).forEach(p=>Object.keys(n[p]||{}).forEach(y=>(n[p][y]||[]).forEach(t=>{if(!files[t.file])files[t.file]={c,l,p,y,t:t.title}})))}));const seen=new Set();for(const f of Object.keys(files)){let d;try{d=await(await fetch(f)).json()}catch(e){continue}(d.sections||[]).forEach(s=>(s.questions||[]).forEach(q=>{const key=qKey(q);if(seen.has(key))return;seen.add(key);const ns=normSubj(s.name,s.nameHi,C);ALL.push({key,q,sn:ns.name,snHi:ns.nameHi||ns.name,sk:ns.key,auto:autoTopic(ns.name,q),m:files[f]});}))}try{const nr=await fetch('notes.json');if(nr.ok){const nd=await nr.json(),arr=Array.isArray(nd)?nd:(nd.notes||[]);arr.forEach(n=>{if(!n||!(n.q||n.title))return;const id=String(n.id||_nh((n.title||'')+(n.q||''))).replace(/[^A-Za-z0-9_-]/g,'');const key='n'+id;if(seen.has(key))return;seen.add(key);const subj=String(n.subject||'Notes').trim();ALL.push({key,kind:'note',note:{title:n.title||'',desc:n.desc||'',q:n.q||n.title||'',a:n.a||'',more:n.more||'',date:n.date||''},q:{topic:n.topic||''},sn:subj,snHi:n.subjectHi||subj,sk:subj.toLowerCase(),auto:n.topic||'अन्य / Other',m:{c:'notes',l:'Notes',p:'Notes',y:n.date||''}});});}}catch(e){}
  /* ✅ Filter: Dropdown से हटाना है, MCQ Delete नहीं करना */
  ALL = ALL.filter(o=>!isHiddenItem(o));
  const sk=[...new Set(ALL.map(o=>o.sk))];F.subj=sk[0]||'';if(location.hash.length>1)readHash();draw();}
function _nh(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return String(h)}
function noteKey(q){return q.qid?String(q.qid):'h'+_nh(q.qEn||'')}
function noteGet(k){try{return (JSON.parse(localStorage.getItem('examNotes'))||{})[k]||''}catch(e){return ''}}
function noteSet(k,v){try{const m=JSON.parse(localStorage.getItem('examNotes'))||{};if(String(v).trim())m[k]=v;else delete m[k];localStorage.setItem('examNotes',JSON.stringify(m))}catch(e){}}
function noteBox(k){return '<div class="nbox"><div class="nlbl">📝 My Notes</div><textarea rows="3" placeholder="इस प्रश्न के लिए अपने नोट्स लिखें…" oninput="noteSet(\''+k+'\',this.value)">'+String(noteGet(k)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</textarea></div>'}
let F={l:'',lang:'en',subj:'',top:''};
let PROG={},SEL={},REV={},VIS=[],UI={show:40};
try{PROG=JSON.parse(localStorage.getItem('examRev4'))||{}}catch(e){}
const saveP=()=>{try{localStorage.setItem('examRev4',JSON.stringify(PROG))}catch(e){}};
const hi=()=>F.lang==='hi';const T=(h,e)=>hi()?h:e;const DAY=864e5;const stOf=o=>(PROG[o.key]||{}).status||'pending';const g$=id=>document.getElementById(id);
function toast(t){const o=g$('toastB');if(o)o.remove();const d=document.createElement('div');d.id='toastB';d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>{const x=g$('toastB');if(x)x.remove()},2500)}
function formatAgo(ts){if(!ts)return T('कभी नहीं पढ़ा गया','Never read');const mins=Math.floor((Date.now()-ts)/60000),hours=Math.floor(mins/60),days=Math.floor(hours/24);if(hi()){if(mins<2)return 'अभी-अभी';if(mins<60)return mins+' मिनट पहले';if(hours<24)return hours+' घंटे पहले';return days+' दिन पहले'}if(mins<2)return 'Just now';if(mins<60)return mins+'m ago';if(hours<24)return hours+'h ago';return days+(days===1?' day ago':' days ago');}
function hl(text,kw){const t=esc(text);if(!kw)return t;const k=esc(kw).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{return t.replace(new RegExp('('+k+')','gi'),'<mark>$1</mark>')}catch(e){return t}}
function syncHash(){const h='#'+['s='+encodeURIComponent(F.subj),'t='+encodeURIComponent(F.top),'l='+encodeURIComponent(F.l),'g='+F.lang].join('&');try{if(location.hash!==h)history.replaceState(null,'',h)}catch(e){}}
function readHash(){const p=new URLSearchParams((location.hash||'').slice(1));if(p.get('s'))F.subj=p.get('s');F.top=p.get('t')||'';F.l=p.get('l')||'';F.lang=p.get('g')==='hi'?'hi':'en'}
function draw(){renderCards()}
function subjMap(){const sm={};ALL.filter(o=>!F.l||o.m.l===F.l).forEach(o=>{(sm[o.sk]=sm[o.sk]||{n:hi()?o.snHi:o.sn,l:[]}).l.push(o)});return sm}
function fillSel(){const sm=subjMap();if(!sm[F.subj])F.subj=Object.keys(sm)[0]||'';g$('subSel').innerHTML=Object.keys(sm).map(k=>`<option value="${esc(k)}"${k===F.subj?' selected':''}>📂 ${esc(sm[k].n)}</option>`).join('');const tops=[...new Set((sm[F.subj]?sm[F.subj].l:[]).map(topicOf))].sort().filter(t=>!isHiddenTopic(t));if(F.top&&!tops.includes(F.top))F.top='';g$('topSel').innerHTML=`<option value="">${T('📌 सभी टॉपिक','📌 All Topics')}</option>`+tops.map(t=>`<option value="${esc(t)}"${t===F.top?' selected':''}>📌 ${esc(t)}</option>`).join('');const lv=[...new Set(ALL.map(o=>o.m.l))];g$('lvlSel').innerHTML=`<option value="">All Levels</option>`+lv.map(l=>`<option${l===F.l?' selected':''}>${esc(l)}</option>`).join('');g$('langSel').value=F.lang;}
function onSubj(v){F.subj=v;F.top='';SEL={};UI.show=40;g$('selAll').checked=false;renderCards()}
function onTopic(v){F.top=v;SEL={};UI.show=40;g$('selAll').checked=false;renderCards()}
function onLevel(v){F.l=v;F.top='';SEL={};UI.show=40;renderCards()}
function onLang(v){F.lang=v;renderCards()}
function setTexts(){const set=(id,h,e)=>{const x=g$(id);if(x)x.textContent=T(h,e)};set('lblTotal','कुल प्रश्न','Total Qs');set('lblCorrect','सही','Correct');set('lblWrong','गलत','Wrong');set('lblPending','शेष','Pending');set('optAll','📁 सभी स्टेटस','📁 All Status');set('optCorrect','🟢 केवल सही','🟢 Correct Only');set('optWrong','🔴 केवल गलत','🔴 Wrong Only');set('optPending','⏳ केवल शेष','⏳ Pending Only');set('lblSel','सभी चुनें','Select All');set('btnMove','🔀 मूव','🔀 Move');set('btnReset','🔄 रीसेट','🔄 Reset');g$('kw').placeholder=T('🔍 खोजें...','🔍 Search...');g$('dayIn').placeholder=T('दिन (>=)','Days (>=)');g$('hintTxt').textContent=T('💡 टिप: मूव करने पर प्रश्न उसी सब्जेक्ट के दूसरे टॉपिक में ट्रांसफर हो जाएगा!','💡 Tip: Moving questions transfers them to another topic of the same subject!');}
const itemsCur=()=>ALL.filter(o=>(!F.l||o.m.l===F.l)&&o.sk===F.subj&&(!F.top||topicOf(o)===F.top));
function imgOf(q){return hi()?(q.imgHi||q.img):(q.imgEn||q.img)}
function mcqBody(o,p,kw){const q=o.q,locked=p.status!=='pending',opts=(hi()?q.optHi:q.optEn)||q.optEn||[],im=imgOf(q),sol=(hi()?q.solHi:q.solEn)||q.solEn||q.solHi||'';const ob=opts.map((t,k)=>{let c='opt';if(locked){c+=' lock';if(k===q.ans)c+=' ok';else if(p.selectedOpt===k)c+=' bad'}else if(p.selectedOpt===k)c+=' sel';const oi=q.optImg&&q.optImg[k];return `<button class="${c}" onclick="pickOpt('${esc(o.key)}',${k})">${String.fromCharCode(65+k)}. ${hl(t,kw)}${oi?`<img class="oimg" src="${esc(oi)}" alt="">`:''}${locked&&k===q.ans?' ✔':''}</button>`}).join('');return `<div class="qt">${hl(hi()?(q.qHi||q.qEn):q.qEn,kw)}</div>${im?`<img class="qimg" src="${esc(im)}" alt="">`:''}<div>${ob}</div>`+(locked?`<div class="sol"><b>${T('स्पष्टीकरण (Solution):','Solution:')}</b><br>${sol?hl(sol,kw):T('Solution उपलब्ध नहीं है।','No solution available.')}</div>`:'');}
function noteBody(o,p,kw){const n=o.note,locked=p.status!=='pending',shown=locked||REV[o.key],k=esc(o.key);const detail=[n.title,n.desc,n.more].filter(Boolean).join('\n\n');return `<div class="qt">🔹 ${hl(n.q,kw)}</div><div class="evrow"><span class="blur${shown?' rev':''}" ${locked?'':`onclick="revealN('${k}')"`}>${T('उत्तर','Answer')}: ${hl(n.a,kw)}</span>${detail?`<button class="btn gray sm" onclick="toggleMore('${k}')">${T('📖 विवरण देखें','📖 View details')}</button>`:''}</div>${detail?`<div class="sol" id="more-${k}" style="display:none">${esc(detail)}</div>`:''}${locked?`<div class="note">${p.status==='correct'?T('✅ सही दर्ज हुआ (लॉक)','✅ Marked correct (locked)'):T('❌ गलत दर्ज हुआ (लॉक)','❌ Marked wrong (locked)')}</div>`:shown?`<div class="evrow"><span class="note" style="margin:0">${T('क्या आपने सही सोचा था?','Did you think it right?')}</span><button class="btn g sm" onclick="markNote('${k}','correct')">${T('हाँ ✅','Yes ✅')}</button><button class="btn r sm" onclick="markNote('${k}','wrong')">${T('नहीं ❌','No ❌')}</button></div>`: `<div class="note">${T('उत्तर देखने के लिए धुँधले उत्तर पर टैप करें।','Tap the blurred answer to reveal it.')}</div>`}`;}
function cardHTML(o,idx,kw){const p=PROG[o.key]||{status:'pending'},k=esc(o.key);const tm=p.firstAttemptAt?T(`⏱️ पहली बार हल: ${formatAgo(p.firstAttemptAt)} | आखिरी बार: ${formatAgo(p.lastRevisedAt)}`,`⏱️ First attempt: ${formatAgo(p.firstAttemptAt)} | Last: ${formatAgo(p.lastRevisedAt)}`):T('⏳ अभी तक नहीं पढ़ा गया (Pending)','⏳ Pending');return `<div class="ncard" id="card-${k}"><div class="ctitle"><label><input type="checkbox" ${SEL[o.key]?'checked':''} onchange="toggleOne('${k}',this.checked)"><span>${idx+1}. ${esc(topicOf(o))}</span></label><button class="btn gray sm" onclick="moveOne('${k}')">${T('🔀 मूव','🔀 Move')}</button></div><div class="tmeta">${tm}</div>${o.kind==='note'?noteBody(o,p,kw):mcqBody(o,p,kw)}${noteBox(o.key)}</div>`;}
function renderCards(){fillSel();setTexts();const base=itemsCur();let cor=0,wro=0,pen=0;base.forEach(o=>{const s=stOf(o);if(s==='correct')cor++;else if(s==='wrong')wro++;else pen++});g$('statTotal').textContent=base.length;g$('statCorrect').textContent=cor;g$('statWrong').textContent=wro;g$('statPending').textContent=pen;const kw=(g$('kw').value||'').trim().toLowerCase(),sf=g$('stSel').value,dv=parseFloat(g$('dayIn').value);VIS=base.filter(o=>{const p=PROG[o.key]||{status:'pending'};if(sf!=='all'&&p.status!==sf)return false;if(!isNaN(dv)&&dv>=0){if(!p.lastRevisedAt)return false;if((Date.now()-p.lastRevisedAt)/DAY<dv)return false}if(kw&&!oText(o).toLowerCase().includes(kw))return false;return true;});const box=g$('cards');if(!ALL.length){box.innerHTML='<div class="card" style="text-align:center">अभी कोई test/question upload नहीं है।</div>';syncHash();return}if(!VIS.length){box.innerHTML=`<div class="ncard" style="text-align:center;color:var(--mt)">${T('इन मानदंडों के अनुसार कोई प्रश्न नहीं मिला।','No questions found matching criteria.')}</div>`}else{box.innerHTML=VIS.slice(0,UI.show).map((o,i)=>cardHTML(o,i,kw)).join('')+(VIS.length>UI.show?`<div style="text-align:center"><button class="btn gray" onclick="UI.show+=40;renderCards()">${T('और दिखाएँ','Show more')} (${VIS.length-UI.show})</button></div>`:'');}g$('selAll').checked=VIS.length>0&&VIS.every(o=>SEL[o.key]);if(typeof renderMathInElement==='function')try{renderMathInElement(box,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}catch(e){}syncHash();}
function oText(o){return o.kind==='note'?[o.note.title,o.note.desc,o.note.q,o.note.a].join(' '):((o.q.qEn||'')+' '+(o.q.qHi||'')+' '+(o.q.optEn||[]).join(' ')+' '+(o.q.optHi||[]).join(' '))}
function setStatus(o,status,sel){const now=Date.now(),pr=PROG[o.key]||{};PROG[o.key]={status,selectedOpt:sel,firstAttemptAt:pr.firstAttemptAt||now,lastRevisedAt:now};saveP();renderCards();}
function pickOpt(key,k){const o=ALL.find(x=>x.key===key);if(!o||stOf(o)!=='pending')return;setStatus(o,k===o.q.ans?'correct':'wrong',k)}
function revealN(key){REV[key]=true;renderCards()}
function markNote(key,st){const o=ALL.find(x=>x.key===key);if(!o||stOf(o)!=='pending')return;setStatus(o,st,null)}
function toggleMore(key){const b=g$('more-'+key);if(b)b.style.display=b.style.display==='block'?'none':'block'}
function toggleOne(key,c){if(c)SEL[key]=true;else delete SEL[key];g$('selAll').checked=VIS.length>0&&VIS.every(o=>SEL[o.key])}
function toggleAll(c){VIS.forEach(o=>{if(c)SEL[o.key]=true;else delete SEL[o.key]});renderCards()}
function moveOne(key){SEL={};SEL[key]=true;openMove()}
function selKeys(){return Object.keys(SEL).filter(k=>SEL[k])}
function openMove(){const keys=selKeys();if(!keys.length){alert(T('कृपया कम से कम एक प्रश्न चुनें!','Please select at least one question!'));return}const tops=[...new Set(ALL.filter(o=>o.sk===F.subj).map(topicOf))].sort().filter(t=>!isHiddenTopic(t));const ov=document.createElement('div');ov.className='mvov';ov.id='customModal';ov.innerHTML=`<div class="mvbox"><b>${T(`चुने गए ${keys.length} प्रश्नों को किस टॉपिक में भेजना है?`,`Move the ${keys.length} selected questions to topic:`)}</b><select id="targetTopicSelect" style="width:100%;margin:10px 0;box-sizing:border-box">${tops.map(t=>`<option value="${esc(t)}">📌 ${esc(t)}</option>`).join('')}<option value="__new__">${T('➕ नया टॉपिक बनाएं...','➕ Create new topic...')}</option></select><div class="nav"><button class="btn gray" onclick="closeM('customModal')">${T('रद्द करें','Cancel')}</button><button class="btn" onclick="executeMove()">${T('भेजें','Send')}</button></div></div>`;document.body.appendChild(ov);}
function closeM(id){const m=g$(id);if(m)m.remove()}
function applyMove(keys,name){keys.forEach(k=>{OV[k]=name});try{localStorage.setItem('examTopics',JSON.stringify(OV))}catch(e){}SEL={};closeM('customModal');closeM('promptModal');renderCards();toast(T(`✅ ${keys.length} प्रश्न "${name}" में भेज दिए गए हैं!`,`✅ ${keys.length} questions moved to "${name}"!`));}
function executeMove(){const v=g$('targetTopicSelect').value;if(v==='__new__'){openNewTopic();return}applyMove(selKeys(),v);}
function openNewTopic(){closeM('promptModal');const ov=document.createElement('div');ov.className='mvov';ov.id='promptModal';ov.innerHTML=`<div class="mvbox"><b>${T('नए टॉपिक का नाम दर्ज करें:','Enter new topic name:')}</b><input type="text" id="newTopicNameInput" placeholder="${T('जैसे: संज्ञा, सर्वनाम...','e.g. Nouns, Pronouns...')}" style="width:100%;margin:10px 0;box-sizing:border-box"><div class="nav"><button class="btn gray" onclick="closeM('promptModal')">${T('रद्द करें','Cancel')}</button><button class="btn" onclick="saveNewTopic()">${T('सहेजें (Save)','Save')}</button></div></div>`;document.body.appendChild(ov);const i=g$('newTopicNameInput');if(i&&i.focus)i.focus();}
function saveNewTopic(){const v=(g$('newTopicNameInput').value||'').trim();if(!v)return;applyMove(selKeys(),v)}
function confirmReset(){const sf=g$('stSel').value,names={all:T('सभी प्रश्न','All questions'),correct:T('केवल सही प्रश्न','Correct questions only'),wrong:T('केवल गलत प्रश्न','Wrong questions only'),pending:T('केवल शेष प्रश्न','Pending questions only')};const ov=document.createElement('div');ov.className='mvov';ov.id='resetModal';ov.innerHTML=`<div class="mvbox"><b style="color:var(--rd)">⚠️ ${T('चेतावनी','Warning')}</b><p style="font-size:14px;margin:10px 0">${T(`क्या आप इस विषय/टॉपिक के <b>${names[sf]}</b> की प्रगति रीसेट करना चाहते हैं?`,`Reset progress for <b>${names[sf]}</b> in this subject/topic?`)}</p><div class="nav"><button class="btn gray" onclick="closeM('resetModal')">${T('रद्द करें','Cancel')}</button><button class="btn r" onclick="executeReset()">${T('हाँ, रीसेट करें','Yes, Reset')}</button></div></div>`;document.body.appendChild(ov);}
function executeReset(){closeM('resetModal');const sf=g$('stSel').value;itemsCur().forEach(o=>{const p=PROG[o.key];if(p&&(sf==='all'||p.status===sf)){delete PROG[o.key];delete REV[o.key]}});saveP();SEL={};renderCards();toast(T('🔄 प्रगति सफलतापूर्वक रीसेट कर दी गई है!','🔄 Progress reset successfully!'));}
load().catch(e=>{try{console.error(e)}catch(x){}g$('cards').innerHTML='<div class="card empty" style="text-align:center">प्रश्न लोड नहीं हो पाए। पेज दोबारा खोलें।</div>'});
</script></body></html>

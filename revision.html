<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>📚 Revision</title>
  <style>
    :root {
      --bl:#1a73e8; --bl2:#e8f0fe; --gr:#188038; --gr2:#e6f4ea;
      --rd:#d93025; --rd2:#fce8e6; --am2:#fff7e0;
      --tx:#202124; --mt:#667085; --ln:#dadce0;
    }
    * { box-sizing:border-box }
    body {
      margin:0; background:#f6f8fb; color:var(--tx);
      font-family:Arial,"Noto Sans Devanagari",sans-serif;
    }
    .wrap { max-width:900px; margin:auto; padding:16px }
    header { margin-bottom:14px }
    header h1 { font-size:22px; margin:4px 0 12px }
    #ctl { display:flex; flex-wrap:wrap; gap:8px }
    select,input,button { font:inherit }
    select,input {
      min-width:0; padding:10px 12px; border:1px solid var(--ln);
      border-radius:10px; background:#fff; color:var(--tx);
    }
    .card {
      background:#fff; border:1px solid #e8eaed; border-radius:16px;
      padding:14px; margin:10px 0; box-shadow:0 1px 3px #0000000a;
    }
    .empty { text-align:center; color:var(--mt) }
    .lbl { font-size:12px; color:var(--mt); margin:10px 0 5px }
    .chipbar,.bar,.nav { display:flex; gap:8px; flex-wrap:wrap }
    .fc {
      border:1px solid var(--ln); background:#fff; color:var(--tx);
      border-radius:20px; padding:8px 12px; cursor:pointer;
    }
    .fc.on { color:var(--bl); border-color:var(--bl); background:var(--bl2) }
    .fc small { color:var(--gr) }
    .btn {
      border:0; border-radius:10px; background:var(--bl); color:#fff;
      padding:10px 14px; font-weight:600; cursor:pointer;
    }
    .btn.g { background:var(--gr) }
    .btn.gray { background:#e8eaed!important; color:var(--tx)!important }
    .btn.off { opacity:.45; pointer-events:none }
    .nav { margin-top:14px }
    .nav .btn { flex:1; text-align:center }
    .qt {
      white-space:pre-wrap; line-height:1.65; font-size:16px;
      font-weight:500; margin:8px 0 10px;
    }
    .opt {
      display:block; width:100%; text-align:left; padding:12px 14px;
      margin:8px 0; border:1.5px solid var(--ln); border-radius:14px;
      background:#fff; color:var(--tx); font-size:15px; line-height:1.45;
      cursor:pointer;
    }
    .opt.sel { border-color:var(--bl); background:var(--bl2) }
    .opt.ok { background:var(--gr2); border-color:var(--gr); color:#0d652d }
    .opt.bad { background:var(--rd2); border-color:var(--rd); color:#a50e0e }
    .opt.lock { cursor:default }
    .sol {
      background:var(--am2); border-radius:14px; padding:12px;
      margin-top:12px; white-space:pre-wrap; line-height:1.6;
    }
    .meta {
      display:flex; flex-wrap:wrap; gap:6px; font-size:11px;
      color:var(--mt); margin-bottom:4px;
    }
    .meta span { background:#f1f3f4; border-radius:10px; padding:2px 8px }
    .pb { height:8px; background:#e0e3e7; border-radius:4px; overflow:hidden; margin:6px 0 }
    .pb i { display:block; height:100%; background:var(--gr) }
    .stats5 {
      display:grid; grid-template-columns:repeat(5,1fr); gap:6px; text-align:center;
    }
    .stats5 div {
      background:var(--bl2); border-radius:12px; padding:8px 2px;
      font-size:10px; color:var(--mt);
    }
    .stats5 b { display:block; font-size:18px; color:var(--tx); font-weight:500 }
    .tc { cursor:pointer }
    .tc .r { display:flex; justify-content:space-between; align-items:center; gap:8px }
    .note { font-size:11px; color:var(--mt); margin-top:8px }
    .full {
      background:var(--gr2); color:#0d652d; border-radius:14px;
      padding:10px; text-align:center; font-weight:500; margin-top:10px;
    }
    .big { text-align:center; padding:22px 12px }
    .big b { font-size:24px; display:block; margin:8px 0 }
    .qimg,.oimg { max-width:100%; height:auto; display:block; margin:6px 0 }
    .row {
      display:flex; justify-content:space-between; gap:10px;
      padding:8px 0; border-bottom:1px solid #eee; font-size:13px;
    }
    .row:last-child { border-bottom:0 }
    .manage-row {
      display:grid; grid-template-columns:minmax(0,1fr) auto;
      gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid #eee;
    }
    .manage-row:last-child { border-bottom:0 }
    .muted { color:var(--mt); font-size:12px }
    .warn { color:var(--rd) }
    @media(max-width:520px) {
      .wrap { padding:10px }
      .stats5 { gap:3px }
      .stats5 div { font-size:9px }
      .stats5 b { font-size:16px }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>📚 Revision</h1>
      <div id="ctl"></div>
    </header>
    <main id="main">
      <div class="card empty">प्रश्न लोड हो रहे हैं…</div>
    </main>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const esc = t => String(t == null ? '' : t)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    const STRUCT = {
      teaching:['NTT','PRT','TGT','PGT'],
      nonTeaching:['10th','12th','Graduation Level']
    };

    let ALL = [], OV = {}, TOPIC_NAMES = {};
    try { OV = JSON.parse(localStorage.getItem('examTopics')) || {}; } catch(e) {}
    try { TOPIC_NAMES = JSON.parse(localStorage.getItem('examTopicNames')) || {}; } catch(e) {}

    function hashStr(t) {
      let h=0;
      for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))|0;
      return String(h);
    }
    const qKey = q => q.qid ? String(q.qid) : 'h'+hashStr(q.qEn||'');
    const topicOf = o => OV[o.key] || o.q.topic || o.auto;

    const R = {
      rea:[
        [/series|come in place|श्रृंखला/,'Series'],
        [/related to|odd one|does not belong|संबंधित|अलग/,'Analogy & Classification'],
        [/coded|code|कूट/,'Coding-Decoding'],
        [/father|mother|brother|sister|\bson\b|daughter|uncle|aunt|पिता|माता|भाई|बहन/,'Blood Relations'],
        [/north|south|east|west|direction|दिशा/,'Direction'],
        [/rank|\brow\b|tallest|taller|heavier|पंक्ति/,'Ranking & Order'],
        [/venn|conclusion|statement|कथन|निष्कर्ष/,'Statements & Syllogism'],
        [/mirror|water image|folded|cube|dice|figure|दर्पण|पासा/,'Figure & Non-verbal'],
        [/calendar|clock|day of the week|घड़ी/,'Calendar & Clock'],
        [/symbol|interchang|operation|चिह्न/,'Mathematical Operations']
      ],
      math:[
        [/percent|%|प्रतिशत/,'Percentage'],
        [/profit|loss|discount|लाभ|हानि|छूट/,'Profit, Loss & Discount'],
        [/simple interest|compound|interest|ब्याज/,'Interest'],
        [/ratio|proportion|अनुपात/,'Ratio & Proportion'],
        [/average|mean|औसत/,'Average'],
        [/work|pipe|tank|काम|नल/,'Time & Work'],
        [/speed|train|km\/h|distance|चाल|ट्रेन/,'Time, Speed & Distance'],
        [/triangle|circle|area|perimeter|volume|radius|क्षेत्रफल|त्रिभुज|वृत्त/,'Geometry & Mensuration'],
        [/sin|cos|tan|trigonometr/,'Trigonometry'],
        [/divisible|hcf|lcm|prime|remainder|लघुत्तम|महत्तम|भाज्य/,'Number System'],
        [/simplif|value of|सरल/,'Simplification'],
        [/x\s*[+-]|equation|समीकरण/,'Algebra']
      ],
      eng:[
        [/passage|comprehension/,'Comprehension'],
        [/error|incorrect|grammatically/,'Error Spotting'],
        [/fill in the blank|blank/,'Fill in the Blanks'],
        [/synonym|similar in meaning/,'Synonyms'],
        [/antonym|opposite/,'Antonyms'],
        [/idiom|phrase/,'Idioms & Phrases'],
        [/one word|substitut/,'One Word Substitution'],
        [/spelt|spelling/,'Spelling'],
        [/passive|active voice|narration|direct|indirect/,'Voice & Narration'],
        [/rearrange|jumbled|sentence/,'Sentence Arrangement']
      ],
      hin:[
        [/संधि/,'संधि'],[/समास/,'समास'],[/पर्यायवाची|समानार्थी/,'पर्यायवाची'],
        [/विलोम|विपरीतार्थक/,'विलोम'],[/मुहावरा|मुहावरे|लोकोक्ति/,'मुहावरे व लोकोक्तियाँ'],
        [/शुद्ध|अशुद्ध|वर्तनी/,'शब्द शुद्धि'],[/एक शब्द|के लिए.*शब्द/,'एक शब्द'],
        [/अलंकार/,'अलंकार'],[/कारक|विभक्ति/,'कारक'],[/गद्यांश|अनुच्छेद/,'गद्यांश']
      ],
      gk:[
        [/emperor|dynasty|battle|mughal|revolt|ancient|medieval|freedom|वंश|युद्ध|मुगल|आंदोलन/,'History'],
        [/river|mountain|plateau|climate|soil|national park|नदी|पर्वत|पठार/,'Geography'],
        [/constitution|article|president|parliament|amendment|संविधान|अनुच्छेद|राष्ट्रपति|संसद/,'Polity'],
        [/gdp|bank|tax|budget|inflation|rbi|economy|बैंक|बजट|अर्थ/,'Economy'],
        [/physics|chemistry|biology|vitamin|acid|cell|gas|element|विटामिन|अम्ल|कोशिका|तत्व/,'Science'],
        [/award|prize|trophy|olympic|cup|खेल|पुरस्कार|ओलंपिक/,'Awards & Sports'],
        [/author|book|wrote|written by|लेखक|पुस्तक|रचना/,'Books & Authors'],
        [/dance|festival|temple|folk|नृत्य|मंदिर|त्योहार/,'Art & Culture']
      ]
    };

    function kind(n) {
      n=String(n||'').toLowerCase();
      return /reasoning|intelligence/.test(n)?'rea':
        /arith|numer|quant|math/.test(n)?'math':
        /english/.test(n)?'eng':
        /hindi/.test(n)?'hin':
        /awareness|knowledge|gk|current/.test(n)?'gk':'';
    }
    function autoTopic(sn,q) {
      const rules=R[kind(sn)]||[];
      const text=((q.qEn||'')+' '+(q.qHi||'')).toLowerCase();
      for(const [re,name] of rules) if(re.test(text)) return name;
      return 'अन्य / Other';
    }
    function stripN(n) {
      return String(n||'').replace(/\s*[-–:]?\s*[\(\[]?\s*(part|set|भाग)?\s*\d+\s*[\)\]]?\s*$/i,'').trim();
    }
    function normSubj(name,nameHi,CFG) {
      const aliases={};
      Object.keys((CFG&&CFG.subjectAliases)||{}).forEach(k=>{
        aliases[stripN(k).toLowerCase()]=CFG.subjectAliases[k];
      });
      let n=stripN(name)||String(name||'').trim();
      if(aliases[n.toLowerCase()]) n=aliases[n.toLowerCase()];
      return {name:n,nameHi:stripN(nameHi)||nameHi,key:n.toLowerCase()};
    }

    const LS='examLearning2';
    let REC={},SS=null;
    try { REC=JSON.parse(localStorage.getItem(LS))||{}; } catch(e) {}
    try {
      localStorage.removeItem('examLearning');
      localStorage.removeItem('examLearningMeta');
    } catch(e) {}

    const saveR=()=>{ try { localStorage.setItem(LS,JSON.stringify(REC)); } catch(e) {} };
    const saveTopics=()=>{ try { localStorage.setItem('examTopics',JSON.stringify(OV)); } catch(e) {} };
    const saveTopicNames=()=>{ try { localStorage.setItem('examTopicNames',JSON.stringify(TOPIC_NAMES)); } catch(e) {} };

    let F={l:'',lang:'en',subj:'',top:'',view:'home',list:''};
    let UI={src:{L:1,X:0,G:0},kw:'',ln:'20',rsrc:{R:1,X:1,G:1},days:'0',rn:'20'};

    const hi=()=>F.lang==='hi';
    const DAY=864e5;
    const NM={L:'📘 Learning',R:'📝 Revision बाकी',X:'🔴 लाल',G:'🟢 हरी'};
    const listOf=o=>(REC[o.key]&&REC[o.key].l)||'L';
    const refT=o=>{
      const r=REC[o.key];
      return r?(r.lastRevisionAt||r.learnedAt||0):0;
    };
    const ageD=o=>refT(o)?(Date.now()-refT(o))/DAY:0;
    const never=o=>!!REC[o.key]&&!REC[o.key].lastRevisionAt;
    const fmtT=ts=>{
      const d=new Date(ts),p=n=>String(n).padStart(2,'0');
      let h=d.getHours(),ap=h>=12?'PM':'AM'; h=h%12||12;
      return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()} ${p(h)}:${p(d.getMinutes())} ${ap}`;
    };
    const ago=ts=>{
      const m=(Date.now()-ts)/6e4;
      if(m<60) return 'अभी अभी';
      if(m<1440) return Math.floor(m/60)+' घंटे पहले';
      return Math.floor(m/1440)+' दिन पहले';
    };
    const shuffle=a=>{
      a=a.slice();
      for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
      return a;
    };
    const mk=o=>REC[o.key]=REC[o.key]||{a:0,c:0,w:0,l:'L'};

    function learnAns(o,ok) {
      const r=mk(o); r.a++;
      if(ok) {
        r.c++; r.l='R'; r.learnedAt=Date.now(); delete r.lastRevisionAt;
      } else {
        r.w++;
        if(r.l==='G') r.l='X';
      }
      saveR();
    }
    function revAns(o,ok) {
      const r=mk(o); r.a++;
      if(ok) { r.c++; r.l='G'; }
      else { r.w++; r.l='X'; }
      r.lastRevisionAt=Date.now();
    }

    function itemsOf(sk,t) {
      return ALL.filter(o=>(!F.l||o.m.l===F.l)&&o.sk===sk&&topicOf(o)===t);
    }
    const cur=()=>itemsOf(F.subj,F.top);

    function cnt(list) {
      const c={L:0,R:0,X:0,G:0,t:list.length};
      list.forEach(o=>c[listOf(o)]++);
      return c;
    }
    function isFull(c) { return c.t>0&&c.G===c.t; }
    function lastRev(list) {
      let t=0;
      list.forEach(o=>{
        const r=REC[o.key];
        if(r&&r.lastRevisionAt&&r.lastRevisionAt>t) t=r.lastRevisionAt;
      });
      return t;
    }

    function topicNamesForSubject(sk) {
      return Array.isArray(TOPIC_NAMES[sk])?TOPIC_NAMES[sk]:[];
    }
    function registerTopic(sk,name) {
      name=String(name||'').trim();
      if(!name) return false;
      const names=topicNamesForSubject(sk);
      if(!names.includes(name)) {
        TOPIC_NAMES[sk]=names.concat(name).sort((a,b)=>a.localeCompare(b));
        saveTopicNames();
      }
      return true;
    }
    function topicsForCurrentSubject() {
      const names=new Set(topicNamesForSubject(F.subj));
      ALL.filter(o=>(!F.l||o.m.l===F.l)&&o.sk===F.subj).forEach(o=>names.add(topicOf(o)));
      return [...names].sort((a,b)=>a.localeCompare(b));
    }

    async function load() {
      let C;
      try { C=await (await fetch('tests.json')).json(); }
      catch(e) {
        $('main').innerHTML='<div class="card empty">tests.json नहीं मिली। इसे server/hosting से खोलें और tests.json उपलब्ध रखें।</div>';
        return;
      }

      const files={};
      Object.keys(STRUCT).forEach(category=>{
        STRUCT[category].forEach(level=>{
          const papers=((C[category]||{})[level])||{};
          Object.keys(papers).forEach(paper=>{
            Object.keys(papers[paper]||{}).forEach(year=>{
              (papers[paper][year]||[]).forEach(test=>{
                if(test&&test.file&&!files[test.file]) {
                  files[test.file]={c:category,l:level,p:paper,y:year,t:test.title};
                }
              });
            });
          });
        });
      });

      const seen=new Set(),failed=[];
      for(const file of Object.keys(files)) {
        let data;
        try { data=await (await fetch(file)).json(); }
        catch(e) { failed.push(file); continue; }

        (data.sections||[]).forEach(section=>{
          (section.questions||[]).forEach(q=>{
            const key=qKey(q);
            if(seen.has(key)) return;
            seen.add(key);
            const ns=normSubj(section.name,section.nameHi,C);
            ALL.push({
              key,q,sn:ns.name,snHi:ns.nameHi||ns.name,sk:ns.key,
              auto:autoTopic(ns.name,q),m:files[file]
            });
          });
        });
      }

      if(failed.length) console.warn('कुछ question files लोड नहीं हुईं:',failed);
      const subjects=[...new Set(ALL.map(o=>o.sk))];
      F.subj=subjects[0]||'';
      draw();
    }

    function ctl() {
      const levels=[...new Set(ALL.map(o=>o.m.l))];
      $('ctl').innerHTML=
        `<select onchange="setF('l',this.value)" aria-label="Level">
          <option value="">All Levels</option>
          ${levels.map(l=>`<option value="${esc(l)}"${l===F.l?' selected':''}>${esc(l)}</option>`).join('')}
        </select>
        <select onchange="F.lang=this.value;draw()" aria-label="Language">
          <option value="en"${F.lang==='en'?' selected':''}>English</option>
          <option value="hi"${F.lang==='hi'?' selected':''}>हिंदी</option>
        </select>`;
    }

    function tiles(c,clickable) {
      return `<div class="stats5">
        ${['L','R','X','G'].map(k=>
          `<div ${clickable?`onclick="openList('${k}')" style="cursor:pointer"`:''}>
            <b>${c[k]}</b>${NM[k]}
          </div>`).join('')}
        <div><b>${c.t}</b>Total</div>
      </div>`;
    }

    function setF(k,v) {
      F[k]=v;
      if(k==='subj') F.top='';
      F.view='home'; SS=null; draw();
    }
    function openT(t) { F.top=t; F.view='dash'; SS=null; draw(); }
    function toTopics() { F.top=''; F.view='home'; SS=null; draw(); }
    function back() { F.view=F.top?'dash':'home'; SS=null; draw(); }

    function drawHome() {
      const levelQuestions=ALL.filter(o=>!F.l||o.m.l===F.l);
      const subjects={};
      levelQuestions.forEach(o=>{
        (subjects[o.sk]=subjects[o.sk]||{n:hi()?o.snHi:o.sn,l:[]}).l.push(o);
      });
      if(!subjects[F.subj]) F.subj=Object.keys(subjects)[0]||'';

      let html=`<div class="lbl">विषय (Subject)</div>
        <div class="chipbar">
          ${Object.keys(subjects).map(k=>{
            const c=cnt(subjects[k].l);
            return `<button class="fc${k===F.subj?' on':''}" onclick="setF('subj',this.dataset.v)" data-v="${esc(k)}">
              ${esc(subjects[k].n)} <small>🟢${c.G}/${c.t}</small>
            </button>`;
          }).join('')}
        </div>
        <div class="nav">
          <button class="btn gray" onclick="openManage()">🗂️ Topic बनाएँ / Transfer करें</button>
        </div>
        <div class="lbl">टॉपिक (Topic) चुनें</div>`;

      const topicMap={};
      (subjects[F.subj]?subjects[F.subj].l:[]).forEach(o=>{
        (topicMap[topicOf(o)]=topicMap[topicOf(o)]||[]).push(o);
      });
      topicNamesForSubject(F.subj).forEach(t=>{ if(!topicMap[t]) topicMap[t]=[]; });

      const names=Object.keys(topicMap).sort((a,b)=>a.localeCompare(b));
      html+=names.map(t=>{
        const c=cnt(topicMap[t]),p=c.t?Math.round(c.G/c.t*100):0;
        return `<div class="card tc" onclick="openT(this.dataset.t)" data-t="${esc(t)}">
          <div class="r"><b>${esc(t)}</b><span>${isFull(c)?'🎓':''} ${p}%</span></div>
          <div class="pb"><i style="width:${p}%"></i></div>
          <div class="note" style="margin:0">📘 ${c.L} • 📝 ${c.R} • 🔴 ${c.X} • 🟢 ${c.G} • कुल ${c.t}</div>
        </div>`;
      }).join('')||'<div class="card empty">कोई question नहीं मिला।</div>';

      $('main').innerHTML=html;
    }

    function openManage() { F.view='manage'; SS=null; draw(); }

    function drawManage() {
      const topics=topicsForCurrentSubject();
      const counts={};
      topics.forEach(t=>counts[t]=itemsOf(F.subj,t).length);

      $('main').innerHTML=`
        <a class="fc" onclick="toTopics()" style="display:inline-block;margin-bottom:8px">← Topics</a>
        <div class="card">
          <h2 style="margin:0 0 8px">🗂️ Topic बनाएँ / Transfer करें</h2>
          <div class="note">इस सूची में चुने हुए Subject और Level के सभी Topics हैं। किसी Topic को बनाने के बाद आप प्रश्नों को उसमें transfer कर सकते हैं।</div>
          <div class="lbl">नया Topic बनाएँ</div>
          <div class="bar">
            <input id="newTopic" type="text" placeholder="नए Topic का नाम" style="flex:1">
            <button class="btn" onclick="createTopic()">＋ Topic बनाएँ</button>
          </div>
        </div>

        <div class="card">
          <h3 style="margin:0 0 6px">प्रश्नों का Topic बदलें</h3>
          <div class="note">Source Topic के सभी प्रश्न Target Topic में चले जाएँगे। प्रश्नों की Learning/Revision progress सुरक्षित रहेगी।</div>
          <div class="lbl">किस Topic से transfer करना है?</div>
          <select id="moveSource" style="width:100%">
            ${topics.map(t=>`<option value="${esc(t)}">${esc(t)} — ${counts[t]} प्रश्न</option>`).join('')}
          </select>
          <div class="lbl">किस Topic में transfer करना है?</div>
          <select id="moveTarget" style="width:100%">
            <option value="">— मौजूदा Topic चुनें —</option>
            ${topics.map(t=>`<option value="${esc(t)}">${esc(t)} — ${counts[t]} प्रश्न</option>`).join('')}
          </select>
          <div class="lbl">या नया Target Topic नाम लिखें</div>
          <input id="moveNewTarget" type="text" placeholder="खाली छोड़ें तो ऊपर वाला Topic चुनेगा" style="width:100%">
          <div class="nav">
            <button class="btn g" onclick="moveTopicQuestions()">सभी प्रश्न Transfer करें</button>
          </div>
          <div class="note warn">ध्यान दें: Source Topic के सभी प्रश्न move होंगे। यह क्रिया वापस नहीं की जा सकती।</div>
        </div>

        <div class="card">
          <h3 style="margin:0 0 6px">पूरी Topic सूची (${topics.length})</h3>
          ${topics.map(t=>`<div class="manage-row">
            <div><b>${esc(t)}</b><div class="muted">${counts[t]} प्रश्न</div></div>
            <button class="fc" onclick="openT(this.dataset.t)" data-t="${esc(t)}">खोलें</button>
          </div>`).join('')||'<div class="note">अभी कोई Topic नहीं है।</div>'}
        </div>`;
    }

    function createTopic() {
      const input=$('newTopic');
      const name=(input&&input.value||'').trim();
      if(!name) { alert('नए Topic का नाम लिखें।'); return; }
      registerTopic(F.subj,name);
      input.value='';
      draw();
    }

    function moveTopicQuestions() {
      const source=$('moveSource')&&$('moveSource').value;
      const typed=($('moveNewTarget')&&$('moveNewTarget').value||'').trim();
      const selected=$('moveTarget')&&$('moveTarget').value;
      const target=typed||selected;

      if(!source) { alert('Source Topic चुनें।'); return; }
      if(!target) { alert('मौजूदा Target चुनें या नया Target नाम लिखें।'); return; }
      if(source===target) { alert('Source और Target Topic अलग-अलग होने चाहिए।'); return; }

      const rows=itemsOf(F.subj,source);
      if(!rows.length) { alert('इस Source Topic में transfer करने के लिए प्रश्न नहीं हैं।'); return; }
      if(!confirm(`"${source}" के ${rows.length} प्रश्न "${target}" में transfer करें?`)) return;

      registerTopic(F.subj,target);
      rows.forEach(o=>{ OV[o.key]=target; });
      saveTopics();
      F.top=target;
      F.view='dash';
      SS=null;
      draw();
    }

    function learnPool() {
      const kw=UI.kw.trim().toLowerCase();
      const pool=cur().filter(o=>
        UI.src[listOf(o)] &&
        (!kw||((o.q.qEn||'')+' '+(o.q.qHi||'')+' '+
          (o.q.optEn||[]).join(' ')+' '+(o.q.optHi||[]).join(' ')).toLowerCase().includes(kw))
      );
      return ['X','L','G'].flatMap(k=>shuffle(pool.filter(o=>listOf(o)===k)));
    }
    function revPool() {
      const days=Math.max(0,parseFloat(UI.days)||0);
      return cur().filter(o=>UI.rsrc[listOf(o)]&&ageD(o)>=days)
        .sort((a,b)=>refT(a)-refT(b));
    }

    function updInfo() {
      const learning=learnPool(),revision=revPool();
      const ln=parseInt(UI.ln)||learning.length, rn=parseInt(UI.rn)||revision.length;

      if($('lInfo')) $('lInfo').innerHTML=
        `चुने गए प्रश्न: <b>${learning.length}</b> • इस बार: <b>${Math.min(ln,learning.length)}</b>`;

      const rc={R:0,X:0,G:0,nv:0};
      revision.forEach(o=>{
        rc[listOf(o)]++;
        if(never(o)) rc.nv++;
      });
      if($('rInfo')) $('rInfo').innerHTML=
        `${(parseFloat(UI.days)||0)>0?parseFloat(UI.days)+' दिन या उससे पुराने':'सभी'}:
        📝 <b>${rc.R}</b> • 🔴 <b>${rc.X}</b> • 🟢 <b>${rc.G}</b> • कुल <b>${revision.length}</b>
        ${rc.nv?`(⭐ कभी Revise नहीं: ${rc.nv})`:''}<br>Test में आएँगे:
        <b>${Math.min(rn,revision.length)}</b>`;

      if($('lBtn')) $('lBtn').classList.toggle('off',!learning.length);
      if($('rBtn')) $('rBtn').classList.toggle('off',!revision.length);
    }

    function togS(k) { UI.src[k]=UI.src[k]?0:1; draw(); }
    function togR(k) { UI.rsrc[k]=UI.rsrc[k]?0:1; draw(); }
    function inputAttr(k) { return `oninput="UI.${k}=this.value;updInfo()"`; }

    function drawDash() {
      const list=cur(),c=cnt(list),lr=lastRev(list);
      const sourceButton=k=>`<button class="fc${UI.src[k]?' on':''}" onclick="togS('${k}')">${NM[k]} (${c[k]})</button>`;
      const revisionButton=k=>`<button class="fc${UI.rsrc[k]?' on':''}" onclick="togR('${k}')">${NM[k]} (${c[k]})</button>`;

      $('main').innerHTML=`
        <a class="fc" onclick="toTopics()" style="display:inline-block;margin-bottom:8px">← Topics</a>
        <div class="card">
          <h2 style="margin:0 0 8px">${esc(F.top)}</h2>
          ${tiles(c,true)}
          <div class="note">⏱ आख़िरी Revision: ${lr?`<b>${ago(lr)}</b> (${fmtT(lr)})`:'अभी तक नहीं हुआ'}</div>
          ${isFull(c)?'<div class="full">🎓 Fully Mastered</div>':''}
          <div class="note">किसी गिनती पर टैप करने से उसकी सूची खुलेगी। प्रश्नों के गलत जवाबों की कुल गिनती सूची में दिखेगी।</div>
          <div class="nav"><button class="btn gray" onclick="openManage()">🗂️ Topic बदलें / Transfer करें</button></div>
        </div>

        <div class="card">
          <h3 style="margin:0 0 6px">📘 Learning</h3>
          <div class="note">किस सूची के प्रश्न पढ़ने हैं, चुनें:</div>
          <div class="chipbar">${sourceButton('L')}${sourceButton('X')}${sourceButton('G')}</div>
          <div class="bar" style="margin-top:8px">
            <input type="search" placeholder="कोई शब्द खोजें (वैकल्पिक)" value="${esc(UI.kw)}" ${inputAttr('kw')} style="flex:1">
            <input type="number" min="1" placeholder="कितने" value="${esc(UI.ln)}" ${inputAttr('ln')} style="width:90px">
          </div>
          <div class="note" id="lInfo"></div>
          <div class="nav"><button class="btn" id="lBtn" onclick="startLearn()">▶ Learning शुरू करें</button></div>
        </div>

        <div class="card">
          <h3 style="margin:0 0 6px">🎯 Revision Test</h3>
          <div class="note">किस सूची के प्रश्न जाँचने हैं, चुनें:</div>
          <div class="chipbar">${revisionButton('R')}${revisionButton('X')}${revisionButton('G')}</div>
          <div class="bar" style="margin-top:8px">
            <input type="number" min="0" placeholder="कितने दिन पुराने (0 = सब)" value="${UI.days==='0'?'':esc(UI.days)}"
              oninput="UI.days=this.value||'0';updInfo()" style="flex:1">
            <input type="number" min="1" placeholder="कितने प्रश्न" value="${esc(UI.rn)}" ${inputAttr('rn')} style="width:120px">
          </div>
          <div class="note" id="rInfo"></div>
          <div class="nav"><button class="btn g" id="rBtn" onclick="startTest()">▶ Revision Test शुरू करें</button></div>
        </div>

        <div class="note" style="text-align:center">
          <a onclick="resetT()" class="warn" style="cursor:pointer">इस Topic की Progress रीसेट करें</a>
        </div>`;
      updInfo();
    }

    function resetT() {
      if(!confirm('इस Topic की Learning/Revision Progress और गलत जवाबों की गिनती मिटानी है?')) return;
      cur().forEach(o=>delete REC[o.key]);
      saveR();
      draw();
    }

    function openList(k) { F.list=k; F.view='list'; draw(); }

    function drawList() {
      const k=F.list,rows=cur().filter(o=>listOf(o)===k).sort((a,b)=>refT(a)-refT(b));
      const isHi=hi();
      const dateText=o=>{
        if(k==='L') return '';
        const days=Math.floor(ageD(o));
        return never(o)?`⭐ ${days} दिन (अभी Revise नहीं हुआ)`:`${days} दिन`;
      };

      $('main').innerHTML=`
        <a class="fc" onclick="back()" style="display:inline-block;margin-bottom:8px">← वापस</a>
        <div class="card">
          <h2 style="margin:0 0 6px">${NM[k]} (${rows.length})</h2>
          ${rows.map(o=>{
            const wrong=(REC[o.key]&&REC[o.key].w)||0;
            const question=String(isHi?(o.q.qHi||o.q.qEn):o.q.qEn||'').slice(0,110);
            return `<div class="row">
              <div style="flex:1">
                ${esc(question)}
                <div class="note">❌ गलत जवाब: <b>${wrong}</b> बार</div>
              </div>
              <span style="white-space:nowrap;font-size:12px;color:var(--mt)">${dateText(o)}</span>
            </div>`;
          }).join('')||'<div class="note">इस सूची में कोई प्रश्न नहीं।</div>'}
        </div>`;
    }

    function startLearn() {
      let pool=learnPool();
      const n=parseInt(UI.ln);
      if(n>0) pool=pool.slice(0,n);
      if(!pool.length) return;
      SS={mode:'learn',queue:pool,total:pool.length,ans:undefined};
      F.view='learn'; draw();
    }

    function correctAnswer(q) { return Number(q.ans); }

    function qHTML(o,selected,locked) {
      const q=o.q,isHi=hi(),opts=(isHi?q.optHi:q.optEn)||q.optEn||[];
      const img=isHi?(q.imgHi||q.img):(q.imgEn||q.img);
      const list=listOf(o),wrong=(REC[o.key]&&REC[o.key].w)||0;
      let html=`<div class="meta">
        <span>${esc(isHi?o.snHi:o.sn)}</span><span>${esc(topicOf(o))}</span>
        <span>❌ गलत: ${wrong} बार</span>
        ${list==='X'?'<span>🔴 लाल सूची</span>':list==='G'?'<span>🟢 हरी सूची</span>':''}
      </div>
      <div class="qt">${esc(isHi?(q.qHi||q.qEn):q.qEn)}</div>
      ${img?`<img class="qimg" src="${esc(img)}" alt="">`:''}`;

      opts.forEach((text,index)=>{
        let cls='opt';
        if(locked) {
          cls+=' lock';
          if(index===correctAnswer(q)) cls+=' ok';
          else if(index===selected) cls+=' bad';
        } else if(index===selected) cls+=' sel';

        const optionImage=q.optImg&&q.optImg[index];
        html+=`<button class="${cls}" onclick="tap(${index})">
          ${String.fromCharCode(65+index)}. ${esc(text)}
          ${optionImage?`<img class="oimg" src="${esc(optionImage)}" alt="">`:''}
          ${locked&&index===correctAnswer(q)?' ✔':''}
        </button>`;
      });
      return html;
    }

    function tap(index) {
      if(!SS) return;
      if(SS.mode==='learn') {
        if(SS.ans!==undefined) return;
        const o=SS.queue[0];
        SS.ans=index; SS.ok=index===correctAnswer(o.q);
        learnAns(o,SS.ok); draw();
      } else if(SS.mode==='test') {
        SS.sel[SS.i]=index; draw();
      }
    }

    function nextL() {
      const o=SS.queue.shift();
      if(listOf(o)!=='R') SS.queue.push(o);
      SS.ans=undefined;
      draw();
    }

    function drawLearn() {
      const c=cnt(cur());
      if(!SS.queue.length) {
        $('main').innerHTML=`<div class="card big">🎉<b>Learning सत्र पूरा!</b>
          ${tiles(c,false)}<div class="nav"><button class="btn" onclick="back()">Topic पर जाएँ</button></div></div>`;
        return;
      }

      const o=SS.queue[0],q=o.q,isHi=hi();
      const solution=(isHi?q.solHi:q.solEn)||q.solEn||q.solHi||'';
      const answer=SS.ans;
      $('main').innerHTML=`
        <div class="card">${tiles(c,false)}</div>
        <div class="card">
          <div class="meta"><span>बाकी: ${SS.queue.length}</span></div>
          ${qHTML(o,answer,answer!==undefined)}
          ${answer!==undefined?`<div class="sol">
            <b>${SS.ok?'✅ Correct':'❌ Wrong'}</b>
            ${SS.ok?'':'\nसही उत्तर: '+String.fromCharCode(65+correctAnswer(q))}
            ${solution?'\n\n'+esc(solution):'\n\nSolution उपलब्ध नहीं है।'}
            \n\n${SS.ok?'→ 📝 Revision बाकी में गया।':'→ यह इसी सत्र में फिर आएगा।'}
          </div>`:''}
          <div class="nav">
            <button class="btn gray" onclick="back()">✕ रोकें</button>
            ${answer!==undefined?'<button class="btn" onclick="nextL()">Next →</button>':''}
          </div>
          <div class="nav"><button class="btn gray" onclick="edTopic(this.dataset.k)" data-k="${esc(o.key)}">✎ इस प्रश्न का Topic बदलें</button></div>
        </div>`;
    }

    function startTest() {
      let pool=revPool();
      const n=parseInt(UI.rn);
      if(n>0) pool=pool.slice(0,n);
      if(!pool.length) return;
      SS={mode:'test',items:shuffle(pool),i:0,sel:{}};
      F.view='test'; draw();
    }
    function tgo(delta) {
      SS.i=Math.max(0,Math.min(SS.items.length-1,SS.i+delta));
      draw();
    }
    function submitT() {
      const unanswered=SS.items.filter((o,i)=>SS.sel[i]===undefined).length;
      if(unanswered&&!confirm(`${unanswered} प्रश्न बिना उत्तर के हैं (गलत गिने जाएँगे)। Submit करें?`)) return;

      const wrong=[];
      let correct=0;
      SS.items.forEach((o,i)=>{
        const ok=SS.sel[i]===correctAnswer(o.q);
        revAns(o,ok);
        if(ok) correct++;
        else wrong.push({o,i});
      });
      saveR();
      SS={mode:'result',n:SS.items.length,g:correct,wrong,sel:SS.sel};
      F.view='result'; draw();
    }

    function drawTest() {
      const o=SS.items[SS.i],n=SS.items.length;
      $('main').innerHTML=`
        <div class="pb"><i style="width:${(SS.i+1)/n*100}%;background:var(--bl)"></i></div>
        <div class="card">
          <div class="meta"><span>Revision Test • Q ${SS.i+1}/${n}</span></div>
          ${qHTML(o,SS.sel[SS.i],false)}
          <div class="nav">
            <button class="btn gray ${SS.i?'':'off'}" onclick="tgo(-1)">← Previous</button>
            ${SS.i<n-1?'<button class="btn" onclick="tgo(1)">Next →</button>':'<button class="btn g" onclick="submitT()">Submit</button>'}
          </div>
          <div class="nav"><button class="btn gray" onclick="if(confirm('Test छोड़ें? Progress सेव नहीं होगी।'))back()">✕ छोड़ें</button></div>
        </div>`;
    }

    function drawResult() {
      const wrong=SS.wrong,isHi=hi(),c=cnt(cur());
      $('main').innerHTML=`
        <div class="card big">
          ${wrong.length?'📝':'🎉'}<b>${SS.n} में से ${SS.g} सही</b>
          🟢 ${SS.g} सही • 🔴 ${wrong.length} गलत
          <div style="margin-top:12px">${tiles(c,false)}</div>
          <div class="nav"><button class="btn" onclick="back()">Topic पर जाएँ</button></div>
          <div class="note">यह Revision/Learning Progress है, Main Test Result नहीं।</div>
        </div>
        ${wrong.map(item=>{
          const q=item.o.q,solution=(isHi?q.solHi:q.solEn)||q.solEn||'';
          const opts=(isHi?q.optHi:q.optEn)||q.optEn||[];
          const selected=SS.sel[item.i],count=(REC[item.o.key]&&REC[item.o.key].w)||0;
          return `<div class="card">
            <div class="meta"><span>🔴 लाल सूची में गया</span><span>❌ कुल गलत: ${count} बार</span></div>
            <div class="qt">${esc(isHi?(q.qHi||q.qEn):q.qEn)}</div>
            <div class="note">आपका उत्तर: ${selected===undefined?'—':esc(opts[selected])}</div>
            <div class="opt ok lock">सही: ${String.fromCharCode(65+correctAnswer(q))}. ${esc(opts[correctAnswer(q)])}</div>
            ${solution?`<div class="sol">${esc(solution)}</div>`:''}
          </div>`;
        }).join('')}`;
    }

    function edTopic(key) {
      const o=ALL.find(x=>x.key===key);
      if(!o) return;
      const value=prompt('इस प्रश्न का Topic लिखें / बदलें:',topicOf(o));
      if(value===null||!value.trim()) return;
      OV[key]=value.trim();
      registerTopic(o.sk,value.trim());
      saveTopics();
      F.top=value.trim();
      if(SS&&SS.mode==='learn') SS.queue=SS.queue.filter(x=>x.key!==key);
      draw();
    }

    function draw() {
      if(!ALL.length) {
        $('main').innerHTML='<div class="card empty">अभी कोई test/question upload नहीं है।</div>';
        ctl();
        return;
      }
      ctl();
      const views={
        home:drawHome,dash:drawDash,manage:drawManage,list:drawList,
        learn:drawLearn,test:drawTest,result:drawResult
      };
      (views[F.view]||drawHome)();
    }

    load().catch(error=>{
      console.error(error);
      $('main').innerHTML='<div class="card empty">प्रश्न लोड नहीं हो पाए। पेज दोबारा खोलें और Console में error जाँचें।</div>';
    });
  </script>
</body>
</html>

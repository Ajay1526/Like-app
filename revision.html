<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>📚 Learning & Revision</title>
  <style>
    :root {
      --blue:#1a73e8; --blue2:#e8f0fe; --green:#188038; --green2:#e6f4ea;
      --red:#d93025; --red2:#fce8e6; --amber:#fff7e0;
      --text:#202124; --muted:#667085; --line:#dadce0;
    }
    * { box-sizing:border-box }
    body {
      margin:0; color:var(--text); background:#f6f8fb;
      font-family:Arial,"Noto Sans Devanagari",sans-serif;
    }
    .wrap { max-width:820px; margin:auto; padding:14px }
    h1 { margin:4px 0 12px; font-size:22px }
    .card {
      background:#fff; border:1px solid #e8eaed; border-radius:14px;
      padding:14px; margin:10px 0; box-shadow:0 1px 3px #0000000a;
    }
    .controls { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px }
    select,input,button { font:inherit }
    select,input {
      min-width:0; width:100%; padding:10px;
      border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--text);
    }
    .buttons,.nav { display:flex; gap:8px; margin-top:10px }
    .btn {
      padding:11px 12px; border:0; border-radius:10px; background:var(--blue);
      color:#fff; font-weight:600; cursor:pointer;
    }
    .buttons .btn,.nav .btn { flex:1 }
    .btn.green { background:var(--green) }
    .btn.gray { background:#e8eaed; color:var(--text) }
    .btn.red { background:var(--red) }
    .btn:disabled { opacity:.5; cursor:default }
    .note { margin-top:7px; color:var(--muted); font-size:12px; line-height:1.5 }
    .question { white-space:pre-wrap; font-size:16px; line-height:1.65; margin:10px 0 }
    .meta { display:flex; gap:6px; flex-wrap:wrap; color:var(--muted); font-size:11px }
    .meta span { padding:3px 8px; border-radius:10px; background:#f1f3f4 }
    .option {
      display:block; width:100%; text-align:left; margin:8px 0; padding:12px;
      border:1.5px solid var(--line); border-radius:12px; background:#fff;
      color:var(--text); cursor:pointer; line-height:1.5;
    }
    .option.selected { border-color:var(--blue); background:var(--blue2) }
    .option.correct { border-color:var(--green); background:var(--green2); color:#0d652d }
    .option.wrong { border-color:var(--red); background:var(--red2); color:#a50e0e }
    .option.locked { cursor:default }
    .solution { white-space:pre-wrap; line-height:1.6; margin-top:10px; padding:12px; border-radius:12px; background:var(--amber) }
    .progress { height:8px; margin:8px 0; overflow:hidden; border-radius:5px; background:#e0e3e7 }
    .progress i { display:block; height:100%; background:var(--blue) }
    .row { padding:8px 0; border-bottom:1px solid #eee; font-size:13px }
    details { margin-top:12px; padding-top:10px; border-top:1px solid #eee }
    summary { color:var(--blue); cursor:pointer; font-size:14px }
    .empty { color:var(--muted); text-align:center }
    .warning { color:var(--red) }
    img { display:block; max-width:100%; height:auto; margin:8px 0 }
    @media(max-width:560px) {
      .wrap { padding:10px }
      .controls { grid-template-columns:1fr 1fr }
      .controls select:last-child { grid-column:1 / -1 }
      .buttons { flex-direction:column }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📚 Learning & Revision</h1>

    <section class="card" id="home">
      <div class="controls">
        <select id="levelSelect" aria-label="Level"></select>
        <select id="subjectSelect" aria-label="Subject"></select>
        <select id="topicSelect" aria-label="Topic"></select>
      </div>
      <div class="buttons">
        <button class="btn" id="learnBtn" onclick="startLearn()">📘 Learning शुरू करें</button>
        <button class="btn green" id="testBtn" onclick="startTest()">🎯 Revision Test शुरू करें</button>
      </div>
      <div class="note" id="homeInfo"></div>
      <div class="note warning" id="loadWarning"></div>
    </section>

    <main id="main">
      <div class="card empty">प्रश्न लोड हो रहे हैं…</div>
    </main>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const esc = value => String(value == null ? '' : value)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    const STRUCT = {
      teaching:['NTT','PRT','TGT','PGT'],
      nonTeaching:['10th','12th','Graduation Level']
    };

    const LS_PROGRESS = 'examLearning2';
    const LS_TOPICS = 'examTopics';
    let ALL = [], REC = {}, OV = {}, SESSION = null, FAILED = [];
    let FILTER = { level:'', subject:'', topic:'', lang:'en' };

    try { REC = JSON.parse(localStorage.getItem(LS_PROGRESS)) || {}; } catch(e) {}
    try { OV = JSON.parse(localStorage.getItem(LS_TOPICS)) || {}; } catch(e) {}

    const qKey = q => q.qid ? String(q.qid) : 'h' + hashStr(q.qEn || '');
    function hashStr(text) {
      let hash=0;
      for(let i=0;i<text.length;i++) hash=(hash*31+text.charCodeAt(i))|0;
      return String(hash);
    }
    const topicOf = o => OV[o.key] || o.q.topic || o.auto;
    const listOf = o => (REC[o.key] && REC[o.key].l) || 'L';
    const wrongCount = o => (REC[o.key] && REC[o.key].w) || 0;
    const isHindi = () => FILTER.lang === 'hi';
    const saveProgress = () => { try { localStorage.setItem(LS_PROGRESS,JSON.stringify(REC)); } catch(e) {} };
    const saveTopics = () => { try { localStorage.setItem(LS_TOPICS,JSON.stringify(OV)); } catch(e) {} };

    const RULES = {
      reasoning: [
        [/series|श्रृंखला/,'Series'],
        [/related to|odd one|does not belong|संबंधित|अलग/,'Analogy & Classification'],
        [/coded|code|कूट/,'Coding-Decoding'],
        [/father|mother|brother|sister|son|daughter|uncle|aunt|पिता|माता|भाई|बहन/,'Blood Relations'],
        [/north|south|east|west|direction|दिशा/,'Direction'],
        [/rank|tallest|taller|पंक्ति/,'Ranking & Order'],
        [/venn|conclusion|statement|कथन|निष्कर्ष/,'Statements & Syllogism']
      ],
      math: [
        [/percent|%|प्रतिशत/,'Percentage'],
        [/profit|loss|discount|लाभ|हानि|छूट/,'Profit, Loss & Discount'],
        [/interest|ब्याज/,'Interest'],
        [/ratio|proportion|अनुपात/,'Ratio & Proportion'],
        [/average|mean|औसत/,'Average'],
        [/work|pipe|tank|काम|नल/,'Time & Work'],
        [/speed|train|distance|चाल|ट्रेन/,'Time, Speed & Distance'],
        [/triangle|circle|area|perimeter|volume|radius|क्षेत्रफल|त्रिभुज|वृत्त/,'Geometry & Mensuration'],
        [/divisible|hcf|lcm|prime|remainder/,'Number System'],
        [/simplif|सरल/,'Simplification']
      ],
      english: [
        [/passage|comprehension/,'Comprehension'],[/error|incorrect|grammatically/,'Error Spotting'],
        [/fill in the blank|blank/,'Fill in the Blanks'],[/synonym/,'Synonyms'],
        [/antonym|opposite/,'Antonyms'],[/idiom|phrase/,'Idioms & Phrases'],
        [/spelling|spelt/,'Spelling'],[/passive|active voice|narration/,'Voice & Narration']
      ],
      hindi: [
        [/संधि/,'संधि'],[/समास/,'समास'],[/पर्यायवाची|समानार्थी/,'पर्यायवाची'],
        [/विलोम|विपरीतार्थक/,'विलोम'],[/मुहावरा|लोकोक्ति/,'मुहावरे व लोकोक्तियाँ'],
        [/शुद्ध|अशुद्ध|वर्तनी/,'शब्द शुद्धि'],[/अलंकार/,'अलंकार'],[/गद्यांश|अनुच्छेद/,'गद्यांश']
      ],
      gk: [
        [/emperor|dynasty|battle|mughal|revolt|history|वंश|युद्ध|मुगल/,'History'],
        [/river|mountain|plateau|climate|soil|नदी|पर्वत|पठार/,'Geography'],
        [/constitution|article|president|parliament|संविधान|राष्ट्रपति|संसद/,'Polity'],
        [/gdp|bank|tax|budget|inflation|economy|बैंक|बजट/,'Economy'],
        [/physics|chemistry|biology|vitamin|acid|cell|विटामिन|अम्ल|कोशिका/,'Science'],
        [/award|prize|olympic|खेल|पुरस्कार|ओलंपिक/,'Awards & Sports']
      ]
    };

    function subjectKind(name) {
      const n=String(name||'').toLowerCase();
      if(/reasoning|intelligence/.test(n)) return 'reasoning';
      if(/arith|numer|quant|math/.test(n)) return 'math';
      if(/english/.test(n)) return 'english';
      if(/hindi/.test(n)) return 'hindi';
      if(/awareness|knowledge|gk|current/.test(n)) return 'gk';
      return '';
    }
    function autoTopic(subject,q) {
      const rules=RULES[subjectKind(subject)]||[];
      const text=((q.qEn||'')+' '+(q.qHi||'')).toLowerCase();
      for(const [re,name] of rules) if(re.test(text)) return name;
      return 'अन्य / Other';
    }
    function stripNumber(text) {
      return String(text||'').replace(/\s*[-–:]?\s*[\(\[]?\s*(part|set|भाग)?\s*\d+\s*[\)\]]?\s*$/i,'').trim();
    }
    function normalizeSubject(name,nameHi,config) {
      const aliases={};
      Object.keys((config&&config.subjectAliases)||{}).forEach(key=>{
        aliases[stripNumber(key).toLowerCase()]=config.subjectAliases[key];
      });
      let clean=stripNumber(name)||String(name||'').trim();
      if(aliases[clean.toLowerCase()]) clean=aliases[clean.toLowerCase()];
      return {name:clean,nameHi:stripNumber(nameHi)||nameHi,key:clean.toLowerCase()};
    }

    function getVisibleQuestions() {
      return ALL.filter(o=>
        (!FILTER.level || o.m.l===FILTER.level) &&
        (!FILTER.subject || o.sk===FILTER.subject)
      );
    }
    function getTopics() {
      return [...new Set(getVisibleQuestions().map(topicOf))].sort((a,b)=>a.localeCompare(b));
    }
    function getCurrentQuestions() {
      return getVisibleQuestions().filter(o=>!FILTER.topic || topicOf(o)===FILTER.topic);
    }
    function rememberTopic(name) {
      name=String(name||'').trim();
      if(!name) return;
      ALL.filter(o=>o.sk===FILTER.subject).forEach(o=>{
        if(topicOf(o)===name) return;
      });
      saveTopics();
    }

    async function load() {
      let config;
      try {
        const response=await fetch('tests.json');
        if(!response.ok) throw new Error('tests.json not found');
        config=await response.json();
      } catch(e) {
        $('main').innerHTML='<div class="card empty">tests.json नहीं मिली। इसे server/hosting से खोलें और tests.json उपलब्ध रखें।</div>';
        $('homeInfo').textContent='यह HTML प्रश्नों की JSON files से data लोड करता है।';
        return;
      }

      const files={};
      Object.keys(STRUCT).forEach(category=>{
        STRUCT[category].forEach(level=>{
          const papers=((config[category]||{})[level])||{};
          Object.keys(papers).forEach(paper=>{
            Object.keys(papers[paper]||{}).forEach(year=>{
              (papers[paper][year]||[]).forEach(test=>{
                if(test&&test.file&&!files[test.file]) files[test.file]={l:level};
              });
            });
          });
        });
      });

      const seen=new Set();
      for(const file of Object.keys(files)) {
        try {
          const response=await fetch(file);
          if(!response.ok) throw new Error('Question file not found');
          const data=await response.json();
          (data.sections||[]).forEach(section=>{
            const subject=normalizeSubject(section.name,section.nameHi,config);
            (section.questions||[]).forEach(q=>{
              const key=qKey(q);
              if(seen.has(key)) return;
              seen.add(key);
              ALL.push({
                key,q,sk:subject.key,sn:subject.name,snHi:subject.nameHi||subject.name,
                auto:autoTopic(subject.name,q),m:files[file]
              });
            });
          });
        } catch(e) {
          FAILED.push(file);
          console.warn('Question file लोड नहीं हुई:',file,e);
        }
      }

      buildSelectors();
      if(FAILED.length) {
        $('loadWarning').textContent=`${FAILED.length} question file(s) लोड नहीं हुईं। Console में file/error देखें।`;
      }
      drawHomeInfo();
      if(!ALL.length) $('main').innerHTML='<div class="card empty">अभी कोई question लोड नहीं हुआ। File paths और JSON format जाँचें।</div>';
      else $('main').innerHTML='';
    }

    function buildSelectors() {
      const levels=[...new Set(ALL.map(o=>o.m.l))].sort();
      const level=$('levelSelect');
      level.innerHTML='<option value="">All Levels</option>'+levels.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
      level.value=FILTER.level;
      level.onchange=()=>{
        FILTER.level=level.value;
        FILTER.subject='';
        FILTER.topic='';
        buildSubjectOptions();
        updateTopicOptions();
        drawHomeInfo();
      };
      buildSubjectOptions();
      updateTopicOptions();
    }

    function buildSubjectOptions() {
      const subjects=[...new Map(
        ALL.filter(o=>!FILTER.level||o.m.l===FILTER.level).map(o=>[o.sk,{key:o.sk,name:isHindi()?o.snHi:o.sn}])
      ).values()].sort((a,b)=>a.name.localeCompare(b.name));
      const select=$('subjectSelect');
      select.innerHTML='<option value="">All Subjects</option>'+subjects.map(s=>
        `<option value="${esc(s.key)}">${esc(s.name)}</option>`
      ).join('');
      if(!subjects.some(s=>s.key===FILTER.subject)) FILTER.subject='';
      select.value=FILTER.subject;
      select.onchange=()=>{
        FILTER.subject=select.value;
        FILTER.topic='';
        updateTopicOptions();
        drawHomeInfo();
      };
    }

    function updateTopicOptions() {
      const topics=getTopics();
      const select=$('topicSelect');
      select.innerHTML='<option value="">All Topics</option>'+topics.map(t=>
        `<option value="${esc(t)}">${esc(t)}</option>`
      ).join('');
      if(!topics.includes(FILTER.topic)) FILTER.topic='';
      select.value=FILTER.topic;
      select.onchange=()=>{
        FILTER.topic=select.value;
        drawHomeInfo();
      };
    }

    function drawHomeInfo() {
      const questions=getCurrentQuestions();
      const learning=questions.filter(o=>listOf(o)==='L'||listOf(o)==='X').length;
      const revision=questions.filter(o=>['R','X','G'].includes(listOf(o))).length;
      $('homeInfo').textContent=
        `${questions.length} प्रश्न • Learning के लिए ${learning} • Revision Test के लिए ${revision}`;
      $('learnBtn').disabled=!learning;
      $('testBtn').disabled=!revision;
    }

    function makeRecord(o) {
      return REC[o.key]=REC[o.key]||{a:0,c:0,w:0,l:'L'};
    }
    function answerLearning(o,correct) {
      const r=makeRecord(o);
      r.a++;
      if(correct) {
        r.c++; r.l='R'; r.learnedAt=Date.now(); delete r.lastRevisionAt;
      } else {
        r.w++;
        if(r.l==='G') r.l='X';
      }
      saveProgress();
    }
    function answerRevision(o,correct) {
      const r=makeRecord(o);
      r.a++;
      if(correct) { r.c++; r.l='G'; }
      else { r.w++; r.l='X'; }
      r.lastRevisionAt=Date.now();
    }

    function startLearn() {
      const pool=getCurrentQuestions().filter(o=>listOf(o)==='L'||listOf(o)==='X');
      if(!pool.length) return;
      SESSION={mode:'learn',queue:pool,answer:undefined,correct:false};
      showSession();
    }

    function startTest() {
      const pool=getCurrentQuestions().filter(o=>['R','X','G'].includes(listOf(o)));
      if(!pool.length) return;
      SESSION={mode:'test',items:shuffle(pool),index:0,selected:{}};
      showSession();
    }

    function shuffle(array) {
      const result=array.slice();
      for(let i=result.length-1;i>0;i--) {
        const j=Math.floor(Math.random()*(i+1));
        [result[i],result[j]]=[result[j],result[i]];
      }
      return result;
    }

    function showSession() {
      $('home').style.display='none';
      if(SESSION.mode==='learn') drawLearn();
      else if(SESSION.mode==='test') drawTest();
      else if(SESSION.mode==='result') drawResult();
    }
    function backHome() {
      SESSION=null;
      $('home').style.display='';
      buildSubjectOptions();
      updateTopicOptions();
      drawHomeInfo();
      $('main').innerHTML='';
    }

    function questionHTML(o,selected,locked) {
      const q=o.q,hi=isHindi();
      const options=(hi?q.optHi:q.optEn)||q.optEn||[];
      const image=hi?(q.imgHi||q.img):(q.imgEn||q.img);
      let html=`<div class="meta">
        <span>${esc(hi?o.snHi:o.sn)}</span>
        <span>${esc(topicOf(o))}</span>
        <span>❌ गलत: ${wrongCount(o)} बार</span>
      </div>
      <div class="question">${esc(hi?(q.qHi||q.qEn):q.qEn)}</div>
      ${image?`<img src="${esc(image)}" alt="">`:''}`;
      options.forEach((text,index)=>{
        let cls='option';
        if(locked) {
          cls+=' locked';
          if(index===Number(q.ans)) cls+=' correct';
          else if(index===selected) cls+=' wrong';
        } else if(index===selected) cls+=' selected';
        const optionImage=q.optImg&&q.optImg[index];
        html+=`<button class="${cls}" onclick="chooseAnswer(${index})">
          ${String.fromCharCode(65+index)}. ${esc(text)}
          ${optionImage?`<img src="${esc(optionImage)}" alt="">`:''}
          ${locked&&index===Number(q.ans)?' ✔':''}
        </button>`;
      });
      return html;
    }

    function chooseAnswer(index) {
      if(!SESSION) return;
      if(SESSION.mode==='learn') {
        if(SESSION.answer!==undefined) return;
        const o=SESSION.queue[0];
        SESSION.answer=index;
        SESSION.correct=index===Number(o.q.ans);
        answerLearning(o,SESSION.correct);
        drawLearn();
      } else if(SESSION.mode==='test') {
        SESSION.selected[SESSION.index]=index;
        drawTest();
      }
    }

    function topicEditor(o) {
      const topics=[...new Set(ALL.filter(x=>x.sk===o.sk).map(topicOf))].sort((a,b)=>a.localeCompare(b));
      const current=topicOf(o);
      if(!topics.includes(current)) topics.push(current);
      return `<details>
        <summary>✎ इस प्रश्न का Topic बदलें / नया Topic बनाएँ</summary>
        <div class="note">यह बदलाव सिर्फ़ इस प्रश्न पर लागू होगा।</div>
        <label class="note" for="topicPick">मौजूदा Topic</label>
        <select id="topicPick">${topics.map(t=>
          `<option value="${esc(t)}"${t===current?' selected':''}>${esc(t)}</option>`
        ).join('')}</select>
        <div class="note">या नया Topic नाम लिखें</div>
        <input id="newTopic" type="text" placeholder="नया Topic नाम">
        <div class="nav"><button class="btn gray" onclick="applyTopic('${esc(o.key)}')">Topic लागू करें</button></div>
      </details>`;
    }

    function applyTopic(key) {
      const o=ALL.find(x=>x.key===key);
      if(!o) return;
      const typed=($('newTopic').value||'').trim();
      const selected=$('topicPick').value;
      const target=typed||selected;
      if(!target) { alert('Topic चुनें या नया Topic नाम लिखें।'); return; }
      if(target===topicOf(o)) { alert('यह प्रश्न पहले से इसी Topic में है।'); return; }

      OV[key]=target;
      saveTopics();

      // जिस प्रश्न का Topic बदला, उसे इस Learning session से निकाल दें।
      if(SESSION&&SESSION.mode==='learn') {
        SESSION.queue=SESSION.queue.filter(x=>x.key!==key);
        SESSION.answer=undefined;
      }
      drawLearn();
    }

    function drawLearn() {
      if(!SESSION.queue.length) {
        $('main').innerHTML=`<div class="card empty">
          <h2>🎉 Learning पूरी!</h2>
          <button class="btn" onclick="backHome()">वापस</button>
        </div>`;
        return;
      }
      const o=SESSION.queue[0],q=o.q,hi=isHindi();
      const solution=(hi?q.solHi:q.solEn)||q.solEn||q.solHi||'';
      const answered=SESSION.answer!==undefined;
      $('main').innerHTML=`<div class="card">
        <div class="meta"><span>Learning • ${SESSION.queue.length} बाकी</span></div>
        ${questionHTML(o,SESSION.answer,answered)}
        ${answered?`<div class="solution">
          <b>${SESSION.correct?'✅ सही':'❌ गलत'}</b>
          ${SESSION.correct?'':'\nसही उत्तर: '+String.fromCharCode(65+Number(q.ans))}
          ${solution?'\n\n'+esc(solution):'\n\nSolution उपलब्ध नहीं है।'}
          \n\n${SESSION.correct?'यह प्रश्न Revision बाकी में गया।':'गलत प्रश्न इसी Learning में दोबारा आएगा।'}
        </div>`:''}
        ${topicEditor(o)}
        <div class="nav">
          <button class="btn gray" onclick="backHome()">✕ रोकें</button>
          ${answered?'<button class="btn" onclick="nextLearning()">Next →</button>':''}
        </div>
      </div>`;
    }

    function nextLearning() {
      const o=SESSION.queue.shift();
      // गलत प्रश्न इसी Learning सत्र में दोबारा आएगा।
      if(!SESSION.correct) SESSION.queue.push(o);
      SESSION.answer=undefined;
      drawLearn();
    }

    function drawTest() {
      const o=SESSION.items[SESSION.index],total=SESSION.items.length;
      const progress=Math.round((SESSION.index+1)/total*100);
      $('main').innerHTML=`<div class="card">
        <div class="progress"><i style="width:${progress}%"></i></div>
        <div class="meta"><span>Revision Test • प्रश्न ${SESSION.index+1}/${total}</span></div>
        ${questionHTML(o,SESSION.selected[SESSION.index],false)}
        <div class="nav">
          <button class="btn gray" ${SESSION.index===0?'disabled':''} onclick="testMove(-1)">← Previous</button>
          ${SESSION.index<total-1
            ?'<button class="btn" onclick="testMove(1)">Next →</button>'
            :'<button class="btn green" onclick="submitTest()">Submit</button>'}
        </div>
        <div class="nav"><button class="btn gray" onclick="if(confirm('Test छोड़ें? Progress सेव नहीं होगी।'))backHome()">✕ छोड़ें</button></div>
      </div>`;
    }

    function testMove(delta) {
      SESSION.index=Math.max(0,Math.min(SESSION.items.length-1,SESSION.index+delta));
      drawTest();
    }

    function submitTest() {
      const unanswered=SESSION.items.filter((o,i)=>SESSION.selected[i]===undefined).length;
      if(unanswered&&!confirm(`${unanswered} प्रश्न बिना उत्तर के हैं; उन्हें गलत गिना जाएगा। Submit करें?`)) return;

      let correct=0;
      const wrong=[];
      SESSION.items.forEach((o,i)=>{
        const isCorrect=SESSION.selected[i]===Number(o.q.ans);
        answerRevision(o,isCorrect);
        if(isCorrect) correct++;
        else wrong.push({o,index:i});
      });
      saveProgress();
      SESSION={mode:'result',total:SESSION.items.length,correct,wrong,selected:SESSION.selected};
      showSession();
    }

    function drawResult() {
      const hi=isHindi();
      $('main').innerHTML=`<div class="card empty">
        <h2>${SESSION.total} में से ${SESSION.correct} सही</h2>
        🟢 ${SESSION.correct} सही • 🔴 ${SESSION.wrong.length} गलत
        <div class="nav"><button class="btn" onclick="backHome()">वापस</button></div>
      </div>`+SESSION.wrong.map(item=>{
        const q=item.o.q,opts=(hi?q.optHi:q.optEn)||q.optEn||[];
        const selected=SESSION.selected[item.index];
        const solution=(hi?q.solHi:q.solEn)||q.solEn||'';
        return `<div class="card">
          <div class="meta"><span>🔴 गलत</span><span>इस प्रश्न के कुल गलत जवाब: ${wrongCount(item.o)}</span></div>
          <div class="question">${esc(hi?(q.qHi||q.qEn):q.qEn)}</div>
          <div class="note">आपका जवाब: ${selected===undefined?'—':esc(opts[selected])}</div>
          <div class="option correct locked">सही जवाब: ${esc(opts[Number(q.ans)]||'')}</div>
          ${solution?`<div class="solution">${esc(solution)}</div>`:''}
        </div>`;
      }).join('');
    }

    // मौजूदा चुने हुए Level/Subject/Topic के प्रश्नों की progress साफ़ करें।
    function resetProgress() {
      const questions=getCurrentQuestions();
      if(!questions.length) return;
      if(!confirm(`${questions.length} प्रश्नों की Learning/Revision progress और गलत जवाबों की गिनती मिटाएँ?`)) return;
      questions.forEach(o=>delete REC[o.key]);
      saveProgress();
      backHome();
    }

    load().catch(error=>{
      console.error(error);
      $('main').innerHTML='<div class="card empty">प्रश्न लोड नहीं हो पाए। पेज और JSON files जाँचें।</div>';
    });
  </script>
</body>
</html>

<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let ALL=[],OV={};
try{OV=JSON.parse(localStorage.getItem('examTopics'))||{}}catch(e){}
function hashStr(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return String(h)}
const qKey=q=>q.qid?String(q.qid):'h'+hashStr(q.qEn||'');
// ---- Topic auto-detection ----
const R={
rea:[[/series|come in place|श्रृंखला/,'Series'],[/related to|odd one|does not belong|संबंधित|अलग/,'Analogy & Classification'],[/coded|code|कूट/,'Coding-Decoding'],[/father|mother|brother|sister|\bson\b|daughter|uncle|aunt|पिता|माता|भाई|बहन/,'Blood Relations'],[/north|south|east|west|direction|दिशा/,'Direction'],[/rank|\brow\b|tallest|taller|heavier|पंक्ति/,'Ranking & Order'],[/venn|conclusion|statement|कथन|निष्कर्ष/,'Statements & Syllogism'],[/mirror|water image|folded|cube|dice|figure|दर्पण|पासा/,'Figure & Non-verbal'],[/calendar|clock|day of the week|घड़ी/,'Calendar & Clock'],[/symbol|interchang|operation|चिह्न/,'Mathematical Operations']],
math:[[/percent|%|प्रतिशत/,'Percentage'],[/profit|loss|discount|लाभ|हानि|छूट/,'Profit, Loss & Discount'],[/simple interest|compound|interest|ब्याज/,'Interest'],[/ratio|proportion|अनुपात/,'Ratio & Proportion'],[/average|mean|औसत/,'Average'],[/work|pipe|tank|काम|नल/,'Time & Work'],[/speed|train|km\/h|distance|चाल|ट्रेन/,'Time, Speed & Distance'],[/triangle|circle|area|perimeter|volume|radius|क्षेत्रफल|त्रिभुज|वृत्त/,'Geometry & Mensuration'],[/sin|cos|tan|trigonometr/,'Trigonometry'],[/divisible|hcf|lcm|prime|remainder|लघुत्तम|महत्तम|भाज्य/,'Number System'],[/simplif|value of|सरल/,'Simplification'],[/x\s*[+-]|equation|समीकरण/,'Algebra']],
eng:[[/passage|comprehension/,'Comprehension'],[/error|incorrect|grammatically/,'Error Spotting'],[/fill in the blank|blank/,'Fill in the Blanks'],[/synonym|similar in meaning/,'Synonyms'],[/antonym|opposite/,'Antonyms'],[/idiom|phrase/,'Idioms & Phrases'],[/one word|substitut/,'One Word Substitution'],[/spelt|spelling/,'Spelling'],[/passive|active voice|narration|direct|indirect/,'Voice & Narration'],[/rearrange|jumbled|sentence/,'Sentence Arrangement']],
hin:[[/संधि/,'संधि'],[/समास/,'समास'],[/पर्यायवाची|समानार्थी/,'पर्यायवाची'],[/विलोम|विपरीतार्थक/,'विलोम'],[/मुहावरा|मुहावरे|लोकोक्ति/,'मुहावरे व लोकोक्तियाँ'],[/शुद्ध|अशुद्ध|वर्तनी/,'शब्द शुद्धि'],[/एक शब्द|के लिए.*शब्द/,'एक शब्द'],[/अलंकार/,'अलंकार'],[/कारक|विभक्ति/,'कारक'],[/गद्यांश|अनुच्छेद/,'गद्यांश']],
gk:[[/emperor|dynasty|battle|mughal|revolt|ancient|medieval|freedom|वंश|युद्ध|मुगल|आंदोलन/,'History'],[/river|mountain|plateau|climate|soil|national park|नदी|पर्वत|पठार/,'Geography'],[/constitution|article|president|parliament|amendment|संविधान|अनुच्छेद|राष्ट्रपति|संसद/,'Polity'],[/gdp|bank|tax|budget|inflation|rbi|economy|बैंक|बजट|अर्थ/,'Economy'],[/physics|chemistry|biology|vitamin|acid|cell|gas|element|विटामिन|अम्ल|कोशिका|तत्व/,'Science'],[/award|prize|trophy|olympic|cup|खेल|पुरस्कार|ओलंपिक/,'Awards & Sports'],[/author|book|wrote|written by|लेखक|पुस्तक|रचना/,'Books & Authors'],[/dance|festival|temple|folk|नृत्य|मंदिर|त्योहार/,'Art & Culture']]};
function kind(n){n=n.toLowerCase();return/reasoning|intelligence/.test(n)?'rea':/arith|numer|quant|math/.test(n)?'math':/english/.test(n)?'eng':/hindi/.test(n)?'hin':/awareness|knowledge|gk|current/.test(n)?'gk':''}
function autoTopic(sn,q){const r=R[kind(sn)]||[],t=((q.qEn||'')+' '+(q.qHi||'')).toLowerCase();for(const[x,n]of r)if(x.test(t))return n;return 'अन्य / Other'}
const topicOf=o=>OV[o.key]||o.q.topic||o.auto;

const stripN=n=>String(n||'').replace(/\s*[-–:]?\s*[\(\[]?\s*(part\vert{}set\vert{}भाग)?\s*\d+\s*[\)\]]?\s*$/i,'').trim();
function normSubj(name,nameHi,CFG){
  const al={};Object.keys((CFG&&CFG.subjectAliases)||{}).forEach(k=>al[stripN(k).toLowerCase()]=CFG.subjectAliases[k]);
  let n=stripN(name)||String(name||'').trim();const a=al[n.toLowerCase()];if(a)n=a;
  return {name:n,nameHi:stripN(nameHi)||nameHi,key:n.toLowerCase()};
}

// ---- डाइनेमिक load फंक्शन (अब tests.json के स्ट्रक्चर पर फेल नहीं होगा) ----
async function load(){
  let C;try{C=await(await fetch('tests.json')).json()}catch(e){$('main').innerHTML='<div class="card empty">tests.json नहीं मिली। Server/hosting से खोलें।</div>';return}
  const files={};
  
  // tests.json के अंदर रिकर्सिव रूप से सभी फाइल ऑब्जेक्ट ढूंढना
  function scan(obj){
    if(!obj||typeof obj!=='object')return;
    if(Array.isArray(obj)){
      obj.forEach(t=>{if(t&&t.file)files[t.file]={l:t.level||'General',t:t.title||t.file}});
      return;
    }
    Object.values(obj).forEach(v=>scan(v));
  }
  scan(C);

  const seen=new Set();
  for(const f of Object.keys(files)){
    let d;try{d=await(await fetch(f)).json()}catch(e){continue}
    (d.sections||[]).forEach(s=>(s.questions||[]).forEach(q=>{
      const key=qKey(q);if(seen.has(key))return;seen.add(key);
      const ns=normSubj(s.name,s.nameHi,C);
      ALL.push({key,q,sn:ns.name,snHi:ns.nameHi||ns.name,sk:ns.key,auto:autoTopic(ns.name,q),m:files[f]});
    }));
  }
  const sk=[...new Set(ALL.map(o=>o.sk))];
  if(!sk.length){$('main').innerHTML='<div class="card" style="text-align:center">tests.json से कोई प्रश्न फाइलें नहीं मिल पाईं।</div>';return;}
  F.subj=sk[0]||'';draw();
}

// ================= Learning ⇄ Revision =================
const LS='examLearning2';
let REC={},SS=null;
try{REC=JSON.parse(localStorage.getItem(LS))||{}}catch(e){}
try{localStorage.removeItem('examLearning');localStorage.removeItem('examLearningMeta')}catch(e){}
const saveR=()=>{try{localStorage.setItem(LS,JSON.stringify(REC))}catch(e){}};
let F={l:'',lang:'en',subj:'',top:'',view:'home',list:''};
let UI={src:{L:1,X:0,G:0},kw:'',ln:'20',rsrc:{R:1,X:1,G:1},days:'0',rn:'20'};
const hi=()=>F.lang==='hi';
const DAY=864e5,NM={L:'📘 Learning',R:'📝 Revision बाकी',X:'🔴 लाल',G:'🟢 हरी'};
const listOf=o=>(REC[o.key]&&REC[o.key].l)||'L';
const refT=o=>{const r=REC[o.key];return r?(r.lastRevisionAt||r.learnedAt||0):0};
const ageD=o=>{const t=refT(o);return t?(Date.now()-t)/DAY:0};
const never=o=>{const r=REC[o.key];return !!r&&!r.lastRevisionAt};
const itemsOf=(sk,t)=>ALL.filter(o=>(!F.l||o.m.l===F.l)&&o.sk===sk&&topicOf(o)===t);
const cur=()=>itemsOf(F.subj,F.top);
function cnt(list){const c={L:0,R:0,X:0,G:0,t:list.length};list.forEach(o=>c[listOf(o)]++);return c}
const p2=n=>String(n).padStart(2,'0');
function fmtT(ts){const d=new Date(ts);let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;return `${p2(d.getDate())}-${p2(d.getMonth()+1)}-${d.getFullYear()} ${p2(h)}:${p2(d.getMinutes())} ${ap}`}
function ago(ts){const m=(Date.now()-ts)/6e4;if(m<60)return 'अभी अभी';if(m<1440)return Math.floor(m/60)+' घंटे पहले';return Math.floor(m/1440)+' दिन पहले'}
function lastRev(list){let t=0;list.forEach(o=>{const r=REC[o.key];if(r&&r.lastRevisionAt&&r.lastRevisionAt>t)t=r.lastRevisionAt});return t}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const mk=o=>REC[o.key]=REC[o.key]||{a:0,c:0,w:0,l:'L'};
function learnAns(o,ok){const r=mk(o);r.a++;
  if(ok){r.c++;r.l='R';r.learnedAt=Date.now();delete r.lastRevisionAt}
  else{r.w++;if(r.l==='G')r.l='X'}
  saveR()}
function revAns(o,ok){const r=mk(o);r.a++;if(ok){r.c++;r.l='G'}else{r.w++;r.l='X'}r.lastRevisionAt=Date.now()}

function setF(k,v){F[k]=v;if(k==='subj')F.top='';F.view='home';SS=null;draw()}
function openT(t){F.top=t;F.view='dash';SS=null;draw()}
function toTopics(){F.top='';F.view='home';SS=null;draw()}
function back(){F.view=F.top?'dash':'home';SS=null;draw()}
function ctl(){
  const lv=[...new Set(ALL.map(o=>o.m.l))];
  $('ctl').innerHTML=`<select onchange="setF('l',this.value)" style="flex:1"><option value="">All Levels</option>${lv.map(l=>`<option${l===F.l?' selected':''}>${esc(l)}</option>`).join('')}</select>
  <select onchange="F.lang=this.value;draw()" style="flex:1"><option value="en"${F.lang==='en'?' selected':''}>English</option><option value="hi"${F.lang==='hi'?' selected':''}>हिंदी</option></select>`;
}
const isFull=c=>c.t>0&&c.G===c.t;

// --- Combined Tiles

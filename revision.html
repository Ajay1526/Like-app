<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="stylesheet" href="app.css?v=5">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

<style>
:root{--bl:#7c3aed;--bl2:#ede9fe;--gr:#10b981;--gr2:#ecfdf5;--rd:#ef4444;--rd2:#fef2f2;--am2:#fefce8;--ln:#e2e8f0;--tx:#1e293b;--mt:#64748b}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(180deg,#ddd6fe 0%,#e0f2fe 45%,#fef9c3 100%)!important;color:var(--tx);min-height:100vh}
.top{background:linear-gradient(135deg,#7c3aed,#db2777,#f59e0b)!important;color:#fff!important;padding:14px 16px!important;font-size:19px!important;font-weight:900!important;box-shadow:0 10px 25px rgba(124,58,237,.35);position:sticky;top:0;z-index:100;border-radius:0 0 18px 18px}
.wrap{max-width:780px;margin:auto;padding:10px}
.card{background:#fff;border-radius:16px!important;box-shadow:0 6px 18px rgba(0,0,0,.06)!important;border:1px solid var(--ln)}
.card.hdr{padding:14px!important;background:rgba(255,255,255,.95)!important}
select,input[type=search],input[type=number]{border:1.5px solid #ddd6fe!important;border-radius:12px!important;padding:9px 10px!important;background:#f8fafc!important;font-weight:600!important;font-size:13px!important;outline:none}
select:focus,input:focus{border-color:#7c3aed!important;background:#fff!important}
.subsel{border:2px solid #7c3aed!important;background:linear-gradient(135deg,#ede9fe,#fff)!important;color:#4c1d95!important;font-weight:800!important;font-size:14px!important}
.btn{background:linear-gradient(135deg,#7c3aed,#6d28d9)!important;color:#fff!important;border:none!important;border-radius:25px!important;padding:9px 16px!important;font-weight:800!important;box-shadow:0 4px 12px rgba(124,58,237,.25);cursor:pointer}
.btn:active{transform:scale(.94)}.btn.g{background:linear-gradient(135deg,#10b981,#059669)!important}.btn.r{background:linear-gradient(135deg,#ef4444,#dc2626)!important}.btn.gray{background:#eef2ff!important;color:#334155!important;box-shadow:none!important;border:1px solid #e2e8f0!important}.btn.sm{padding:6px 14px!important;font-size:12px!important}
.qt{white-space:pre-wrap;line-height:1.65;font-size:16px;font-weight:600;margin:8px 0 10px}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:8px 0;border:1.5px solid var(--ln);border-radius:14px;background:#fff;color:var(--tx);font-size:15px;line-height:1.45;cursor:pointer}
.opt:hover{border-color:#a78bfa;background:#f5f3ff}.opt.sel{border-color:var(--bl);background:var(--bl2)}.opt.ok{background:var(--gr2);border-color:var(--gr);color:#0d652d;font-weight:600}.opt.bad{background:var(--rd2);border-color:var(--rd);color:#a50e0e}.opt.lock{cursor:default}
.sol{background:#fefce8;border:1px solid #fde68a;border-radius:14px;padding:12px;margin-top:12px;white-space:pre-wrap;line-height:1.6}
.nav{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.nav .btn{flex:1;text-align:center}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.stats4 div{background:linear-gradient(180deg,#f5f3ff,#fff)!important;border:1px solid #ede9fe;border-radius:14px!important;padding:10px 2px;font-size:11px;color:var(--mt);cursor:pointer}.stats4 b{display:block;font-size:17px;color:var(--tx);font-weight:800}
.mvov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}.mvbox{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:420px;box-shadow:0 20px 40px rgba(0,0,0,.25)}.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 18px;border-radius:25px;font-size:13px;z-index:300;max-width:90%;font-weight:600}
.nbox{margin-top:10px}.nlbl{font-size:12px;color:#5f6368;margin-bottom:4px;font-weight:600}.nbox textarea{width:100%;min-height:72px;border:1.5px solid #e2e8f0;border-radius:12px;padding:10px;font-size:14px;font-family:inherit;background:#fff}
.blur{display:inline-block;background:#e5e7eb;color:transparent;text-shadow:0 0 7px rgba(0,0,0,.55);padding:8px 14px;border-radius:12px;cursor:pointer;font-weight:700}.blur.rev{background:#ecfdf5;color:#047857;text-shadow:none;border:1px solid #a7f3d0}.evrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.sm{padding:5px 12px!important;font-size:12px!important}
.ncard{background:#fff;border:1px solid var(--ln);border-left:6px solid var(--bl);padding:14px;margin-bottom:14px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.05);animation:slideIn .35s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ctitle{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;color:#1e3a8a;font-size:14px;margin-bottom:4px}.ctitle label{display:flex;align-items:center;gap:8px;cursor:pointer;flex:1}.ctitle input{width:18px;height:18px;accent-color:#7c3aed}
.tmeta{font-size:11px;color:var(--mt);margin-bottom:6px;background:#f1f5f9;padding:4px 10px;border-radius:20px;display:inline-block;font-weight:600}
.crow{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.crow input[type=search]{flex:1;min-width:130px}.crow input[type=number]{width:92px}
.bulk{display:flex;justify-content:space-between;align-items:center;background:#f1f5f9;padding:10px 12px;border-radius:12px;gap:8px;flex-wrap:wrap}.bulk input{width:16px;height:16px;accent-color:#7c3aed}
mark{background:#fef08a;font-weight:bold;padding:0 2px;border-radius:3px}.hintx{font-size:12px;color:#7c3aed;text-align:center;margin:10px 0;font-weight:600;background:#fff;padding:8px;border-radius:20px}

.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.lbl{font-size:12px;color:var(--mt);margin:8px 2px 4px;font-weight:700}
.card{padding:14px;margin-bottom:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--mt);margin-bottom:6px}.meta span{background:#f1f5f9;border-radius:20px;padding:3px 10px;font-weight:600}
.pb{height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:7px 0}.pb i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#06b6d4,#7c3aed);border-radius:20px}
.stats4.s5{grid-template-columns:repeat(5,1fr);gap:6px}.stats4.s5 div{padding:8px 1px;font-size:10px}.stats4.s5 b{font-size:16px}
.tc{cursor:pointer;border-left:6px solid var(--bl)!important;animation:slideIn .35s ease}.tc .r{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;color:#1e3a8a}
.full{background:var(--gr2);color:#0d652d;border-radius:14px;padding:10px;text-align:center;font-weight:700;margin-top:10px}
.note{font-size:11px;color:var(--mt);margin-top:8px}.big{text-align:center;padding:22px 12px}.big b{font-size:24px;display:block;margin:8px 0}
.qimg,.oimg{max-width:100%;height:auto;display:block;margin:6px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}.row input{width:17px;height:17px;accent-color:#7c3aed}
.btn.off{opacity:.45;pointer-events:none}
.fc{border-radius:20px;font-weight:700}.fc.on{background:var(--bl2);border-color:var(--bl);color:#4c1d95}
</style></head><body>
<div class="top"><b>📚 Revision</b></div>
<div class="wrap">
  <div class="card hdr" id="hdr">
    <select class="subsel" id="subSel" onchange="onSubj(this.value)" style="width:100%;margin-bottom:8px"></select>
    <select id="topSel" onchange="onTopic(this.value)" style="width:100%;margin-bottom:8px"></select>
    <div class="bar"><select id="lvlSel" onchange="onLevel(this.value)" style="flex:1"></select><select id="langSel" onchange="onLang(this.value)" style="flex:1"><option value="en">English</option><option value="hi">हिंदी</option></select></div>
    <div class="stats4 st4" id="hdrStats"></div>
    <div class="crow"><input type="search" id="kw" oninput="UI.show=40;renderCards()"><select id="stSel" onchange="UI.show=40;renderCards()" style="flex:1;margin:0;min-width:120px"><option value="all" id="optAll"></option><option value="correct" id="optCorrect"></option><option value="wrong" id="optWrong"></option><option value="pending" id="optPending"></option></select><input type="number" id="dayIn" min="0" oninput="UI.show=40;renderCards()"></div>
    <div class="bulk"><label><input type="checkbox" id="selAll" onchange="toggleAll(this.checked)"><b id="lblSel"></b></label><div><button class="btn sm" id="btnMove" onclick="openMove()"></button> <button class="btn r sm" id="btnReset" onclick="confirmReset()"></button></div></div>
  </div>
  <div id="main"><div class="card" style="text-align:center">Loading questions…</div></div>
  <div class="hintx" id="hintTxt"></div>
</div>
<script src="nav.js?v=5"></script>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const STRUCT={teaching:['NTT','PRT','TGT','PGT'],nonTeaching:['10th','12th','Graduation Level']};
let ALL=[],OV={};
try{OV=JSON.parse(localStorage.getItem('examTopics'))||{}}catch(e){}
function hashStr(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return String(h)}
const qKey=q=>q.qid?String(q.qid):'h'+hashStr(q.qEn||'');
// ---- Topic auto-detection (optional "topic" field in JSON wins; user can also change any topic) ----
const R={
rea:[[/series|come in place|श्रृंखला/,'Series'],[/related to|odd one|does not belong|संबंधित|अलग/,'Analogy & Classification'],[/coded|code|कूट/,'Coding-Decoding'],[/father|mother|brother|sister|\bson\b|daughter|uncle|aunt|पिता|माता|भाई|बहन/,'Blood Relations'],[/north|south|east|west|direction|दिशा/,'Direction'],[/rank|\brow\b|tallest|taller|heavier|पंक्ति/,'Ranking & Order'],[/venn|conclusion|statement|कथन|निष्कर्ष/,'Statements & Syllogism'],[/mirror|water image|folded|cube|dice|figure|दर्पण|पासा/,'Figure & Non-verbal'],[/calendar|clock|day of the week|घड़ी/,'Calendar & Clock'],[/symbol|interchang|operation|चिह्न/,'Mathematical Operations']],
math:[[/percent|%|प्रतिशत/,'Percentage'],[/profit|loss|discount|लाभ|हानि|छूट/,'Profit, Loss & Discount'],[/simple interest|compound|interest|ब्याज/,'Interest'],[/ratio|proportion|अनुपात/,'Ratio & Proportion'],[/average|mean|औसत/,'Average'],[/work|pipe|tank|काम|नल/,'Time & Work'],[/speed|train|km\/h|distance|चाल|ट्रेन/,'Time, Speed & Distance'],[/triangle|circle|area|perimeter|volume|radius|क्षेत्रफल|त्रिभुज|वृत्त/,'Geometry & Mensuration'],[/sin|cos|tan|trigonometr/,'Trigonometry'],[/divisible|hcf|lcm|prime|remainder|लघुत्तम|महत्तम|भाज्य/,'Number System'],[/simplif|value of|सरल/,'Simplification'],[/x\s*[+-]|equation|समीकरण/,'Algebra']],
eng:[[/passage|comprehension/,'Comprehension'],[/error|incorrect|grammatically/,'Error Spotting'],[/fill in the blank|blank/,'Fill in the Blanks'],[/synonym|similar in meaning/,'Synonyms'],[/antonym|opposite/,'Antonyms'],[/idiom|phrase/,'Idioms & Phrases'],[/one word|substitut/,'One Word Substitution'],[/spelt|spelling/,'Spelling'],[/passive|active voice|narration|direct|indirect/,'Voice & Narration'],[/rearrange|jumbled|sentence/,'Sentence Arrangement']],
hin:[[/संधि/,'संधि'],[/समास/,'समास'],[/पर्यायवाची|समानार्थी/,'पर्यायवाची'],[/विलोम|विपरीतार्थक/,'विलोम'],[/मुहावरा|मुहावरे|लोकोक्ति/,'मुहावरे व लोकोक्तियाँ'],[/शुद्ध|अशुद्ध|वर्तनी/,'शब्द शुद्धि'],[/एक शब्द|के लिए.*शब्द/,'एक शब्द'],[/अलंकार/,'अलंकार'],[/कारक|विभक्ति/,'कारक'],[/गद्यांश|अनुच्छेद/,'गद्यांश']],
gk:[[/emperor|dynasty|battle|mughal|revolt|ancient|medieval|freedom|वंश|युद्ध|मुगल|आंदोलन/,'History'],[/river|mountain|plateau|climate|soil|national park|नदी|पर्वत|पठार/,'Geography'],[/constitution|article|president|parliament|amendment|संविधान|अनुच्छेद|राष्ट्रपति|संसद/,'Polity'],[/gdp|bank|tax|budget|inflation|rbi|economy|बैंक|बजट|अर्थ/,'Economy'],[/physics|chemistry|biology|vitamin|acid|cell|gas|element|विटामिन|अम्ल|कोशिका|तत्व/,'Science'],[/award|prize|trophy|olympic|cup|खेल|पुरस्कार|ओलंपिक/,'Awards & Sports'],[/author|book|wrote|written by|लेखक|पुस्तक|रचना/,'Books & Authors'],[/dance|festival|temple|folk|नृत्य|मंदिर|त्योहार/,'Art & Culture']]};
function kind(n){n=n.toLowerCase();return/reasoning|intelligence/.test(n)?'rea':/arith|numer|quant|math/.test(n)?'math':/english/.test(n)?'eng':/hindi/.test(n)?'hin':/awareness|knowledge|gk|current/.test(n)?'gk':''}
function autoTopic(sn,q){const r=R[kind(sn)]||[],t=((q.qEn||'')+' '+(q.qHi||'')).toLowerCase();for(const[x,n]of r)if(x.test(t))return n;return 'अन्य / Other'}
const topicOf=o=>OV[o.key]||o.q.topic||o.auto;

const stripN=n=>String(n||'').replace(/\s*[-–:]?\s*[\(\[]?\s*(part|set|भाग)?\s*\d+\s*[\)\]]?\s*$/i,'').trim();
function normSubj(name,nameHi,CFG){
  const al={};Object.keys((CFG&&CFG.subjectAliases)||{}).forEach(k=>al[stripN(k).toLowerCase()]=CFG.subjectAliases[k]);
  let n=stripN(name)||String(name||'').trim();const a=al[n.toLowerCase()];if(a)n=a;
  return {name:n,nameHi:stripN(nameHi)||nameHi,key:n.toLowerCase()};
}
async function load(){
  let C;try{C=await(await fetch('tests.json')).json()}catch(e){$('main').innerHTML='<div class="card empty">tests.json नहीं मिली। Server/hosting से खोलें।</div>';return}
  const files={};
  Object.keys(STRUCT).forEach(c=>STRUCT[c].forEach(l=>{const n=((C[c]||{})[l])||{};
    Object.keys(n).forEach(p=>Object.keys(n[p]||{}).forEach(y=>(n[p][y]||[]).forEach(t=>{if(!files[t.file])files[t.file]={c,l,p,y,t:t.title}})))}));
  // ✅ FIX: एक ही फ़ाइल का कोई प्रश्न अब कभी नहीं छूटता (हर section के सारे प्रश्न गिने जाते हैं)।
  // Duplicate तभी हटता है जब वही प्रश्न + वही options किसी दूसरी फ़ाइल में दोबारा आए।
  const seen=new Set(),fpFile={};
  for(const f of Object.keys(files)){
    let d;try{d=await(await fetch(f)).json()}catch(e){continue}
    (d.sections||[]).forEach(s=>(s.questions||[]).forEach(q=>{
      let key=qKey(q);
      const fp=key+'|'+(q.optEn||[]).join('~')+'|'+(q.optHi||[]).join('~');
      if(fpFile[fp]&&fpFile[fp]!==f)return;
      fpFile[fp]=f;
      if(seen.has(key)){let n=2;while(seen.has(key+'_'+n))n++;key=key+'_'+n}
      seen.add(key);
      const ns=normSubj(s.name,s.nameHi,C);
      ALL.push({key,q,sn:ns.name,snHi:ns.nameHi||ns.name,sk:ns.key,auto:autoTopic(ns.name,q),m:files[f]});
    }));
  }
  const sk=[...new Set(ALL.map(o=>o.sk))];F.subj=sk[0]||'';draw();
}

// ================= Revision (original logic: L / R / X / G) =================
// L = Learning (नया), R = Revision बाकी, X = 🔴 गलत, G = 🟢 सही.  Correct=G, Wrong=X, Pending=L+R
const LS='examLearning2';
let REC={},SS=null,SEL={},VIS=[],UI={show:40};
try{REC=JSON.parse(localStorage.getItem(LS))||{}}catch(e){}
try{localStorage.removeItem('examLearning');localStorage.removeItem('examLearningMeta')}catch(e){}
const saveR=()=>{try{localStorage.setItem(LS,JSON.stringify(REC))}catch(e){}};
let F={l:'',lang:'en',subj:'',top:'',view:'list'};
const hi=()=>F.lang==='hi',T=(h,e)=>hi()?h:e,DAY=864e5;
const NM={L:'📘 Learning',R:'📝 Revision बाकी',X:'🔴 लाल',G:'🟢 हरी'};
const listOf=o=>(REC[o.key]&&REC[o.key].l)||'L';
const stOf=o=>{const l=listOf(o);return l==='G'?'correct':l==='X'?'wrong':'pending'};
const refT=o=>{const r=REC[o.key];return r?(r.lastRevisionAt||r.learnedAt||0):0};
const ageD=o=>{const t=refT(o);return t?(Date.now()-t)/DAY:0};
const mk=o=>REC[o.key]=REC[o.key]||{a:0,c:0,w:0,l:'L'};
const cur=()=>ALL.filter(o=>(!F.l||o.m.l===F.l)&&o.sk===F.subj&&(!F.top||topicOf(o)===F.top));
function cnt(list){const c={L:0,R:0,X:0,G:0,t:list.length};list.forEach(o=>c[listOf(o)]++);return c}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function formatAgo(ts){if(!ts)return T('कभी नहीं','Never');const m=Math.floor((Date.now()-ts)/6e4),h=Math.floor(m/60),d=Math.floor(h/24);if(hi()){if(m<2)return 'अभी-अभी';if(m<60)return m+' मिनट पहले';if(h<24)return h+' घंटे पहले';return d+' दिन पहले'}if(m<2)return 'Just now';if(m<60)return m+'m ago';if(h<24)return h+'h ago';return d+(d===1?' day ago':' days ago')}
function hl(text,kw){const t=esc(text);if(!kw)return t;const k=esc(kw).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{return t.replace(new RegExp('('+k+')','gi'),'<mark>$1</mark>')}catch(e){return t}}
function toast(t){const o=$('toastB');if(o)o.remove();const d=document.createElement('div');d.id='toastB';d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>{const x=$('toastB');if(x)x.remove()},2500)}
function subjMap(){const sm={};ALL.filter(o=>!F.l||o.m.l===F.l).forEach(o=>{(sm[o.sk]=sm[o.sk]||{n:hi()?o.snHi:o.sn,l:[]}).l.push(o)});if(!sm[F.subj])F.subj=Object.keys(sm)[0]||'';return sm}
function fillSel(){
  const sm=subjMap(),cl=sm[F.subj]?sm[F.subj].l:[],tc={};cl.forEach(o=>{const t=topicOf(o);tc[t]=(tc[t]||0)+1});
  $('subSel').innerHTML=Object.keys(sm).map(k=>`<option value="${esc(k)}"${k===F.subj?' selected':''}>📂 ${esc(sm[k].n)} (${sm[k].l.length})</option>`).join('');
  if(F.top&&!tc[F.top])F.top='';
  $('topSel').innerHTML=`<option value="">${T(`📌 सभी टॉपिक (${cl.length})`,`📌 All Topics (${cl.length})`)}</option>`+Object.keys(tc).sort().map(t=>`<option value="${esc(t)}"${t===F.top?' selected':''}>📌 ${esc(t)} (${tc[t]})</option>`).join('');
  const lv=[...new Set(ALL.map(o=>o.m.l))];
  $('lvlSel').innerHTML=`<option value="">All Levels</option>`+lv.map(l=>`<option${l===F.l?' selected':''}>${esc(l)}</option>`).join('');
  $('langSel').value=F.lang;
}
function onSubj(v){F.subj=v;F.top='';SEL={};UI.show=40;$('selAll').checked=false;renderCards()}
function onTopic(v){F.top=v;SEL={};UI.show=40;$('selAll').checked=false;renderCards()}
function onLevel(v){F.l=v;F.top='';SEL={};UI.show=40;renderCards()}
function onLang(v){F.lang=v;renderCards()}
function setTexts(){
  const set=(id,h,e)=>{const x=$(id);if(x)x.textContent=T(h,e)};
  set('optAll','📁 सभी स्टेटस','📁 All Status');set('optCorrect','🟢 केवल सही','🟢 Correct Only');set('optWrong','🔴 केवल गलत','🔴 Wrong Only');set('optPending','⏳ केवल शेष','⏳ Pending Only');
  set('lblSel','सभी चुनें','Select All');set('btnMove','🔀 मूव','🔀 Move');set('btnReset','🔄 रीसेट','🔄 Reset');
  $('kw').placeholder=T('🔍 खोजें...','🔍 Search...');$('dayIn').placeholder=T('दिन (>=)','Days (>=)');
  set('hintTxt','💡 टिप: मूव करने पर प्रश्न उसी सब्जेक्ट के दूसरे टॉपिक में ट्रांसफर हो जाएगा!','💡 Tip: Moving questions transfers them to another topic of the same subject!');
}
function imgOf(q){return hi()?(q.imgHi||q.img):(q.imgEn||q.img)}
function mcqBody(o,kw){
  const q=o.q,r=REC[o.key]||{},locked=stOf(o)!=='pending',opts=(hi()?q.optHi:q.optEn)||q.optEn||[],im=imgOf(q),sol=(hi()?q.solHi:q.solEn)||q.solEn||q.solHi||'';
  const ob=opts.map((t,k)=>{let c='opt';if(locked){c+=' lock';if(k===q.ans)c+=' ok';else if(r.sel===k)c+=' bad'}const oi=q.optImg&&q.optImg[k];
    return `<button class="${c}" data-k="${esc(o.key)}" onclick="pickOpt(this.dataset.k,${k})">${String.fromCharCode(65+k)}. ${hl(t,kw)}${oi?`<img class="oimg" src="${esc(oi)}" alt="">`:''}${locked&&k===q.ans?' ✔':''}</button>`}).join('');
  return `<div class="qt">${hl(hi()?(q.qHi||q.qEn):q.qEn,kw)}</div>${im?`<img class="qimg" src="${esc(im)}" alt="">`:''}<div>${ob}</div>`+(locked?`<div class="sol"><b>${T('स्पष्टीकरण (Solution):','Solution:')}</b><br>${sol?hl(sol,kw):T('Solution उपलब्ध नहीं है।','No solution available.')}</div>`:'');
}
function cardHTML(o,idx,kw){
  const r=REC[o.key]||{},k=esc(o.key),last=refT(o);
  const tm=r.firstAt||last?T(`⏱️ पहली बार हल: ${formatAgo(r.firstAt||last)} | आखिरी बार: ${formatAgo(last)}`,`⏱️ First attempt: ${formatAgo(r.firstAt||last)} | Last: ${formatAgo(last)}`):T('⏳ अभी तक नहीं पढ़ा गया (Pending)','⏳ Pending');
  const bc=stOf(o)==='correct'?'#10b981':stOf(o)==='wrong'?'#ef4444':'#7c3aed';
  return `<div class="ncard" style="border-left-color:${bc}"><div class="ctitle"><label><input type="checkbox" data-k="${k}" ${SEL[o.key]?'checked':''} onchange="toggleOne(this.dataset.k,this.checked)"><span>${idx+1}. ${esc(topicOf(o))}</span></label><button class="btn gray sm" data-k="${k}" onclick="moveOne(this.dataset.k)">${T('🔀 मूव','🔀 Move')}</button></div><div class="tmeta">${tm}</div>${mcqBody(o,kw)}</div>`;
}
function mathAll(el){if(typeof renderMathInElement==='function')try{renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}catch(e){}}
function renderCards(){
  const box=$('main');
  if(!ALL.length){$('hdr').style.display='none';box.innerHTML='<div class="card" style="text-align:center">अभी कोई test/question upload नहीं है।</div>';return}
  $('hdr').style.display='';fillSel();setTexts();
  const base=cur();let cor=0,wro=0,pen=0;base.forEach(o=>{const s=stOf(o);if(s==='correct')cor++;else if(s==='wrong')wro++;else pen++});
  $('hdrStats').innerHTML=`<div><b>${base.length}</b><span>${T('कुल प्रश्न','Total Qs')}</span></div><div><b>🟢 ${cor}</b><span>${T('सही','Correct')}</span></div><div><b>🔴 ${wro}</b><span>${T('गलत','Wrong')}</span></div><div><b>⏳ ${pen}</b><span>${T('शेष','Pending')}</span></div>`;
  const kw=($('kw').value||'').trim().toLowerCase(),sf=$('stSel').value,dv=parseFloat($('dayIn').value);
  VIS=base.filter(o=>{if(sf!=='all'&&stOf(o)!==sf)return false;if(!isNaN(dv)&&dv>=0){if(!refT(o)||ageD(o)<dv)return false}if(kw&&oText(o).toLowerCase().includes(kw)===false)return false;return true});
  if(!VIS.length)box.innerHTML=`<div class="ncard" style="text-align:center;color:var(--mt)">${T('इन मानदंडों के अनुसार कोई प्रश्न नहीं मिला।','No questions found matching criteria.')}</div>`;
  else box.innerHTML=VIS.slice(0,UI.show).map((o,i)=>cardHTML(o,i,kw)).join('')+(VIS.length>UI.show?`<div style="text-align:center"><button class="btn gray" onclick="UI.show+=40;renderCards()">${T('और दिखाएँ','Show more')} (${VIS.length-UI.show})</button></div>`:'');
  $('selAll').checked=VIS.length>0&&VIS.every(o=>SEL[o.key]);mathAll(box);
}
const oText=o=>(o.q.qEn||'')+' '+(o.q.qHi||'')+' '+(o.q.optEn||[]).join(' ')+' '+(o.q.optHi||[]).join(' ');
function pickOpt(key,k){
  const o=ALL.find(x=>x.key===key);if(!o||stOf(o)!=='pending')return;
  const ok=k===o.q.ans,r=mk(o),now=Date.now();r.a++;ok?r.c++:r.w++;r.l=ok?'G':'X';r.sel=k;r.firstAt=r.firstAt||now;r.lastRevisionAt=now;saveR();renderCards();
}
// ---- select / move / reset ----
function toggleOne(k,c){if(c)SEL[k]=true;else delete SEL[k];$('selAll').checked=VIS.length>0&&VIS.every(o=>SEL[o.key])}
function toggleAll(c){VIS.forEach(o=>{if(c)SEL[o.key]=true;else delete SEL[o.key]});renderCards()}
function moveOne(k){SEL={};SEL[k]=true;openMove()}
const selKeys=()=>Object.keys(SEL).filter(k=>SEL[k]);
function closeM(id){const m=$(id);if(m)m.remove()}
function openMove(){
  const keys=selKeys();if(!keys.length){alert(T('कृपया कम से कम एक प्रश्न चुनें!','Please select at least one question!'));return}
  const list=ALL.filter(o=>o.sk===F.subj&&(!F.l||o.m.l===F.l)),tc={};list.forEach(o=>{const t=topicOf(o);tc[t]=(tc[t]||0)+1});
  const ov=document.createElement('div');ov.className='mvov';ov.id='customModal';
  ov.innerHTML=`<div class="mvbox"><b>${T(`चुने गए ${keys.length} प्रश्नों को किस टॉपिक में भेजना है?`,`Move the ${keys.length} selected questions to topic:`)}</b><select id="targetTopicSelect" style="width:100%;margin:10px 0">${Object.keys(tc).sort().map(t=>`<option value="${esc(t)}">📌 ${esc(t)} (${tc[t]})</option>`).join('')}<option value="__new__">${T('➕ नया टॉपिक बनाएं...','➕ Create new topic...')}</option></select><div class="nav"><button class="btn gray" onclick="closeM('customModal')">${T('रद्द करें','Cancel')}</button><button class="btn" onclick="executeMove()">${T('भेजें','Send')}</button></div></div>`;
  document.body.appendChild(ov);
}
function applyMove(keys,name){keys.forEach(k=>{OV[k]=name});try{localStorage.setItem('examTopics',JSON.stringify(OV))}catch(e){}SEL={};closeM('customModal');closeM('promptModal');renderCards();toast(T(`✅ ${keys.length} प्रश्न "${name}" में भेज दिए गए हैं!`,`✅ ${keys.length} questions moved to "${name}"!`))}
function executeMove(){const v=$('targetTopicSelect').value;if(v==='__new__'){openNewTopic();return}applyMove(selKeys(),v)}
function openNewTopic(){
  closeM('promptModal');const ov=document.createElement('div');ov.className='mvov';ov.id='promptModal';
  ov.innerHTML=`<div class="mvbox"><b>${T('नए टॉपिक का नाम दर्ज करें:','Enter new topic name:')}</b><input type="text" id="newTopicNameInput" style="width:100%;margin:10px 0;box-sizing:border-box"><div class="nav"><button class="btn gray" onclick="closeM('promptModal')">${T('रद्द करें','Cancel')}</button><button class="btn" onclick="saveNewTopic()">${T('सहेजें (Save)','Save')}</button></div></div>`;
  document.body.appendChild(ov);const i=$('newTopicNameInput');if(i&&i.focus)i.focus();
}
function saveNewTopic(){const v=($('newTopicNameInput').value||'').trim();if(!v)return;applyMove(selKeys(),v)}
function confirmReset(){
  const keys=selKeys(),tgt=keys.length?ALL.filter(o=>SEL[o.key]):VIS;
  if(!tgt.length)return;
  if(!confirm(T(`${tgt.length} प्रश्नों की प्रोग्रेस रीसेट करें?`,`Reset progress of ${tgt.length} questions?`)))return;
  tgt.forEach(o=>delete REC[o.key]);saveR();SEL={};renderCards();
}
function draw(){renderCards()}
load().catch(e=>{try{console.error(e)}catch(x){}$('main').innerHTML='<div class="card empty" style="text-align:center">प्रश्न लोड नहीं हो पाए। पेज दोबारा खोलें।</div>'});
</script></body></html>

<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta http-equiv="Cache-Control" content="no-cache, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Planner & Target With Current Affairs</title>
<link rel="stylesheet" href="app.css?v=5">
<style>
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero{background:linear-gradient(135deg,#7c3aed,#db2777,#f59e0b);color:#fff;border-radius:22px;padding:16px;margin-bottom:12px}
.hero h1{margin:0;font-size:19px;font-weight:600;color:#fff;display:flex;align-items:center;gap:10px}.hero p{margin:4px 0 0;font-size:12px;opacity:.95}
.cal{display:inline-flex;flex-direction:column;flex:none;width:36px;border-radius:7px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);line-height:1;text-align:center}
.cal i{background:#d93025;color:#fff;font-size:9px;font-weight:700;padding:3px 0 2px;font-style:normal;letter-spacing:.5px}
.cal b{color:#202124;font-size:17px;font-weight:700;padding:3px 0 4px}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.rbtn{border:0;padding:8px 16px;border-radius:22px;background:#fff;color:#7c3aed;font-weight:700;cursor:pointer;font-size:13px}
.rbtn.on{background:#d93025;color:#fff}
.bar{height:10px;background:#e8eaed;border-radius:20px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#188038,#1a73e8,#7c3aed);border-radius:20px;transition:width .4s}
.rowt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:500}
.mut{color:var(--mt);font-size:12px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}.ctl>div{flex:1;min-width:120px}
.ctl label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--mt);margin-bottom:3px}
.ctl select{width:100%}
.sc{display:flex;gap:8px;margin-top:10px}
.sc div{flex:1;text-align:center;background:var(--bg);border-radius:12px;padding:8px}
.sc b{display:block;font-size:19px;font-weight:700}.sc span{font-size:11px;color:var(--mt)}
.dc{border-left:6px solid #cbd5e1}
.dc[data-s=correct]{border-left-color:var(--gr);background:linear-gradient(180deg,#e6f4ea,#fff)!important}
.dc[data-s=wrong]{border-left-color:var(--rd);background:linear-gradient(180deg,#fce8e6,#fff)!important}
.ch{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.dt{font-size:11px;font-weight:700;background:var(--bg);padding:4px 10px;border-radius:14px;color:var(--mt)}
.sb{padding:3px 10px;border-radius:14px;font-size:10px;font-weight:700;text-transform:uppercase;background:var(--am2);color:#b06000}
.dc[data-s=correct] .sb{background:var(--gr2);color:var(--gr)}.dc[data-s=wrong] .sb{background:var(--rd2);color:var(--rd)}
.dc h3{margin:8px 0 4px;line-height:1.35}.ds{color:var(--mt);line-height:1.55;white-space:pre-wrap}
.qb{margin-top:10px;padding:11px;background:var(--bg);border-radius:12px}
.qq{font-weight:700;margin-bottom:8px;white-space:pre-wrap}
.ab{background:#334155;color:#fff;padding:11px;border-radius:10px;cursor:pointer;text-align:center;font-weight:600;font-size:12px}
.ab.rv{background:var(--gr2);color:var(--tx);border:1.5px solid #a8dab5;text-align:left;font-size:14px;white-space:pre-wrap}
.ev{margin-top:10px;padding-top:10px;border-top:1px dashed #cbd5e1;text-align:center}
.ev .l{display:block;font-size:12px;font-weight:700;color:var(--mt);margin-bottom:8px}
.ev button{border:0;padding:9px 22px;border-radius:22px;color:#fff;font-weight:700;cursor:pointer;margin:0 5px}
.ev .y{background:var(--gr)}.ev .n{background:var(--rd)}
.rm{font-weight:700;margin-top:8px;text-align:center}
details{margin-top:8px}details summary{cursor:pointer;font-weight:500}details div{margin-top:6px;line-height:1.55;white-space:pre-wrap;color:var(--tx)}
.mo{text-align:center;font-weight:600;font-size:12.5px;color:#7c3aed;margin-top:10px}
.cf{position:fixed;pointer-events:none;z-index:1000;font-size:22px;animation:fall 1s ease forwards}
@keyframes fall{to{transform:translateY(220px) rotate(180deg);opacity:0}}
</style></head><body>
<div class="top"><b>🎯 Daily Planner & Target</b><a href="home.html">🏠 Home</a></div>
<div class="wrap">
  <div class="hero">
    <h1><span class="cal" id="calB"><i></i><b></b></span><span id="hT"></span></h1><p id="hS">रोज़ पढ़ो, खुद जाँचो, Target पूरा करो 🔥</p>
    <div class="chips"><button id="rb" class="rbtn" onclick="toggleRev()"></button></div>
  </div>

  <div class="card">
    <div class="rowt"><span id="pgL">📊 Progress</span><span id="pgT">0%</span></div>
    <div class="bar"><i id="pgBar"></i></div>
    <div class="ctl" style="margin-top:12px">
      <div><label>भाषा / Lang</label><select id="fl" onchange="setLang(this.value)"><option value="hi">हिंदी</option><option value="en">English</option></select></div>
      <div><label>Subject</label><select id="fs" onchange="F.subject=this.value;render()"></select></div>
      <div><label>Date</label><select id="fd" onchange="F.date=this.value;render()"></select></div>
      <div><label>Sort / Mode</label><select id="fo" onchange="sortChange(this.value)">
        <option value="newest">Newest First ✨</option><option value="oldest">Oldest First</option><option value="wrong-first">Wrong First ❌</option><option value="correct-first">Correct First ✅</option><option value="reattempt-wrong">Re-attempt Wrong 🔁</option><option value="reattempt-correct">Re-attempt Correct 🔁</option></select></div>
    </div>
    <div class="sc"><div><b id="cC" style="color:var(--gr)">0</b><span id="cCL">✅ सही</span></div><div><b id="cW" style="color:var(--rd)">0</b><span id="cWL">❌ गलत</span></div><div><b id="cR" style="color:var(--am)">0</b><span id="cRL">⏳ बाकी</span></div></div>
    <div class="mo" id="mo"></div>
  </div>

  <div id="list"></div>
</div>
<script src="nav.js?v=5"></script>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ls=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const K={st:'dailyStatusV1',lang:'dailyLang'};
let ITEMS=[],ST=ls(K.st,{}),lang=ls(K.lang,'hi');
let revMode=false,active=null,lastRes=null,loaded=false;
const F={subject:'all',date:'all',sort:'newest'};
const T=(h,e)=>lang==='hi'?h:e;
const st=id=>(ST[id]&&ST[id].s)||'unanswered';
// आज की तारीख़ के हिसाब से कैलेंडर आइकन
(function(){const d=new Date();const b=$('calB');b.firstChild.textContent=d.toLocaleString('en',{month:'short'}).toUpperCase();b.lastChild.textContent=d.getDate()})();

async function init(){
  try{
    const r=await fetch('daily.json',{cache:'no-cache'});if(!r.ok)throw 0;
    const d=await r.json();const arr=Array.isArray(d)?d:(d.items||[]);
    ITEMS=arr.filter(n=>n&&n.q&&n.a).map((n,i)=>{
      const subject=String(n.subject||'General').trim();
      return {...n,id:String(n.id||('i'+i)).replace(/[^A-Za-z0-9_-]/g,''),date:String(n.date||'').slice(0,10),subject,subjectHi:n.subjectHi||subject,_i:i};
    });
    loaded=true;
  }catch(e){loaded=false}
  $('fl').value=lang;buildFilters();applyLang();render();
}
function buildFilters(){
  const subs=[...new Map(ITEMS.map(i=>[i.subject,i])).values()];
  const dates=[...new Set(ITEMS.map(i=>i.date))].sort().reverse();
  $('fs').innerHTML=`<option value="all">${T('सभी / All','All')}</option>`+subs.map(i=>`<option value="${esc(i.subject)}">${esc(lang==='hi'?i.subjectHi:i.subject)}</option>`).join('');
  $('fd').innerHTML=`<option value="all">${T('सभी / All','All')}</option>`+dates.map(d=>`<option value="${esc(d)}">${esc(fmt(d))}</option>`).join('');
  if(![...$('fs').options].some(o=>o.value===F.subject))F.subject='all';
  if(![...$('fd').options].some(o=>o.value===F.date))F.date='all';
  $('fs').value=F.subject;$('fd').value=F.date;$('fo').value=F.sort;
}
function fmt(d){const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function setLang(l){lang=l;lsSet(K.lang,l);buildFilters();applyLang();render()}
function applyLang(){
  $('hT').textContent='Daily Planner & Target With Current Affairs';
  $('hS').textContent=T('रोज़ पढ़ो, खुद जाँचो, Target पूरा करो 🔥','Read daily, self-check, hit your target 🔥');
  $('pgL').textContent=T('📊 Progress','📊 Progress');
  $('cCL').textContent=T('✅ सही','✅ Correct');$('cWL').textContent=T('❌ गलत','❌ Wrong');$('cRL').textContent=T('⏳ बाकी','⏳ Remaining');
  $('rb').textContent=revMode?T('❌ बंद करें','❌ Exit'):T('🎯 सेल्फ-रिवीजन','🎯 Self-Revision');
  $('mo').textContent=revMode?T('🎯 उत्तर देखो → "हाँ/नहीं" चुनो | Latest status सेव होगा | गलत हो तो भी घबराना नहीं!','🎯 Reveal answer → pick Yes/No | Latest status is saved | Wrong is fine, keep learning!'):'';
}
function toggleRev(){revMode=!revMode;if(!revMode){active=null;lastRes=null}$('rb').classList.toggle('on',revMode);applyLang();render()}
function sortChange(v){F.sort=v;if((v==='reattempt-wrong'||v==='reattempt-correct')&&!revMode)toggleRev();else render()}
function visible(){return ITEMS.filter(i=>(F.subject==='all'||i.subject===F.subject)&&(F.date==='all'||i.date===F.date))}
function updateScore(){
  let c=0,w=0,r=0;visible().forEach(i=>{const s=st(i.id);if(s==='correct')c++;else if(s==='wrong')w++;else r++});
  const t=c+w+r,p=t?Math.round((c+w)/t*100):0;
  $('cC').textContent=c;$('cW').textContent=w;$('cR').textContent=r;
  $('pgBar').style.width=p+'%';$('pgT').textContent=p+'% '+T('पूरा','Complete');
}
function pick(i,k){const e=lang==='en'&&i[k+'En'];return e?e:i[k]||''}
function cardHTML(i){
  const s=st(i.id),res=lastRes&&lastRes.id===i.id?lastRes.s:null,act=active===i.id,rv=act||!!res;
  const sl=s==='correct'?T('सही','Correct'):s==='wrong'?T('गलत','Wrong'):T('बाकी','Unanswered');
  let h=`<div class="card dc" id="c-${i.id}" data-s="${s}"><div class="ch"><span class="dt">${esc(fmt(i.date))} • ${esc(lang==='hi'?i.subjectHi:i.subject)}${i.topic?' • '+esc(i.topic):''}</span><span class="sb">${sl}</span></div>`;
  // शीर्षक व विवरण सिर्फ़ सामान्य मोड में; सेल्फ-रिवीजन मोड में नहीं (वहाँ जवाब छिपा रहना चाहिए)
  if(!revMode){
    if(i.title||i.titleEn)h+=`<h3>${esc(pick(i,'title'))}</h3>`;
    if(i.desc||i.descEn)h+=`<div class="ds">${esc(pick(i,'desc'))}</div>`;
  }
  if(revMode){
    h+=`<div class="qb"><div class="qq">${esc(pick(i,'q'))}</div><div class="ab${rv?' rv':''}" onclick="reveal('${i.id}')">${rv?esc(pick(i,'a')):T('👆 उत्तर देखने के लिए टैप करें ✨','👆 Tap to reveal answer ✨')}</div>`;
    if(act&&!res)h+=`<div class="ev"><span class="l">${T('क्या आपने सही सोचा था? 🤔','Did you get it right? 🤔')}</span><button class="y" onclick="mark('${i.id}','correct')">${T('✅ हाँ','✅ Yes')}</button><button class="n" onclick="mark('${i.id}','wrong')">${T('❌ नहीं','❌ No')}</button></div>`;
    if(res)h+=`<div class="rm" style="color:var(${res==='correct'?'--gr':'--rd'})">${res==='correct'?T('🎉 ✓ सही! शानदार!','🎉 ✓ Correct!'):T('💪 ✗ गलत - कोई बात नहीं, अब याद हो गया!','💪 ✗ Wrong - no worries, now you know it!')}</div>`;
    h+='</div>';
  }
  if(i.more||i.moreEn)h+=`<details><summary>👁 ${T('पूरी जानकारी / News','Full details / News')}</summary><div>${esc(pick(i,'more'))}</div></details>`;
  return h+'</div>';
}
function render(){
  const L=$('list');
  if(!loaded){L.innerHTML=`<div class="card empty" style="text-align:center;padding:24px">daily.json नहीं मिली। Server/hosting से खोलें।</div>`;updateScore();return}
  if(!ITEMS.length){L.innerHTML=`<div class="card empty" style="text-align:center;padding:24px">📭 अभी कोई data नहीं है।<br>admin.html में "Daily Data" से data जोड़कर daily.json upload करें।</div>`;updateScore();return}
  let v=visible();
  if(F.sort==='reattempt-wrong')v=v.filter(i=>st(i.id)==='wrong');
  if(F.sort==='reattempt-correct')v=v.filter(i=>st(i.id)==='correct');
  const pr={'wrong-first':{wrong:1,unanswered:2,correct:3},'correct-first':{correct:1,unanswered:2,wrong:3}}[F.sort];
  v.sort((a,b)=>{
    if(F.sort==='oldest'){return a.date!==b.date?a.date.localeCompare(b.date):a._i-b._i}
    if(pr){const x=pr[st(a.id)]-pr[st(b.id)];if(x)return x;return a._i-b._i}
    return a.date!==b.date?b.date.localeCompare(a.date):b._i-a._i;
  });
  if(!v.length){
    const w=F.sort==='reattempt-wrong',r=F.sort==='reattempt-correct';
    L.innerHTML=`<div class="card empty" style="text-align:center;padding:24px"><div style="font-size:34px">📭</div><b>${w?T('कोई गलत प्रश्न बाकी नहीं है 🎉','No wrong questions left 🎉'):r?T('कोई सही प्रश्न नहीं मिला','No correct questions yet'):T('कोई प्रश्न नहीं मिला','No questions found')}</b><div class="mut">${T('इस selection में कोई प्रश्न उपलब्ध नहीं है।','No question is available for this selection.')}</div></div>`;
  }else L.innerHTML=v.map(cardHTML).join('');
  updateScore();
}
function paint(id){const i=ITEMS.find(x=>x.id===id),e=$('c-'+id);if(i&&e){e.outerHTML=cardHTML(i)}}
function reveal(id){
  if(!revMode)return;
  if(active!==null&&active!==id){alert(T('पहले पिछले प्रश्न का उत्तर दर्ज करें।','Please answer the previous question first.'));return}
  const prev=lastRes&&lastRes.id;lastRes=null;active=id;
  if(prev&&prev!==id)paint(prev);paint(id);
}
function confetti(){['🎉','⭐','🔥','💯','🎊'].forEach(em=>{const d=document.createElement('div');d.className='cf';d.textContent=em;d.style.left=(30+Math.random()*40)+'%';d.style.top='30%';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)})}
function mark(id,s){
  ST[id]={s,t:Date.now()};lsSet(K.st,ST);
  if(s==='correct')confetti();
  active=null;lastRes={id,s};paint(id);updateScore();
  if(F.sort==='reattempt-wrong'||F.sort==='reattempt-correct')setTimeout(()=>{lastRes=null;render()},1100);
}
init();
</script></body></html>
